    (function () {
      var el   = document.getElementById('splash');
      var fill = document.getElementById('splash-fill');
      var ph   = document.getElementById('splash-phase');
      var cur  = 0;

      window.__splash = {
        setProgress: function (v) {
          // Monotonic — never go backwards
          v = Math.max(0, Math.min(1, v));
          if (v < cur) return;
          cur = v;
          if (fill) fill.style.width = (v * 100).toFixed(1) + '%';
        },
        setPhase: function (text) {
          if (ph) ph.textContent = text || '';
        },
        hide: function () {
          if (!el) return;
          this.setProgress(1);
          setTimeout(function () {
            el.classList.add('hidden');
            setTimeout(function () {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, 400);
          }, 120);
        }
      };
    })();
  </script>
