      <canvas id="unity-canvas" wg-game-orientation="wg-landscape-game" style="width: 500px; height: 281px;"></canvas>
    </div>
    <div id="loading-cover" style="">
      <div id="unity-loading-bar">
        <div id="unity-logo"><img src="logo.png"></div>
        <div id="unity-progress-bar-empty" style="display: none;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <div id="unity-fullscreen-button" style="display: none;"></div>
    <script>
  const hideFullScreenButton = "1";
  const buildUrl = "Build";
  const loaderUrl = buildUrl + "/BUILD.loader.js";
  const config = {
    dataUrl: buildUrl + "/BUILD.data.unityweb",
    frameworkUrl: buildUrl + "/BUILD.framework.js.unityweb",
    codeUrl: buildUrl + "/BUILD.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "LambGameDev",
    productName: "StrangePost",
    productVersion: "1.0",
  };

  const container = document.querySelector("#unity-container");
  const canvas = document.querySelector("#unity-canvas");
  const loadingCover = document.querySelector("#loading-cover");
  const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  const fullscreenButton = document.querySelector("#unity-fullscreen-button");
  const spinner = document.querySelector('.spinner');

  const canFullscreen = (function() {
    for (const key of [
      'exitFullscreen', 'webkitExitFullscreen', 'webkitCancelFullScreen',
      'mozCancelFullScreen', 'msExitFullscreen',
    ]) {
      if (key in document) return true;
    }
    return false;
  }());

  // --- [ДОБАВЛЕНО] Функция жёсткой подгонки 16:9 ---
  function fit16x9() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    let w = vw;
    let h = Math.round(vw * 9 / 16);
    if (h > vh) { h = vh; w = Math.round(vh * 16 / 9); }
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
  }

  // Мобильные: класс шаблона и DPI
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    container.className = "unity-mobile";
    // Ограничим DPR, чтобы не было «диких» значений на телефонах
    config.devicePixelRatio = Math.min(2, window.devicePixelRatio || 1);
  } else {
    // И на десктопах тоже лучше ограничить
    config.devicePixelRatio = Math.min(2, window.devicePixelRatio || 1);
  }

  loadingCover.style.display = "";

  // --- [ДОБАВЛЕНО] Слушатели для корректного ресайза ---
  window.addEventListener('resize', fit16x9, { passive: true });
  window.addEventListener('orientationchange', fit16x9, { passive: true });

  // Первичная подгонка до старта инстанса
  fit16x9();

  const script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      spinner.style.display = "none";
      progressBarEmpty.style.display = "";
      progressBarFull.style.width = `${100 * progress}%`;
    }).then((unityInstance) => {
      loadingCover.style.display = "none";
      // На всякий случай – ещё раз подгоняем после загрузки
      fit16x9();

      if (canFullscreen) {
        if (!hideFullScreenButton) {
          fullscreenButton.style.display = "";
        }
        fullscreenButton.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }
    }).catch((message) => {
      console.log(message);
    });
  };
  document.body.appendChild(script);
</script><script src="Build/BUILD.loader.js"></script>
