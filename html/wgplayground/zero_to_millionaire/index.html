  <!-- Pause overlay -->
  <div id="pauseOverlay" aria-hidden="true" role="button" tabindex="0" aria-label="Paused">
    <div class="card">
      <h1>Paused</h1>
      <p>Click the screen to continue!</p>
      <div class="hint">If the sound didn’t resume — tap/click again.</div>
      <div class="btn" aria-label="Continue">Continue</div>
    </div>
  </div>

  <script>
    const hideFullScreenButton = "1";
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/BUILD.loader.js";
    const config = {
      dataUrl: buildUrl + "/BUILD.data.unityweb",
      frameworkUrl: buildUrl + "/BUILD.framework.js.unityweb",
      codeUrl: buildUrl + "/BUILD.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "LambGameDev",
      productName: "IdleGuy",
      productVersion: "0.0.0.3",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");
    const spinner = document.querySelector(".spinner");
    const pauseOverlay = document.getElementById("pauseOverlay");

    (function initI18n() {
      const SUPPORTED = ["ru", "en", "it", "tr", "de", "fr"];

      function normLang(l) {
        if (!l) return null;
        const short = String(l).toLowerCase().split("-")[0];
        return SUPPORTED.includes(short) ? short : null;
      }

      // 1) URL: _gp_lang (GamePush) → lang
      const url = new URL(location.href);
      const qp_gp = normLang(url.searchParams.get("_gp_lang"));
      const qp_std = normLang(url.searchParams.get("lang"));
      const qp = qp_gp || qp_std;

      // 2) localStorage (оба ключа на всякий случай)
      const stored_gp = normLang(localStorage.getItem("_gp_lang"));
      const stored_std = normLang(localStorage.getItem("lang"));
      const stored = stored_gp || stored_std;

      // 3) язык браузера
      const nav = normLang(navigator.language || navigator.userLanguage);

      // Итоговый выбор по приоритету
      const lang = qp || stored || nav || "en";

      // Если в URL явный выбор — перезапишем хранилище (чтобы сразу сработало)
      if (qp) {
        localStorage.setItem("_gp_lang", lang);
        localStorage.setItem("lang", lang);
      } else if (!stored) {
        // Если ещё не было сохранения — запомним автоопределённый
        localStorage.setItem("_gp_lang", lang);
        localStorage.setItem("lang", lang);
      }

      // Определим «tap/click» в зависимости от устройства
      const isTouchPrimary = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

      const ACTION = {
        ru: isTouchPrimary ? "Нажмите" : "Кликните",
        en: isTouchPrimary ? "Tap" : "Click",
        it: isTouchPrimary ? "Tocca" : "Fai clic",
        tr: isTouchPrimary ? "Dokunun" : "Tıklayın",
        de: isTouchPrimary ? "Tippe" : "Klicke",
        fr: isTouchPrimary ? "Touchez" : "Cliquez"
      };

      const T = {
        ru: {
          title: "Пауза",
          text: `${ACTION.ru} на экран, чтобы продолжить!`,
          hint: "Если звук не возобновился — нажмите ещё раз.",
          btn: "Продолжить",
          titleTag: "Игра"
        },
        en: {
          title: "Paused",
          text: `${ACTION.en} the screen to continue!`,
          hint: "If the sound didn’t resume — tap/click again.",
          btn: "Continue",
          titleTag: "Game"
        },
        it: {
          title: "In pausa",
          text: `${ACTION.it} sullo schermo per continuare!`,
          hint: "Se l’audio non riprende, tocca/fai clic di nuovo.",
          btn: "Continua",
          titleTag: "Gioco"
        },
        tr: {
          title: "Duraklatıldı",
          text: `Devam etmek için ekrana ${isTouchPrimary ? "dokunun" : "tıklayın"}!`,
          hint: "Ses devam etmediyse, tekrar deneyin.",
          btn: "Devam et",
          titleTag: "Oyun"
        },
        de: {
          title: "Pausiert",
          text: `${isTouchPrimary ? "Zum Fortfahren den Bildschirm berühren" : "Zum Fortfahren klicken"}!`,
          hint: "Wenn der Ton nicht fortgesetzt wurde, erneut tippen/klicken.",
          btn: "Weiter",
          titleTag: "Spiel"
        },
        fr: {
          title: "Pause",
          text: `${ACTION.fr} l’écran pour continuer !`,
          hint: "Si le son ne reprend pas, touchez/cliquez à nouveau.",
          btn: "Continuer",
          titleTag: "Jeu"
        }
      };

      function apply() {
        const dict = T[lang] || T.en;

        const h1 = document.querySelector("#pauseOverlay h1");
        const p = document.querySelector("#pauseOverlay p");
        const hint = document.querySelector("#pauseOverlay .hint");
        const btn = document.querySelector("#pauseOverlay .btn");
        const titleTag = document.querySelector("title");

        if (h1) h1.textContent = dict.title;
        if (p) p.textContent = dict.text;
        if (hint) hint.textContent = dict.hint;
        if (btn) btn.textContent = dict.btn;

        // Меняем <title>, если он пуст/плейсхолдер
        if (titleTag && (!titleTag.textContent || !/\S/.test(titleTag.textContent))) {
          titleTag.textContent = dict.titleTag;
        }

        // ARIA
        const overlay = document.getElementById("pauseOverlay");
        if (overlay) overlay.setAttribute("aria-label", dict.title);
        if (btn) btn.setAttribute("aria-label", dict.btn);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", apply, { once: true });
      } else {
        apply();
      }
    })();

    // ----------- Фит 9:16 (портрет) -----------
    function fit9x16() {
      const vw = window.innerWidth, vh = window.innerHeight;
      let h = vh;
      let w = Math.round(vh * 9 / 16);
      if (w > vw) { w = vw; h = Math.round(vw * 16 / 9); }
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = Math.min(2, window.devicePixelRatio || 1);
    } else {
      config.devicePixelRatio = Math.min(2, window.devicePixelRatio || 1);
    }


    loadingCover.style.display = "";
    window.addEventListener("resize", fit9x16, { passive: true });
    window.addEventListener("orientationchange", fit9x16, { passive: true });
    fit9x16();

    // ---- вспомогательные для паузы ----
    function getUnityAudioContext() {
      const ui = window.unityInstance;
      return ui?.audioContext
        || ui?.audio?.context
        || ui?.Module?.SDL2?.audioContext
        || null;
    }
    function showPauseOverlay() { pauseOverlay.classList.add("visible"); }
    function hidePauseOverlay() { pauseOverlay.classList.remove("visible"); }

    function resumeUnityIfNeeded() {
      try {
        const ui = window.unityInstance;
        if (ui?.Module) {
          if (typeof ui.Module.resumeMainLoop === "function") ui.Module.resumeMainLoop();
          if (typeof ui.Module.setPause === "function") ui.Module.setPause(0);
          if (typeof ui.Module.resume === "function") ui.Module.resume();
        }
        const ctx = getUnityAudioContext();
        if (ctx && ctx.state === "suspended" && typeof ctx.resume === "function") {
          ctx.resume().catch(() => { });
        }
      } catch (e) { }
      hidePauseOverlay();
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) showPauseOverlay(); else resumeUnityIfNeeded();
    });
    window.addEventListener("focus", resumeUnityIfNeeded);
    window.addEventListener("pageshow", resumeUnityIfNeeded);
    window.addEventListener("blur", showPauseOverlay, { passive: true });

    pauseOverlay.addEventListener("click", resumeUnityIfNeeded);
    pauseOverlay.addEventListener("pointerdown", resumeUnityIfNeeded, { passive: true });

    const unlockOnce = () => {
      resumeUnityIfNeeded();
      document.removeEventListener("pointerdown", unlockOnce);
      document.removeEventListener("keydown", unlockOnce);
    };
    document.addEventListener("pointerdown", unlockOnce, { passive: true });
    document.addEventListener("keydown", unlockOnce);

    // ---------- Загрузка Unity loader ----------
    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${(progress * 100) | 0}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
        fit9x16();
        const canFullscreen = ["exitFullscreen", "webkitExitFullscreen", "mozCancelFullScreen", "msExitFullscreen"]
          .some(k => k in document);
        if (canFullscreen && !hideFullScreenButton) {
          fullscreenButton.style.display = "";
          fullscreenButton.onclick = () => unityInstance.SetFullscreen(1);
        }
        resumeUnityIfNeeded();
      }).catch((msg) => alert(msg));
    };
    document.body.appendChild(script);
  </script><script src="Build/BUILD.loader.js"></script>
