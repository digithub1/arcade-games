            <meta property="wgp:description" content="Two players play on the field - blue and red. They move in turns, placing a dot at the intersection of lines. One dot is placed in one move and it does not move anymore. It is necessary to surround the opponent's dots, not allowing your own to be surrounded. The player who captures more dots wins.You can play the game with artificial intelligence, together with another person on one device, or with an opponent online in multiplayer mode.The size of the playing field can be selected from: 10x10, 15x15, 20x20, 25x25, 30x30 points. A point is an intersection of lines on the field.">
            <meta property="wgp:instructions" content="Players can move to free points that are not occupied by dots or not included in the encirclement. There is no option to skip a move.When creating a continuous (vertical, horizontal, diagonal) closed line, an encirclement area is formed. If there are opponent's points inside it (there may be points not occupied by anyone's points), then this is considered an encirclement area. If there are no opponent's points, then the area is free and points can be placed in it. Points that fall into the encirclement area do not participate in the formation of encirclement lines. Points placed on the edge of the field are not surrounded.The game ends in one of the following cases:- When there are no free spaces left on the field.- If the number of points required for victory is set, the game is played until one of the players encircles this set number of opponent's points.">
