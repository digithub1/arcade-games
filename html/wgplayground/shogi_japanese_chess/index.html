            <meta property="wgp:description" content="The players make their moves one at a time. The whites go first. A move is the movement of one of the pieces of its color available on the board to any allowed field according to the rules of movement of the pieces or the setting of a piece that is in reserve. The pieces in reserve are pieces taken from the opponent.When the figures reach the enemy's camp, they can be strengthened, transformed. When transformed, the figure turns over. Any figure can strengthen, except for the king and the golden general.The goal of the game is to checkmate the opponent's king. It is considered that a checkmate has been placed when the king is under attack by an enemy piece, i.e. he is in a field where the enemy piece can resemble, but there is no way to defend himself or leave.You can play with artificial intelligence, together with another person on the same device, or with a rival online in multiplayer mode.">
            <meta property="wgp:instructions" content="- The King. Moves to the same field in any direction, except for the field under the opponent's check.- The rook. It moves horizontally and vertically to any number of fields not occupied by other shapes. Upon reaching the enemy camp, it can be transformed into the dragon king, a figure that, while maintaining the Rook's capabilities, can additionally move diagonally in any direction onto the same field.- The elephant. Moves diagonally in any direction to any number of fields not occupied by other pieces. Upon reaching the enemy camp, he can be transformed into a dragon knight, a figure that, while retaining the bishop's capabilities, can additionally walk vertically or horizontally in any direction on the same field.- The Golden General. It can move one field horizontally or vertically in any direction, as well as diagonally forward.- The Silver General. It can move one field diagonally in any direction or one field vertically forward. After reaching the enemy camp, he can be transformed into a golden general.- The horse. The knight's move is one square vertically forward, then one square diagonally to the right or left without the possibility of retreat. After reaching the enemy camp, he can be transformed into a golden general.- The spear. It only moves forward vertically to any number of fields that are not occupied by other shapes. Upon reaching the enemy camp, he can be transformed into a golden general.- A pawn. It moves one field forward vertically. He hits enemy pieces not diagonally, as in chess, but straight in front of him. After reaching the enemy camp, she can be transformed into a golden general.">
