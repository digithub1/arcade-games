  <script>
  let lang = navigator.language || navigator.userLanguage;
const ruGroup = ['ru', 'be', 'kk', 'uk', 'uz'];

function detectLang() {
  // ✅ 1. ПРИОРИТЕТ — query (?lang=en)
  const params = new URLSearchParams(window.location.search);
  let lang = params.get("lang");

  // ✅ 2. Если нет — пробуем из URL (на будущее)
  if (!lang) {
    const path = window.location.pathname.toLowerCase();
    const parts = path.split('/').filter(Boolean);
    let lastPart = parts[parts.length - 1];

    if (lastPart && lastPart.length === 2) {
      lang = lastPart;
    }
  }

  // ✅ 3. fallback — язык браузера
  if (!lang) {
    lang = (navigator.language || "en").substring(0, 2);
  }

  return lang.toLowerCase();
}

function applyLocalization() {
  const centerImage = document.getElementById('center-image');
  const cornerImage = document.getElementById('corner-image');

  if (!centerImage || !cornerImage) return;

  const lang = detectLang();

  if (ruGroup.includes(lang)) {
    centerImage.src = './MainImage.png';
    cornerImage.src = './logo.png';
  } else {
    centerImage.src = './MainImageEng.png';
    cornerImage.src = './logoEng.png';
  }
}
