            <meta property="wgp:description" content="All the rules of ordinary chess are preserved, even castling and taking on the passage. The main difference is that the pieces are not cut down, but captured, taking up a position on the opponent's piece and thus forming towers. Thus, all the pieces remain on the chessboard until the end of the game. Captured pieces can be released during the game.The game can be played with artificial intelligence, together with another person on the same device, or with a rival online in multiplayer mode. You can also watch other players' games, act as a spectator, and offer your own version of the player's next move by making it on the board.">
            <meta property="wgp:instructions" content="Each pawn is positioned opposite the piece it turns into on the last horizontal.Towers can be built from your own pieces; the most powerful structure consists of two bishops, a queen, and a helga located underneath.The entire tower can be moved according to the rules of movement of the upper figure.During its turn, the tower can only be divided into two parts in any ratio.The newly formed tower becomes active immediately after the division, and if it is located on the last horizontal and there is a pawn (warrior) on top, it immediately turns into its own piece.No pieces can be placed on the king (Magus).If a warrior who has turned into his own figure participates in the exchange and the opponent's figure stands on him, then he again becomes an ordinary warrior, and he must be moved to the last horizontal to transform.The game is won by the player who checkmated his partner's magus.">
