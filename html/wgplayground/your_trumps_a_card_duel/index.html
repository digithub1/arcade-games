            <meta property="wgp:description" content="This is a single-attack game, the earliest printed descriptions of which date back to the 19th century.During the game, the players place the cards from their hands into an open deck in the center of the table. The goal of the game is to get rid of all your cards. A player who cannot make a move must draw one or more cards from the top of the deck. The player who plays all his cards wins. The player who has the remaining cards is considered the loser.Each player chooses a trump suit before dealing the cards. The cards of the player's trump suit can be used to beat any card of any other suit.The game can be played with artificial intelligence or with an online opponent in multiplayer mode.">
            <meta property="wgp:instructions" content="The player starting the game places any card face up in the center of the table to start the playing deck. The next player has two options:- A player can beat the top card of the game stack by playing a higher card of the same suit or by playing one of his trumps on a card of a different suit. After doing this, the player must play another card on top of it; this second card can be any card of the player's choice.- A player who cannot beat the top card of the game stack must instead take some cards from the top of the game stack.The goal of the game is to get rid of all your cards. When a player runs out of cards, he wins the game, and his opponent loses. If the last player in the game has only one card that can be used to beat the previous player's kara, then the game ends in a draw.">
