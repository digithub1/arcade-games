  <script>
    const overlayBackgroundColor = "#000000";
    const progressBarFillColor = "#00FF00";
    const progressBarBackgroundColor = "#1A1A1A";
    const progressBarBorderColor = "#00C853";
    const backgroundFileName = "";

    // Подавляем браузерные диалоги ДО загрузки любого SDK.
    // VK/GamePush могут вызвать window.alert или window.confirm при ошибке платежа.
    window.alert   = function(m) { console.error('[alert suppressed]', m); };
    window.confirm = function(m) { console.warn('[confirm suppressed]', m); return false; };
  </script>

<style>
  /* Убираем выделение по нажатию клавиш */
  canvas:focus {
      outline: none;
  }

  html, body {
      /* Убираем отступы */

      user-select: none;

      /* Ставим высоту на 100% */
      height: 100%;
  }
</style>

<style type="text/css">body{overflow:hidden!important}body:not(.wgIsMidroll) [data-wgplayer]~.wgLoadingAnim{display:none!important}[data-wgplayer]:before{display:none!important}[data-wgplayer]{background:none!important}</style><style>.fadein{animation: 3s linear 0s fadein;}.splash-bg {visibility:hidden;object-fit: contain;position: absolute;left: 0;top: 0;filter: blur(3px) opacity(0.9);transform: scale(2.5) translate(-50%, -50%); top:50%; left:50%; z-index:-1;} .splash-bg.fadein{visibility:visible}canvas, iframe[data-src*="wgplayground.com"] {box-shadow: rgba(0, 0, 0, 0.6) 0px 0px 30px;}@keyframes fadein {from {opacity:0;}to {opacity:1;}}</style><script src="gamepush.js"></script></head>

<body class="dark wgNoLoader"><img class="splash-bg fadein" src="https://static.wgplayground.com/978ad2301f601ae393dec2b854913fe9/wgplayground/7b229d80fcc68f85a121aba94ebd42c5.jpg">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" style="background: rgb(0, 0, 0);" wg-game-orientation="wg-portrait-game"></canvas>
  </div>
  <div id="loading-cover" style="">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="logo.png"></div>
      <div id="unity-progress-bar-empty" style="background: rgb(26, 26, 26);">
        <div id="unity-progress-bar-full" style="background: rgb(0, 255, 0); width: 0%;"></div>
      </div>
      <div class="spinner" style="display: none;"></div>
    </div>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/PrisonPumpBuild.loader.js";
    const config = {
      dataUrl: buildUrl + "/PrisonPumpBuild.data.br",
      frameworkUrl: buildUrl + "/PrisonPumpBuild.framework.js.br",
      codeUrl: buildUrl + "/PrisonPumpBuild.wasm.br",
      // #if MEMORY_FILENAME
      //   memoryUrl: buildUrl + "/",
      // #endif
      // #if SYMBOLS_FILENAME
      //   symbolsUrl: buildUrl + "/",
      // #endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Multyplayer",
      productVersion: "0.1.0",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (overlayBackgroundColor !== " " && overlayBackgroundColor !== ""){
      canvas.style.background = overlayBackgroundColor;
    }

    if (progressBarFillColor !== " " && progressBarFillColor !== ""){
      progressBarFull.style.background = progressBarFillColor;
    }

    if (progressBarBackgroundColor !== " " && progressBarBackgroundColor !== ""){
      progressBarEmpty.style.background = progressBarBackgroundColor;
    }

    if (progressBarBorderColor !== " " && progressBarBorderColor !== ""){
      progressBarEmpty.style.border.color = progressBarBorderColor;
    }

    if (backgroundFileName !== " " && backgroundFileName !== ""){
      canvas.style.background = "url('" + backgroundFileName + "') center / cover";
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    // #if BACKGROUND_FILENAME
    // canvas.style.background = "url('" + buildUrl + "/') center / cover";
    // #endif

    loadingCover.style.display = "";

        // Выключаем появление меню при правом клике мыши
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Возвращаем фокус, если кликнули по экрану
        function FocusGame() {
            window.focus();
            canvas.focus();
        }

        window.addEventListener('pointerdown', () => {
            FocusGame();
        });
        window.addEventListener('touchstart', () => {
            FocusGame();
        });

    // ─── Pointer Lock API: подавляем SecurityError при выходе через ESC ─────
    // В современных браузерах requestPointerLock() возвращает Promise.
    // Если пользователь нажимает ESC до завершения Promise — браузер отклоняет
    // его с SecurityError. Unity не добавляет .catch(), поэтому ошибка всплывает.
    // Патчим requestPointerLock один раз до загрузки Unity — добавляем .catch().
    (function () {
      var orig = Element.prototype.requestPointerLock;
      if (!orig) return;
      Element.prototype.requestPointerLock = function () {
        var result = orig.apply(this, arguments);
        if (result && typeof result.catch === 'function') {
          result.catch(function () { /* SecurityError от ESC — игнорируем */ });
        }
        return result;
      };
    })();
    // ─────────────────────────────────────────────────────────────────────────

    // ─── Перехват необработанных Promise-ошибок от GamePush ──────────────────
    // Unity WebGL loader регистрирует глобальный обработчик ошибок.
    // Если GamePush SDK бросает payment_rejected / auth_rejected как
    // unhandled rejection — Unity ловит это и считает фатальной ошибкой,
    // что может вызвать крэш или перезапуск игры.
    // Мы перехватываем такие ошибки ДО загрузки Unity и отменяем их.
    window.addEventListener('unhandledrejection', function (event) {
      var msg = '';
      if (event.reason) {
        msg = (event.reason.message || String(event.reason)).toLowerCase();
      }
      // SecurityError от Pointer Lock (пользователь нажал ESC)
      if (event.reason && event.reason.name === 'SecurityError') {
        event.preventDefault();
        return;
      }
      var knownGamePushErrors = [
        'payment_rejected',
        'payment_canceled',
        'payment_failed',
        'auth_rejected',
        'auth_canceled',
        'auth_failed'
      ];
      for (var i = 0; i < knownGamePushErrors.length; i++) {
        if (msg.indexOf(knownGamePushErrors[i]) !== -1) {
          // Тихо подавляем — НЕ даём ошибке всплыть к Unity
          event.preventDefault();
          event.stopImmediatePropagation();
          return;
        }
      }
    }, true); // capture phase — срабатывает раньше Unity loader
    // ─────────────────────────────────────────────────────────────────────────

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = async () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        console.error(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script><script src="Build/PrisonPumpBuild.loader.js"></script>
