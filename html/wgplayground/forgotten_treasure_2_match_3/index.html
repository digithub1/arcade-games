              window.OnInitializedSdk = async function onInitializedSdk() {
                    console.log("Sdk Initialized");

                    // Начался показ рекламы
                    window.GamePush.ads.on('start', () => {window.StopBackgroundMusic();});
                    // Закончился показ рекламы
                    window.GamePush.ads.on('close', (success) => {window.PlayBackgroundMusic();});
                    // Выключили звук
                    window.GamePush.sounds.on('mute', () => {
                        // Необходимо выключить все звуки в игре
                        window.StopBackgroundMusic();
                    });
                    // Выключили звуковые эффекты
                    window.GamePush.sounds.on('mute:sfx', () => {
                        // Необходимо выключить звуковые эффекты (нажатия кнопок, шум стрельбы, звуки хотьбы, прыжков и прочего)
                        //window.StopBackgroundMusic();
                    });
                    // Выключили музыку
                    window.GamePush.sounds.on('mute:music', () => {
                        // Необходимо выключить музыку в игре
                        window.StopBackgroundMusic();
                    });
                    // Включили звук
                    window.GamePush.sounds.on('unmute', () => {
                        // Необходимо включить все звуки в игре
                        window.PlayBackgroundMusic();
                    });
                    // Включили звуковые эффекты
                    window.GamePush.sounds.on('unmute:sfx', () => {
                        // Необходимо включить звуковые эффекты в игре
                        //window.PlayBackgroundMusic();
                    });
                    // Включили музыку звуковые эффекты
                    window.GamePush.sounds.on('unmute:music', () => {
                        // Необходимо включить музыку в игре
                        window.PlayBackgroundMusic();
                    });

                    // Wait while the player syncs with the server
                    await window.GamePush.player.ready;
                    // Show the ad preloader and wait until it ends
                    await window.GamePush.ads.showPreloader();
                    // Show the sticky banner (then it will update itself)
                    window.ShowBanner();

                    window.LanguageCheck(window.GamePush.language);
                    window.InitializeAfterYandexInit();
                    window.InitInapps();
              }

              window.StopBackgroundMusic = function() {
                     try {
                            if(window.musicInstance != null) {
                                console.log("pause music");
                                window.musicInstance.mute(true);
                                }
                     } catch (e) {
                        console.log("error stop music " + e);
                     }
              }

              window.SetMusicState = function setMusicState(v, vol) {
                     window.musicState = v;
                     window.musicVolume = vol;
                     if(v)
                            window.PlayBackgroundMusic();
                     else
                            window.StopBackgroundMusic();
              }

              window.PlayBackgroundMusic = function() {
                       if(window.AdOnScreen)
                            return;
                       if(!window.musicState)
                            return;
                       if(!window.IsWebMusicOn())
                            return;
                       try {
                         if(window.musicInstance != null) {
                           console.log("play");
                           window.musicInstance.mute(false);
                           }
                       } catch (e) {
                        console.log("error play music " + e);
                       }
              }

              function handleMouseDown(evt) {
                if(!window.launchedMusicInHandle) {
                    window.launchedMusicInHandle = true;
                    initMusicOnce();
                }
                evt.preventDefault();
                evt.stopPropagation();
                window.focus();
              }

              function handleMouseUp(evt) {
                evt.preventDefault();
                evt.stopPropagation();
              }
              document.addEventListener('contextmenu', event => event.preventDefault());
              document.getElementById('embed-html').addEventListener('mousedown', handleMouseDown, false);
              document.getElementById('embed-html').addEventListener('mouseup', handleMouseUp, false);

</script>
