            <meta property="wgp:description" content="There are two players in the game. Each player gets seven knuckles. The players take turns walking. The player with the least double starts the game, starting with a one-one double. The double is laid out in the middle of the playing field. You can place knuckles on four sides of the first exposed double. The next player can place a die with the corresponding number on any of the four sides of the first double placed in the middle. If a player does not have a suitable dice for the next turn, he has to look for it in reserve, go to the market. He chooses one domino from the bazaar until the desired number of dice falls out or until the dice in the bazaar run out. Then the player skips his turn and his opponent goes.The game can be played with artificial intelligence or with an online opponent in multiplayer mode.">
            <meta property="wgp:instructions" content="If a player has the opportunity to put up a double on each side, then he can put them up in one turn. The player who sets a double has the right to close it. When closing a take, further exposure of the knuckles from this side is prohibited. If several doubles are played at the same time, the player has the right to close any number of doubles.The game ends when one of the players lays out the last die, that is, he will not have a single domino left in his hands. Next, the points remaining to his opponent are counted. These points are credited to the opponent.The game may end with a fish, which is the name given to blocking the layout, when each player still has dice in their hands, but no one has anything to report. When fishing, the winnings belong to the one who has the least points in his hands. The points of the remaining knuckles are not credited to the winner, and the points of the remaining knuckles are recorded to his opponent, the loser.">
