<body class="wgNoLoader">
<!-- ===== INITIAL LOADER (visible until loadGameData resolves and assets preload) ===== -->
<div id="initLoader" class="init-loader"><span class="init-loader-text" aria-label="Loading">⏳</span></div>

<!-- ===== SPLASH / TITLE SCREEN ===== -->
<!-- Architecture mirrors #mainScreen/#scene: a logical 900x900 box (#splashScene)
     scaled to viewport via scaleScene(), with all art and controls positioned
     in % of that box. Mute/lang stay outside #splashScene because they're
     anchored to the viewport corner, not the scene. -->
<div id="splashScreen" class="splash-screen" style="display:none;">
  <div id="splashScene">
    <img src="assets/splash.webp" alt="Алхимик" class="splash-img">
    <div class="splash-overlay">
      <h1 class="splash-title" id="splashTitle"></h1>
      <button class="btn btn-primary splash-enter-btn" id="splashEnterBtn" onclick="enterGame()"></button>
    </div>
  </div>
  <div class="splash-top-bar">
    <button class="mute-btn splash-mute-btn" onclick="toggleMute()">🔊</button>
    <button class="lang-btn splash-lang-btn" id="splashLangBtn" onclick="toggleLang()"></button>
  </div>
</div>

<!-- UI buttons — в body, позиционируются JS к краю игрового вьюпорта -->
<button id="muteBtn" class="mute-btn" onclick="toggleMute()">🔊</button>
<button id="cosmeticsBtn" class="cosmetics-btn" onclick="openCosmetics()">🎨</button>
<button id="roomLangBtn" class="lang-btn room-lang-btn" onclick="toggleLang()"></button>
<button id="exitToSplashBtn" class="exit-splash-btn" onclick="exitToSplash()"></button>

<!-- ===== MAIN SCREEN — ALCHEMIST'S CHAMBER ===== -->
<div id="mainScreen" class="screen">
<div id="scene">
  <!-- Room background -->
  <img class="room-bg" src="assets/room2.webp" alt="room">

  <!-- Window -->
  <div class="scene-el" id="windowEl"><img src="assets/window.webp" alt="window"></div>

  <!-- Philosopher Stone (cosmetic from Book of Mastery) -->
  <div class="scene-el ps-shrine" id="philosopherStoneEl" style="display:none">
    <img class="ps-base" src="assets/gem.png" alt="philosopher stone">
    <div class="ps-gem-glow"></div>
    <div class="ps-gem-pulse"></div>
    <div class="ps-candle ps-candle-l"></div>
    <div class="ps-candle ps-candle-r"></div>
    <div class="ps-spark ps-spark-1"></div>
    <div class="ps-spark ps-spark-2"></div>
    <div class="ps-spark ps-spark-3"></div>
  </div>

  <!-- Book niches -->
  <div class="scene-el" id="nicheL"><img src="assets/niche.webp" alt="niche"></div>
  <div class="scene-el" id="nicheR"><img src="assets/niche.webp" alt="niche"></div>

  <!-- Candelabras -->
  <div class="scene-el" id="candelabraL"><img src="assets/candelabra.webp" alt="candelabra"></div>
  <div class="scene-el" id="candelabraR"><img src="assets/candelabra.webp" alt="candelabra"></div>

  <!-- Candle glows -->
  <div class="candle-glow" id="candleL" style="background:radial-gradient(ellipse,rgba(255,160,40,0.4),transparent 70%);width:7%;height:7%;top:28%;left:9%;"></div>
  <div class="candle-glow" id="candleR" style="background:radial-gradient(ellipse,rgba(255,160,40,0.4),transparent 70%);width:7%;height:7%;top:28%;right:9%;"></div>

  <!-- Shelves -->
  <div class="shelf" id="shelfL"><img src="assets/shelf.webp" alt="shelf"></div>
  <div class="shelf" id="shelfR"><img src="assets/shelf.webp" alt="shelf"></div>

  <!-- Floor glow -->
  <div class="floor-glow"></div>

  <!-- Table -->
  <div class="table-wrap" id="tableWrap"><img src="assets/table.webp" alt="table"></div>

  <!-- Cauldron + all effects as children -->
  <div class="cauldron-wrap" id="cauldronWrap">
    <img src="assets/cauldron.webp" alt="cauldron">
    <!-- Fire canvas -->
    <canvas id="fireCanvas" width="300" height="160"></canvas>
    <div class="fire-glow" id="fireGlow" style="width:20%;height:5%;background:radial-gradient(ellipse,rgba(255,120,20,0.55) 0%,transparent 70%);"></div>
    <!-- Boil canvas -->
    <canvas id="boilCanvas" width="240" height="100"></canvas>
    <!-- Steam -->
    <div class="steam" id="steamContainer"></div>
  </div>

  <!-- ===== OVERLAY GRIDS ===== -->
  <!-- Base Scrolls on Left Shelf -->
  <div class="overlay-grid" id="baseScrollGrid">
    <div class="overlay-grid-items" id="baseScrollItems"></div>
    <div class="overlay-pagination" id="baseScrollPag"></div>
  </div>

  <!-- Craft Scrolls on Right Shelf (upper) -->
  <div class="overlay-grid" id="craftScrollGrid">
    <div class="overlay-grid-items" id="craftScrollItems"></div>
    <div class="overlay-pagination" id="craftScrollPag"></div>
  </div>

  <!-- Books on Right Shelf (lower) -->
  <div class="overlay-grid" id="bookGrid">
    <div class="overlay-grid-items" id="bookItems"></div>
    <div class="overlay-pagination" id="bookPag"></div>
  </div>

  <!-- Ingredients on Table -->
  <div class="overlay-grid" id="ingredientGrid">
    <div class="overlay-grid-items" id="ingredientItems"></div>
    <div class="overlay-pagination" id="ingredientPag"></div>
  </div>


</div><!-- /scene -->
</div>





<!-- ===== RECIPE DETAIL SCREEN ===== -->
<div id="recipeScreen" class="screen">
  <div class="header" style="display:flex;align-items:center;gap:10px;">
    <button class="back-btn" onclick="showScreen('mainScreen')">←</button>
    <h1 id="recipeTitle"></h1>
  </div>

  <div class="recipe-detail">
    <div class="recipe-type-badge" id="recipeTypeBadge"></div>
    <div class="desc" id="recipeDesc"></div>
    <div class="recipe-grid-info" id="recipeGridInfo"></div>
    <div class="pages-info" id="recipePagesInfo"></div>
    <div class="ingredients-needed" id="recipeIngredients"></div>
    <div class="recipe-used-in" id="recipeUsedIn"></div>
    <div class="recipe-reward-info" id="recipeRewardInfo"></div>
    <div class="recipe-achievement-info" id="recipeAchievementInfo"></div>
    <div class="recipe-inventory" id="recipeInventory"></div>
    <div style="margin-top: 16px;">
      <button class="btn btn-primary" id="startBtn" onclick="startRecipe()"></button>
    </div>
    <div style="margin-top: 8px;">
      <button class="btn btn-secondary" id="recipeBackBtn" onclick="showScreen('mainScreen')"></button>
    </div>
  </div>

</div>

<!-- ===== FILLWORD SCREEN ===== -->
<div id="fillwordScreen" class="screen">

  <div class="fw-header">
    <button class="back-btn" onclick="confirmExit()">←</button>
    <div class="fw-page" id="fwPage"></div>
    <div class="fw-spells">
      <button class="spell-btn" id="spellBtn" onclick="useSpell('spell_fire_cleanse')" style="display:none">🔥</button>

<script async="" src="https://gamepush.com/sdk/game-score.js?projectId=27266&amp;publicToken=JOACUhA1oal73VE0R9Qwf9vRVwUh7n3E&amp;callback=onGPInit"></script>
<script src="game.min.js"></script>
<script>
// Жёсткая блокировка контекстного меню, выделения текста и drag'n'drop картинок.
// Поля ввода (input/textarea) исключены — в них работает всё как обычно.
(function() {
  function isEditable(t) {
    return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
  }
  document.addEventListener('contextmenu', e => { if (!isEditable(e.target)) e.preventDefault(); });
  document.addEventListener('dragstart',   e => { if (!isEditable(e.target)) e.preventDefault(); });
  document.addEventListener('selectstart', e => { if (!isEditable(e.target)) e.preventDefault(); });
})();

// NOTE: previously this block synced LANG ← state.lang. That created a
// reload loop with onGPInit's GP-first resolution: GP resolves to "en",
// writes LS="en" + reloads → state mirror still says "ru" → this block
// overrides LS back to "ru" → GP resolves to "en" again → loop forever.
//
// LS[LANG_KEY] is the only pre-SDK source of truth. state.lang is just
// a mirror that follows LANG; it never drives the UI direction.
console.log('[SPB-LANG] inline index.html: LANG=' + LANG +
            ', state.lang=' + JSON.stringify(state.lang) +
            ' (state.lang ignored — LANG drives UI)');
// initI18nUI is intentionally NOT called here. We defer it (along with
// initSplash) until window._langReadyPromise resolves, so the UI is
// never rendered in the wrong language. Loader stays visible meanwhile.

// Standalone build has no GP SDK script tag → nothing will ever resolve
// _langReadyPromise from the GP side. Resolve it immediately so the
// splash isn't held back waiting for an SDK that never loads.
if (!document.querySelector('script[src*="game-score"]') && window._resolveLangReady) {
  console.log('[SPB-LANG] No GP SDK detected — resolving lang-ready immediately (standalone build)');
  window._resolveLangReady();
  window._resolveLangReady = null;
}



// Wait for LANG to finalize BEFORE loadGameData(): _dataPrefix() reads the
// global LANG at call time and picks data/ vs data/en/. In GP build LANG
// starts at 'en' and is corrected only inside onGPInit, so a parallel
// Promise.all here would fetch English ingredients/books even when the
// resolved language is Russian. Sequencing avoids the race; the loader is
// already on screen for the whole window.
window._langReadyPromise.then(loadGameData).then(() => {
  // Lang is now finalized (cloud/platform/LS resolved) — render i18n
  // text into the static HTML for the first time, then build splash.
  initI18nUI();

  restoreActiveRecipe(); // resolve saved recipe ID → full object



  initSplash();
}).catch(err => {
  console.error('Failed to load game data:', err);
  document.body.innerHTML = '<div style="color:#fff;padding:20px;">' + __spbT('error_loading') + '</div>';
});
</script>
