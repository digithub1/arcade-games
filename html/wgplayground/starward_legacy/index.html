<body class="wgNoLoader"><img class="splash-bg fadein" src="https://static.wgplayground.com/1ee8560b721a3c99fc4b794ab94b8739/wgplayground/0ab393c1250f147f9ef8f276323b8e85.jpg">
  <div id="game-shell">
   <div id="game-frame" class="fill" style="width: 335px; height: 558px; --hud-k: 0.698;">
    <canvas id="game" width="480" height="800" wg-game-orientation="wg-portrait-game"></canvas>

    <!-- HUD (ref: score plate · wave+pause chip · vertical shield / ordnance · weapon dock) -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div id="hud-score" class="hud-score-plate">
          <span class="hud-score-lbl">СЧЁТ</span>
          <span class="hud-score-val">0</span>
        </div>
        <div class="hud-wave-chip">
          <span id="hud-wave">WAVE 1</span>
          <button id="btn-pause" aria-label="Pause"><span data-ico="pause" data-ico-size="15"></span></button>
        </div>
      </div>

      <!-- left: vertical shield -->
      <div id="hud-shield" class="hud-vbar hud-shield-v" aria-label="Shield">
        <span class="hud-vbar-ic" data-ico="shield"></span>
        <div class="hud-vbar-track" id="hud-shield-track"></div>
        <span class="hud-vbar-n" id="hud-shield-n">3</span>
      </div>
      <!-- module charge/reload chips (absolute; does not shift other HUD) -->
      <div id="hud-modules" class="hud-modules hidden" aria-label="Modules"></div>

      <!-- right: warp (separated) + vertical bomb/nuke -->
      <div class="hud-right-stack">
        <button id="hud-warp" class="hud-btn hud-warp" aria-label="Time warp">▶▶ 10</button>
        <div class="hud-ord-col">
          <!-- Only the hangar-equipped super is shown (others stay hidden) -->
          <button id="hud-bombs" class="hud-btn hud-bomb hud-ord" aria-label="Bomb"><span class="hud-ord-ic" data-ico="bomb"></span><span class="hud-ord-cd" hidden=""></span><span class="hud-ord-n">×2</span><span class="hud-ord-pbar" aria-hidden="true"><i></i></span></button>
          <button id="hud-nuke" class="hud-btn hud-ord hidden" aria-label="Nuke"><span class="hud-ord-ic" data-ico="radiation"></span><span class="hud-ord-cd" hidden=""></span><span class="hud-ord-n">×1</span><span class="hud-ord-pbar" aria-hidden="true"><i></i></span></button>
          <button id="hud-barrier" class="hud-btn hud-ord hidden" aria-label="Barrier"><span class="hud-ord-ic" data-ico="barrier"></span><span class="hud-ord-cd" hidden=""></span><span class="hud-ord-n">×1</span><span class="hud-ord-pbar" aria-hidden="true"><i></i></span></button>
          <button id="hud-sphere" class="hud-btn hud-ord hidden" aria-label="Sphere"><span class="hud-ord-ic" data-ico="sphere"></span><span class="hud-ord-cd" hidden=""></span><span class="hud-ord-n">×1</span><span class="hud-ord-pbar" aria-hidden="true"><i></i></span></button>
        </div>
      </div>

      <div class="hud-bottom-block">
        <div id="hud-fuse" class="hud-fuse hidden" aria-live="polite"></div>
        <div id="hud-weapons" class="hud-weapons"></div>
      </div>
    </div>

    <!-- Onboarding coach (non-blocking) -->
    <div id="tutorial" class="hidden">
      <span class="tut-text"></span>
      <button id="tut-skip">Skip</button>
    </div>

    <!-- Story dialogue (built by story.js) -->
    <div id="story" class="overlay hidden"></div>

    <!-- Title / Menu (reference style: nebula bg + neon title + live voxel ship) -->
    <div id="menu" class="overlay">
      <canvas class="scene-bg" data-scene="menu"></canvas>
      <div class="menu-inner">
        <h1>STARWARD<span>LEGACY</span></h1>
        <p class="sub">Vertical Shmup</p>
        <canvas id="menu-ship" class="ship-anim" data-voxship="vanguard" width="260" height="200"></canvas>
        <button id="btn-start" class="btn btn-cta">ENTER HANGAR</button>
        <div class="menu-feats" id="menu-feats"></div>
        <!-- Graphics tier, offered on every launch (built by game.js) -->
        <div class="menu-qual" id="menu-qual"></div>
      </div>
    </div>

    <!-- Home screen (built by hub.js) -->
    <div id="hub" class="overlay hidden"></div>

    <!-- Hangar: ships / upgrades / armory (built by hangar.js) -->
    <div id="hangar" class="overlay hidden"></div>

    <!-- Game Over / stage result (double ad · BP teaser · mini upgrades) -->
    <div id="gameover" class="overlay hidden">
      <div class="set-panel glass-panel go-panel ftl-card-anim">
        <h2 class="set-title">SHIP DESTROYED</h2>
        <div id="go-stats"></div>
        <div id="go-bp" class="go-bp"></div>
        <div id="go-reward" class="reward-row"></div>
        <div id="go-mini" class="go-mini"></div>
        <div id="go-social" class="social-row"></div>
        <div class="btn-col go-actions">
          <button id="btn-continue" class="btn btn-cta hidden">CONTINUE</button>
          <button id="btn-retry" class="btn btn-cta">RELAUNCH</button>
          <button id="btn-map" class="btn btn-ghost hidden">TO MAP</button>
          <button id="btn-hangar" class="btn btn-ghost">HANGAR</button>
        </div>
      </div>
    </div>

    <!-- Pause -->
    <div id="pause" class="overlay hidden">
      <div class="set-panel glass-panel pause-panel ftl-card-anim">
        <h2 id="pause-title" class="set-title">PAUSED</h2>
        <div class="btn-col">
          <button id="pause-resume" class="btn btn-cta">RESUME</button>
          <button id="pause-settings" class="btn btn-ghost">SETTINGS</button>
          <button id="pause-map" class="btn btn-ghost hidden">TO MAP</button>
          <button id="pause-quit" class="btn btn-ghost">TO MENU</button>
        </div>
      </div>
    </div>

    <!-- Settings (built by settings.js) -->
    <div id="settings" class="overlay hidden"></div>

    <!-- Shop (built by shop.js) -->
    <div id="shop" class="overlay hidden"></div>

    <!-- Campaign map (built by map.js) -->
    <div id="campaignMap" class="overlay hidden"></div>

    <!-- Daily rewards & missions (built by missions.js) -->
    <div id="rewards" class="overlay hidden"></div>
    <div id="contracts" class="overlay hidden"></div>

    <!-- Battle pass season track (built by battlepass.js) -->
    <div id="season" class="overlay hidden"></div>

    <!-- Language curtain. Present in the markup (not created by JS) so it covers
         the very first paint: the title screen renders with a synchronous guess
         at the language, and the platform SDK corrects it a moment later. Without
         this the player watches the UI flip from Russian to English. Dropped by
         I18N once the language has settled. -->
    <div id="lang-veil">
      <div class="lv-mark"></div>
      <div class="lv-brand" aria-hidden="true">PAR<span>GAME</span></div>
    </div>
   </div>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/music.js"></script>
  <script src="js/i18n.js"></script></body></html>
