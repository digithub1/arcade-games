<script type="text/javascript">
(function(global) {
    // This function is called after the engine script file has loaded
    global.onEngineLoad = function() {
        // The callback for gse.ready() will be invoked after the engine is ready
        gse.ready(function(engine) {
            const loadingElement = document.getElementById('gse-loading');
            const playerDelegate = {
                onLoadingBegin: function() {
                    engine.showOverlay();
                    loadingElement.style.visibility = 'visible';
                },
                onLoadingEnd: function() {
                    loadingElement.style.visibility = 'hidden';
                    engine.hideOverlay();
                },
                onWindowResize: function() {
                    engine.relayout();
                },
                onSceneAboutToChange: function(sceneKey, sceneName, enableAdvertisement) {
                    if (enableAdvertisement) {
                        setTimeout(showAds, 1000);
                    }
                }
            };

            engine.appendDelegate(playerDelegate);
            window.addEventListener('resize', playerDelegate.onWindowResize);

            // Make sure the game is not paused when it starts
            gse.unpause();  // Ensure game is unpaused as soon as it's ready

            // Handle visibility change (pause the game when the window is hidden)
            const handleVisibilityChange = function() {
                const isHidden = document.hidden || document.mozHidden || document.webkitHidden || document.msHidden;
                if (isHidden) {
                    gse.pause(); // Pause the game if the page is hidden
                } else {
                    gse.unpause(); // Resume the game when the page is visible
                }
            };

            // Listen for visibility changes (window hiding/unhiding)
            document.addEventListener('visibilitychange', handleVisibilityChange);
            document.addEventListener('mozvisibilitychange', handleVisibilityChange);
            document.addEventListener('webkitvisibilitychange', handleVisibilityChange);
            document.addEventListener('msvisibilitychange', handleVisibilityChange);

            // Engine Initialization
            engine.setRenderFrame('gse-player');
            engine.setOptions({
                'viewport-reference': 'window',
                'viewport-fit': 'letterbox'
            });
            engine.loadOptionsFromURL();

            // Start the game immediately after loading (no pause by default)
            engine.play('game/default');
        });
    };
})(window);

// Function to show ads
function showAds() {
    pauseGame();
    window[window.preroll.config.loaderObjectName].refetchAd(resumeGame);
}

// Pause game function
function pauseGame() {
    console.log("Game Paused");
    gse.pause(); // Pause the game
}

// Resume game function
function resumeGame() {
    console.log("Game Resumed");
    gse.unpause(); // Unpause the game
}
</script>
