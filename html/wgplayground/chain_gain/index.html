            <meta property="wgp:description" content="Hi there! Try this cute casual puzzle game. Your task is to connect matching items into chains — not just horizontally and vertically, but also diagonally! This opens up a world of spectacular moves and unexpected combos.Every move changes the board: when you clear a chain, blocks from above fall down, and the bottom row disappears. This keeps the gameplay fast and dynamic!Use awesome power-up items: bombs, rockets, rainbows, mirrors, dice, and chests. They are activated automatically if they end up next to your chain, and trigger chain reactions with bright explosive effects! But stay alert: you'll also encounter stones, grates, and other obstacles that will complicate your task. Sometimes you'll have to plan your moves one step ahead… or even two!The first few levels will help you easily master all the game mechanics, followed by 100+ levels of increasing difficulty. The game is adapted for mobile devices and browsers — play anywhere, no installation needed!Chain them up and gain points — good luck!">
            <meta property="wgp:instructions" content="Tap and drag&nbsp;across matching items to form a chain — horizontally, vertically, or even diagonally. This earns you points and helps complete the level goals: collect the required number of specific items.Power-ups&nbsp;(activated if they touch your chain horizontally or vertically):  Bomb&nbsp;– removes all items around itself.  Rocket&nbsp;– clears an entire line (horizontal, vertical, or diagonal).  Rainbow&nbsp;– collects all items of the same type as in your chain.  Mirror&nbsp;– removes items at the reflected positions of your chain.  Dice&nbsp;– with a 30% chance, transforms items on the board into the type from your chain.  Chest&nbsp;– grants extra moves, required items, or coins.Obstacles:  Stones&nbsp;– fall down and can clog columns.  Chained Hearts&nbsp;– need to be activated to count towards level goals.  Grates&nbsp;– block tiles with items. They do not react to power-ups.  Paint&nbsp;– spreads only along your chains and is ignored by power-ups.">

  <script>
    const userLang = navigator.language.startsWith('ru') ? 'ru' : 'en';
    const loaderText = document.getElementById('loader-text');
    const updateDots = () =>
    {
      const baseText = userLang === 'ru' ? 'Загрузка' : 'Loading';
      let dots = '';
      let count = 0;
      const animate = () =>
      {
        const dotsL = '·'.repeat((count % 5) + 1);
        const dotsR = '·'.repeat((count % 5) + 1);
        loaderText.textContent = `${dotsL} ${baseText} ${dotsR}`;
        count++;
      };
      animate();
      return setInterval(animate, 300);
    };
    const dotsInterval = updateDots();
    window.addEventListener('DOMContentLoaded', () =>
    {
      clearInterval(dotsInterval);
      const preloader = document.getElementById('preloader');
      preloader.style.opacity = '0';
      setTimeout(() =>
      {
        preloader.remove();
      }, 500);
    });
  </script>
