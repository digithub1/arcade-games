    // Возвращаем фокус, если кликнули по экрану
    function FocusGame() {
      window.focus();
      canvas.focus();
    }

    window.addEventListener('pointerdown', () => {
      FocusGame();
    });
    window.addEventListener('touchstart', () => {
      FocusGame();
    });

    function HideLoadingScreen() {
      loadingCover.style.display = "none";
    }

    function SetLanguage(lang) {
      gpLang = lang;
    }

    function SetLoadingScreenProgress(progress, phase) {
      
      const adjustedProgress = Math.max(progress, 0.1) * 100;

      var message = "";
      if (gpLang !== "") {
        var isRu = gpLang === "ru";
        if (phase === 0) {
          message = isRu ? "Загрузка" : "Loading";
        } else if (phase === 1) {
          message = isRu ? "Обновление" : "Content Update";
        } else if (phase === 2) {
          message = isRu ? "Загрузка" : "Loading";
        }
        message = message + ` (${adjustedProgress.toFixed(0)}%)`;
      } else {
        message = `${adjustedProgress.toFixed(0)}%`
      }

      progressText.textContent = message;
      progressBarFull.style.width = `${adjustedProgress}%`;
    }
