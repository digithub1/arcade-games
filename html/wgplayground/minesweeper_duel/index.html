            <meta property="wgp:description" content="Minesweeper Duel is a new mode for the game familiar from childhood.In a one-on-one competition, you open the cells in turn with your opponent and get points equal to the face value of the open cell. The player with the highest score wins. The player who stumbles upon a mine loses immediately.Available field sizes:- Newbie- Amateur- ProfessionalTime for thinking is limited, choose different modes:- The bullet- Blitz- ClassicThe shortest timer in the Pool, you have only one minute to either open the entire field or hold out until the opponent makes a mistake. Real madness for extreme sports fans!Most of the time is in the Classics, and this gives a completely different character to the game. Carefully plan which cells you will open and calculate the opponent's moves so that you get the most points. And if you open a free zone, you can get 10 points at once!Minesweeper Duel trains mindfulness, concentration, logic. And in the competition there is also strategic thinking">
            <meta property="wgp:instructions" content="The basic goal of the game is to open all the cells of the field where there are no mines.The numbers on the cells will help in this - each number shows how many mines are on neighboring cells.Based on this information, gradually open cell by cell. But be careful - if you come across a mine, you will lose immediately.On a computer, a left-click opens a cell. Right-clicking marks a cell with a flag, which means that you assume a mine on this cell. Right-clicking on a cell again marks it with a question mark.In the game on your mobile phone, you can select the input mode using three buttons above the field: open the cell, put a flag, put a question mark.In a single player, the task is to open the entire field yourself in the shortest time.In a game against an opponent, the task is either to hold out until the opponent runs out of time or until the opponent hits a mine; or open the entire field with the opponent, while choosing more expensive cells and thus gaining more points.">
