<meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"><meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width,minimal-ui,shrink-to-fit=no,viewport-fit=cover"><meta name="apple-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="author" content="ABS Games"><link rel="stylesheet" href="style.css"><script async="" src="https://gs.eponesh.com/sdk/game-score.js?projectId=162&amp;publicToken=-0T4S94zKkNblIfIlaxorEdhIs4K4RM4&amp;callback=onGSInit"></script><script>var gs;
		window.sumConsumePurchases = 0;
		window.flagUseFeed = 0;

        function ParseUri() {
            const uri = window.location.search.substr(1);
            const partParams = uri.split('&');

            let params = {};

            if (!partParams.length) {
                return;
            }

            partParams.forEach((item) => {
                const [key, value] = item.split('=');
                params[key] = value;
            });

            window.paramsUser = params;
        }

        function GetParam(name) {
            if (typeof(window.paramsUser[name]) !== 'undefined') {
                return window.paramsUser[name];
            }

            return null;
        }

        function hasOnlyDigits(value) {
            return /^\d+$/.test(value);
        }

        window.onGSInit = async (gamePush) => {
            gs = gamePush;

            await gs.player.ready;
        
            let searchParams = new URLSearchParams(document.location.search);

            if (gs.platform.type == "YANDEX" && searchParams.has("payload")) {
                window.payloadText = searchParams.get("payload");

                if (hasOnlyDigits(window.payloadText) || window.payloadText.includes("lvl")) {
                    window.flagUseFeed = window.payloadText.includes("lvl") ? 2 : 1;
                    window.levelGame = Number(window.flagUseFeed == 2 ? window.payloadText.slice(3) : window.payloadText);
                }
            }

            if (gs.platform.type == "VK") {
                ParseUri();
		  
                let clientPlatform = GetParam("typeView");

                if (clientPlatform == "mobile" || clientPlatform == "web") {
                    gs.isMobile = true;
                } else if (clientPlatform == "webLarge") {
                    gs.isMobile = false;
                }
            }

            if (gs.player.get('showAds')) {
                if (gs.ads.isPreloaderAvailable && !searchParams.has("payload")) {
                    gs.ads.showPreloader();
                }

                if (gs.ads.isStickyAvailable && !searchParams.has("payload")) {
                    gs.ads.showSticky();
                }
            }

            window.gsAchievements = await gs.achievements.fetch();
            window.numRank = gs.player.get('rank');

            if (gs.payments.isAvailable) {
                window.productsShop = await gs.payments.fetchProducts();

				let payments = window.productsShop.playerPurchases;

                if (payments.length > 0) {
                    for (let i = 0; i < payments.length; i++) {
                        let tag = payments[i].tag;
                        let productId = payments[i].productId;

                        await gs.payments.consume({ tag: tag });

                        gs.player.add('number_hints', Number(tag.slice(6)));

                        if (productId == 28) {
                            gs.player.set('showAds', false);
                            gs.ads.closeSticky();
                        }

                        window.sumConsumePurchases += Number(tag.slice(6));
                    }

                    gs.player.sync({ override: true });
                }
            }

            window.initGS = true;

            if (gs.ads.isStickyAvailable && gs.player.get('showAds')) {
                let heightBanner = 110;

                if (gs.platform.type != "YANDEX" && gs.platform.type != "VK") {
                    if (gs.isMobile) {
                        document.body.insertAdjacentHTML("afterBegin", '<div id="app-container" class="canvas-app-container"></div>');
                    } else {
                        document.body.insertAdjacentHTML("afterBegin", `<div style="height: calc(100% + -${heightBanner}px);" id="app-container" class="canvas-app-container"></div>`);
                    }
                } else {
                    document.body.insertAdjacentHTML("afterBegin", '<div id="app-container" class="canvas-app-container"></div>');
                }
            } else {
                document.body.insertAdjacentHTML("afterBegin", '<div id="app-container" class="canvas-app-container"></div>');
            }

            let arrLang1 = ["be", "kk", "ky", "uk", "uz"];
            let arrLang2 = ["en", "ru", "fr", "it", "de", "es", "zh", "pt", "ja", "tr", "hi", "id", "ar"];

            if (!arrLang2.includes(gs.language)) {
                if (arrLang1.includes(gs.language)) {
                    gs.changeLanguage('ru');
                } else {
                    gs.changeLanguage('en');
                }
            }
        }</script><style type="text/css">body{overflow:hidden!important}body:not(.wgIsMidroll) [data-wgplayer]~.wgLoadingAnim{display:none!important}[data-wgplayer]:before{display:none!important}[data-wgplayer]{background:none!important}</style><script defer="defer" src="main.js"></script><style>.fadein{animation: 3s linear 0s fadein;}.splash-bg {visibility:hidden;object-fit: contain;position: absolute;left: 0;top: 0;filter: blur(3px) opacity(0.9);transform: scale(2.5) translate(-50%, -50%); top:50%; left:50%; z-index:-1;} .splash-bg.fadein{visibility:visible}canvas, iframe[data-src*="wgplayground.com"] {box-shadow: rgba(0, 0, 0, 0.6) 0px 0px 30px;}@keyframes fadein {from {opacity:0;}to {opacity:1;}}</style><style>.gs-global-loader{position:fixed;z-index:99999;top:8px;right:8px;width:48px;height:48px}@media only screen and (min-width: 1024px){.gs-global-loader{top:inherit;right:16px;bottom:16px}}.gs-loader{position:relative;width:40px;height:40px;border-radius:50%;display:flex}.gs-loader__outter{box-sizing:border-box;position:absolute;border:4px solid #f50057;border-left-color:transparent;width:100%;height:100%;border-radius:50%;-webkit-animation:loader-outter 1s cubic-bezier(0.42, 0.61, 0.58, 0.41) infinite;animation:loader-outter 1s cubic-bezier(0.42, 0.61, 0.58, 0.41) infinite}.gs-loader__inner{box-sizing:border-box;position:absolute;border:4px solid #f50057;border-radius:50%;width:20px;height:20px;left:calc(50% - 10px);top:calc(50% - 10px);border-top-color:transparent;-webkit-animation:loader-inner 1s cubic-bezier(0.42, 0.61, 0.58, 0.41) infinite;animation:loader-inner 1s cubic-bezier(0.42, 0.61, 0.58, 0.41) infinite}@keyframes loader-outter{0%{-webkit-transform:rotate(0deg);transform:rotate(0deg)}100%{-webkit-transform:rotate(360deg);transform:rotate(360deg)}}@keyframes loader-inner{0%{-webkit-transform:rotate(0deg);transform:rotate(0deg)}100%{-webkit-transform:rotate(-360deg);transform:rotate(-360deg)}}.gs-loader-hidden{display:none}</style><style>.gp-gamedist
