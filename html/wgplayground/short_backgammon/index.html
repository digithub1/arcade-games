            <meta property="wgp:description" content="Short backgammon is a board game for two players on a special board divided into two halves. The birthplace of this game is not exactly known, but it is known that people have been playing this game for more than 5,000 years, which there is historical evidence. So, the oldest of the backgammon boards was found on the territory of Iran and dates back to about 3000 BC. An analogue of this game was found in the tomb of Pharaoh Tutankhamun.The rules of the game of backgammon are simple and novice players will easily master them, but nevertheless, in order to win, you need logical thinking and of course luck. The Backgammon game consists of a special board, 30 checkers of two different colors and two dice dice. 2 players take part in the game.The game can be played with artificial intelligence, together with another person on the same device, or with an opponent online in multiplayer mode.">
            <meta property="wgp:instructions" content="The goal of the game is to bring all your chips into the house and remove them from the board before the second player does it. Players alternately roll the dice and move the checkers in accordance with the points that have fallen out, pass the checkers full circle on the board to their house and take them out of the board.The numbers on each dice indicate how many points, or steps, the player must move his checkers. Checkers always move only in one direction - from points with large numbers to points with smaller ones.The following rules apply:- a checker can only move to an open point, that is, to one that is not occupied by two or more checkers of the opposite color.- the numbers on both dice make up separate moves.The player who has a double, plays each of the numbers on each of the dice twice.When a player has brought all his fifteen checkers into his house, he can start throwing them off the board. The one who first removed all the checkers from the board wins the game.">
