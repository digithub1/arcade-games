  <body oncontextmenu="return false;" class="wgNoLoader">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      color: white;
    }

    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #231F20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.6s ease-out;
    }

    #logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 40px;
      background: linear-gradient(90deg, #ff3366, #33ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 51, 102, 0.5);
    }

    .progress-container {
      width: 380px;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 50px;
      transition: width 0.3s ease-out;
      box-shadow: 0 0 25px rgba(51, 204, 255, 0.7);
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: -2px;
      left: -50%;
      width: 40%;
      height: 120%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.9),
        transparent
      );
      animation: shine 1.5s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    #progress-text {
      margin-top: 15px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    #unity-canvas {
      display: none; /* скрываем пока идёт загрузка */
    }
  </style>
  <script src="jquery.js"></script>
  <div id="loading-screen">
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
    </div>    
    <div id="progress-text">0%</div>
  </div>
  <script src="storage.js"></script>
	<script src="interop.js"></script>
	<script src="external.js"></script>
	<link rel="stylesheet" type="text/css" href="style.css">
    <canvas id="unity-canvas" style="width: 100%; height: 100%; aspect-ratio: 0.896057 / 1;"></canvas>
    <script src="Build/buil2.loader.js"></script>
    <script>
	  function showProgress(progress) {

      const percent = Math.round(progress * 100);
      
      document.getElementById('progress-bar').style.width = percent + '%';
      document.getElementById('progress-text').textContent = `${percent}%`;
    }
  
      window._gameloader = createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/68ef67763f18ea01608c00476c5c1f0d.data.unityweb",
        frameworkUrl: "Build/dbd5718397b45c839ab91d94fa17e1f6.js.unityweb",
        codeUrl: "Build/2f84ea03dcf014f3744980e5cd960f62.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Terminator1998",
        productName: "FarCryYG",
        productVersion: "1.0"
      },showProgress);
	  
	  _gameloader.then(instance => {
		  window.unityInstance = instance;
		  unityInstance = instance;

		  // Скрываем экран загрузки с анимацией
		  const loadingScreen = document.getElementById('loading-screen');
		  loadingScreen.style.opacity = '0';
		  
		  setTimeout(() => {
			loadingScreen.style.display = 'none';
			document.getElementById('unity-canvas').style.display = 'block';
		  }, 600);
		}).catch(err => {
		  console.error("Ошибка загрузки Unity:", err);
		  document.getElementById('progress-text').textContent = "Ошибка загрузки :(";
		});
	  
	  $('canvas').css({'width':'100%','height':'100%'});
    </script>
