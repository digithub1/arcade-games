            <meta property="wgp:instructions" content="Movement of figures:- The pawn moves diagonally towards the middle of the board until it is in the central area. When a pawn is in the center or in one of the opponent's corner zones, it can move one square in any direction.- The elephant walks diagonally in the corners, and vertically or horizontally in the middle. The bishop takes the opponent's pieces only if he crosses the line of demarcation of the central and corner zones.- The rook moves vertically or horizontally in the corners, and diagonally in the middle. The rook takes the opponent's pieces only if it crosses the line of demarcation of the central and corner zones.- The king moves one square in any direction.The game ends:- The victory of the player, whose two kings will be moved to the four central fields.- Defeat the player who loses all his kings.- A draw if two players have one king each.- A draw if the same position of the pieces is repeated three times during the game.">
