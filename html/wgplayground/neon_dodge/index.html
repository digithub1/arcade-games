    <script async="" src="https://gamepush.com/sdk/game-score.js?projectId=20804&amp;publicToken=qeWCzWejZwjK9dfRmsGBtsJlyHp05avd&amp;callback=onGPInit"></script>
    <script>
        window.onGPInit = async (gp) => {
            console.log('GamePush SDK инициализирован');
            
            // Глобальная переменная для доступа к SDK из game.js
            window.GamePush = gp;
            
            console.log('SDK был присвоен window.GamePush');
            
            // Проверяем, что SDK доступен
            if (!window.GamePush) {
                console.error('Ошибка: window.GamePush не существует после присвоения');
                // Альтернативная попытка
                window.gp = gp;
                console.log('Альтернативно присвоили к window.gp');
            }
            
            try {
                // Проверка и вывод доступных свойств и методов
                console.log('Доступные свойства GamePush:', Object.keys(gp));
                
                // Проверяем доступность рекламы
                if (gp.ads) {
                    console.log('Модуль рекламы доступен, свойства:', Object.keys(gp.ads));
                    
                    // Проверяем методы показа рекламы
                    if (typeof gp.ads.showFullscreen === 'function') {
                        console.log('Метод showFullscreen доступен');
                    }
                    
                    if (typeof gp.ads.showRewardedVideo === 'function') {
                        console.log('Метод showRewardedVideo доступен');
                    }
                    
                    if (typeof gp.ads.showSticky === 'function') {
                        console.log('Метод showSticky доступен');
                    }
                    
                    // Скрываем Sticky баннер, если он есть
                    if (typeof gp.ads.closeSticky === 'function') {
                        gp.ads.closeSticky();
                        console.log('Sticky баннер скрыт');
                    }
                } else {
                    console.warn('Модуль рекламы GamePush недоступен');
                }
                
                // Дожидаемся синхронизации игрока с сервером
                if (gp.player && typeof gp.player.ready === 'object' && typeof gp.player.ready.then === 'function') {
                    console.log('Ожидаем синхронизации игрока...');
                    await gp.player.ready;
                    console.log('Игрок синхронизирован с сервером');
                }
                
                // Отключаем показ рекламы после прелоадера
                console.log('Отключаем автоматический показ рекламы');
                
                // Подписываемся на события паузы и возобновления
                if (typeof gp.on === 'function') {
                    gp.on('pause', () => {
                        console.log('Получено событие pause от GamePush');
                        if (typeof pauseGame === 'function') {
                            pauseGame(false); // Системная пауза (не ручная)
                        }
                    });
                    
                    gp.on('resume', () => {
                        console.log('Получено событие resume от GamePush');
                        if (typeof resumeGame === 'function' && !window.manuallyPaused) {
                            resumeGame();
                        }
                    });
                    
                    // Обработка ошибок SDK
                    gp.on('error', (error) => {
                        console.error('Ошибка GamePush SDK:', error);
                    });
                }
                
                // Сообщаем основному коду игры, что SDK инициализирован
                if (typeof onGamePushInitialized === 'function') {
                    console.log('Вызываем onGamePushInitialized');
                    onGamePushInitialized();
                } else {
                    console.error('Функция onGamePushInitialized не найдена!');
                }
            } catch (error) {
                console.error('Ошибка в onGPInit:', error);
            }
        };
    </script>
