    var __purchasesProvider = null;
    var __adsProvider = null;
    const __disableAdTag = "disable_ad";
    var __gpLang = 'en';
    var __gpIsAdEnable = true;
	var __gpGlobal = null;
    var closeEventCallback = null;
	
	function updateAudioVolume(documentState)
	{
	   if(window.unityInstance)
	   {
	      window.unityInstance.SendMessage('GameDontDestroyOnLoad', 'SetDocumentState', documentState ? 1 : 0);
		  console.log(`Is document hidden:${documentState}...`);
	   }
	}
	
	document.addEventListener("visibilitychange", () => {
		updateAudioVolume(document.hidden);
	});
    
    function checkPurchases(purchases)
    {
      if(purchases.playerPurchases.length > 0)
      {
         const purchase = purchases.playerPurchases[0];
         if(purchase.tag === __disableAdTag)
         {
            __gpIsAdEnable = false;
         }
      }
    }

    function showAd()
    {
      if(__adsProvider.isPreloaderAvailable && __gpIsAdEnable)
	     __adsProvider.showPreloader();
      
      if(__adsProvider.isStickyAvailable && __gpIsAdEnable)
         __adsProvider.showSticky();
    }
	
    var _unityAwaiter = {};
    _unityAwaiter.ready = new Promise((resolve, reject) => {
      _unityAwaiter.done = resolve;
      _unityAwaiter.abort = reject;
    });

    var _gpAwaiter = {};
    _gpAwaiter.ready = new Promise((resolve) => {
      _gpAwaiter.done = resolve;
    });

    window.unityInstance = null;
    window.onGPError = () => _gpAwaiter.done();

    window.onGPInit = async (gp) => {
      if (showPreloaderAd == "true" || showPreloaderAd == "1") {
        gp.ads.showPreloader();
      }

      window.GamePush = new GamePushUnity(gp);
      gp.player.ready.finally(_gpAwaiter.done);
	  
	  __gpLang = gp.language;
      __purchasesProvider = gp.payments;
      __adsProvider = gp.ads;
	  __gpGlobal = gp;

      await _unityAwaiter.ready;

      if (autocallGameReady != null && parseFloat(autocallGameReady) > 0) {
        setTimeout(() => gp.gameStart(), parseFloat(autocallGameReady));
      }
    };
  </script>

<body class="dark wgNoLoader">
  <div class="game-bg-pc"></div>
  <div id="unity-container" class="unity-desktop">

  </div>
  <div id="loading-cover" style="">
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
	  <div class="load-text"></div>
    </div>
  </div>

  <script>
  
    let bgClass = "game-bg-pc";
  
    function showLogo()
    {
       const logo = document.querySelector('#unity-logo');
       const logoImage = new Image();
       if(__gpLang === 'ru')
       {
          logoImage.src = "logo_ru.webp"
       }
       else
       {
          logoImage.src = "logo_en.webp"
       }
       logo.appendChild(logoImage);
    }

    function updateLoadText()
    {
       const loadText = document.querySelector('.load-text');
       if(__gpLang === 'ru')
       {
          loadText.innerHTML = 'Загрузка...';
       }
       else
       {
          loadText.innerHTML = 'Loading...';
       }
    }
	
	function setBG(isMobile)
    {
        const bg = document.querySelector(`.${bgClass}`);
        if(isMobile)
        {
           bgClass = "game-bg-mobile";
           bg.className = `${bgClass}`;
        }
    }
	
	function showGame()
    {
        _unityAwaiter.done(window.unityInstance);
        loadingCover.style.display = "none";
		    const bg = document.querySelector(`.${bgClass}`);
		    bg.remove();
    }
	
     
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Test.loader.js";
    const config = {
      dataUrl: buildUrl + "/Test.data.unityweb",
      frameworkUrl: buildUrl + "/Test.framework.js.unityweb",
      codeUrl: buildUrl + "/Test.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "AVE Games",
      productName: "Water Sort Puzzle - Color Sorting Game",
      productVersion: "1.0",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (overlayBackgroundColor !== "-" && overlayBackgroundColor !== " " && overlayBackgroundColor !== "")
      canvas.style.background = overlayBackgroundColor;

    if (progressBarFillColor !== "-" && progressBarFillColor !== " " && progressBarFillColor !== "")
      progressBarFull.style.background = progressBarFillColor;

    if (progressBarBackgroundColor !== "-" && progressBarBackgroundColor !== " " && progressBarBackgroundColor !== "")
      progressBarEmpty.style.background = progressBarBackgroundColor;

    if (progressBarBorderColor !== "-" && progressBarBorderColor !== " " && progressBarBorderColor !== "")
      progressBarEmpty.style.border.color = progressBarBorderColor;


    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
	  setBG(true);
    }

    /*#if BACKGROUND_FILENAME
    canvas.style.background = "url('" + buildUrl + "/') center / cover";
    #endif*/
    loadingCover.style.display = "";

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = async () => {
      await _gpAwaiter.ready;
	  
	  showLogo();
      updateLoadText();
      const purchases = await __purchasesProvider.fetchProducts();
      checkPurchases(purchases);
	  __adsProvider.on('preloader:close', (success) => { 
         if(closeEventCallback)
            closeEventCallback();
     });
      showAd();
	  
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        if(__adsProvider.isPreloaderPlaying)
        {
           closeEventCallback = showGame;
           window.unityInstance = unityInstance;
        }
        else
        {
          window.unityInstance = unityInstance;
          showGame();
        }
      }).catch((message) => {
        _unityAwaiter.abort(message);
        console.log(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script><script src="Build/Test.loader.js"></script>
