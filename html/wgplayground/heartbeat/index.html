<body class="wgNoLoader"><img class="splash-bg fadein" src="https://static.wgplayground.com/8d385683cca2226dff0a78fcf38ba42c/wgplayground/484310ca3ddde68342bb7caeef9482fb.jpg">

  <script async="" src="https://gamepush.com/sdk/game-score.js?projectId=24565&amp;publicToken=uaj6TyFhQkfQ2BXK8l7G7BeVwj6ECSVF&amp;callback=onGPInit"></script>

<script>
    // --------- Device helpers ----------
    window.isMobile = function () {
      let hasTouchScreen = false;
      if ("maxTouchPoints" in navigator) {
        hasTouchScreen = navigator.maxTouchPoints > 0;
      } else if ("msMaxTouchPoints" in navigator) {
        hasTouchScreen = navigator.msMaxTouchPoints > 0;
      } else {
        const mQ = window.matchMedia && matchMedia("(pointer:coarse)");
        if (mQ && mQ.media === "(pointer:coarse)") {
          hasTouchScreen = !!mQ.matches;
        } else if ('orientation' in window) {
          hasTouchScreen = true;
        } else {
          const UA = navigator.userAgent;
          hasTouchScreen = (
            /\b(BlackBerry|webOS|iPhone|IEMobile)\b/i.test(UA) ||
            /\b(Android|Windows Phone|iPad|iPod)\b/i.test(UA)
          );
        }
      }
      return hasTouchScreen || window.innerHeight > window.innerWidth;
    };

    window.isiOS = function () {
      return [
        'iPad Simulator','iPhone Simulator','iPod Simulator',
        'iPad','iPhone','iPod'
      ].includes(navigator.platform)
        || (navigator.userAgent.includes("Mac") && "ontouchend" in document)
        || /(iPad|iPhone|iPod)/g.test(navigator.userAgent);
    };

    document.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });

    // --------- SDK / State bridges ----------
    window.sdkInfo = {
      playerSdkObj: null,
      playerSdkObjAsked: false,
      serverSaveAsked: false,
      serverSaveData: null
    };

    // Лёгкий защитный no-op, если игра загрузится раньше SDK
    if (typeof window.pauseGame === "undefined") window.pauseGame = function(){};
    if (typeof window.resumeGame === "undefined") window.resumeGame = function(){};

    // --------- Ads timers ----------
    window.lastTimeAds = new Date();
    (function bootstrapAdsTime() {
      const now = new Date();
      window.lastTimeAds.setTime(now.getTime() + 90000);
})();

    window.checktimeForAds = function () {
      const now = new Date();
      const time = Math.floor((now.getTime() - window.lastTimeAds.getTime()) * 0.001);
      console.log('ADS: time since last', time, 'sec');
      return (time >= 61);
    };

    window.updateLastAdsTime = function () {
      const now = new Date();
      window.lastTimeAds.setTime(now.getTime());
      console.log('ADS: updated last time.');
    };

    // --------- Ads facade ----------
    window.ads = {
      // флаги и статусы
      apiAvail: true,
      bannerAvail: true,
      inappsAvail: true,
      isDownPos: true,
      hasAdblock: false,
      interstitOn: false,
      calledInterstit: false,
      rewardOpen: false,
      rewardCalled: false,
      rewardReady: false,
      afterInterstit: function(){}, // игра подменяет коллбеком
      successReward: function(){},  // игра подменяет коллбеком
      errorRewardCb: function(){},  // игра подменяет коллбеком

      // sticky banner через GamePush
      showAdsBanner: function () {
        if (!window.gp || !window.gp.ads) return;
        try { window.gp.ads.showSticky(); } catch (e) { console.log('Sticky show error', e); }
      },
      hideCurrentAdBanner: function () {
       // if (!window.gp || !window.gp.ads) return;
      //  try { window.gp.ads.closeSticky && window.gp.ads.closeSticky(); } catch (e) {}
      },
      showCurrentAdBanner: function () {
        window.ads.showAdsBanner();
      },

      // Rewarded
      showReward: function () {
        if (!window.gp || !window.gp.ads) return;
        if (window.ads.rewardCalled) return;

        console.log("call reward ads");
        window.ads.rewardCalled = true;

        // === GamePush ADS bridges ===
        // ожидаемая сигнатура: Promise c коллбэками/событиями.
        // Ниже — безопасный паттерн через try/catch + then/finally.
        try {
          window.pauseGame();
          const p = window.gp.ads.showRewardedVideo();
          Promise.resolve(p)
            .then((res) => {
              // если SDK кидает событие награды — отлично;
              // если возвращает флаг — тоже учтём
              console.log("Success reward", res);
               window.ads.rewardOpen = true;
              //window.ads.successReward();
            })
            .catch((e) => {
              console.log("Error while open video ad:", e);
              if (window.errorRewardCb) window.errorRewardCb();
            })
            .finally(() => {
              window.resumeGame();
              window.ads.rewardOpen = false;
              window.ads.rewardCalled = false;
            });
        } catch (e) {
          console.log("Reward show error", e);
          window.resumeGame();
          window.ads.rewardOpen = false;
          window.ads.rewardCalled = false;
          if (window.errorRewardCb) window.errorRewardCb();
        }
      }
    };

    // --------- Interstitial совместим с showAds / showPreroll ----------
    function getInterstitialCallback(stage, wasShown) {
      switch (stage) {
        case "onOpen":
          window.ads.interstitOn = true;
          window.ads.calledInterstit = false;
          window.pauseGame();
          console.log("Open interstitial");
          break;
        case "onClose":
          if (wasShown) window.updateLastAdsTime();
          window.ads.calledInterstit = false;
          try { window.ads.afterInterstit(); } catch(_) {}
          window.resumeGame();
          console.log("Close interstitial. WasShown", !!wasShown);
          break;
        case "onError":
          window.ads.calledInterstit = false;
          console.log("Interstitial error");
          break;
        case "onOffline":
          window.ads.calledInterstit = false;
          window.updateLastAdsTime();
          try { window.ads.afterInterstit(); } catch(_) {}
          console.log("Interstitial offline");
          break;
        default:
          console.log("Interstitial default cb:", stage);
          break;
      }
    }

    window.showAds = function () {
      if (window.ads && window.ads.interstitOn) return;
      console.log("show Ads!");

      if (!window.gp || !window.gp.ads) {
        console.log("no GamePush ads API");
        return;
      }

      try {
        getInterstitialCallback("onOpen");
        // === GamePush ADS bridges ===
        const p = window.gp.ads.showFullscreen && window.gp.ads.showFullscreen();
        Promise.resolve(p)
          .then((res) => {
            // Если SDK вернёт факт показа — учтём
            getInterstitialCallback("onClose", true);
          })
          .catch((e) => {
            console.log("Interstitial error:", e);
            getInterstitialCallback("onError");
          });
      } catch (e) {
        console.warn("Found error when fullscreen open", e);
        getInterstitialCallback("onError");
      }
    };

    // Совместимая «преролл» логика — дергает interstitial с таймером
    window.ads.showPreroll = function (force = false) {
      console.log("showPreroll");
      if (window.ads.interstitOn || window.ads.hasAdblock) {
        console.log("Handle already on ads!");
        window.ads.interstitOn = true;
        try { window.ads.afterInterstit(); } catch(_) {}
        return;
      }

      console.log("Try call ads!");
      if (!window.checktimeForAds() && !force) {
        console.log("Too soon ads");
        window.ads.interstitOn = true;
        try { window.ads.afterInterstit(); } catch(_) {}
        window.resumeGame();
        return;
      }

      if (typeof window.showAds !== 'undefined') {
        window.showAds();
      } else {
        window.ads.interstitOn = true;
        try { window.ads.afterInterstit(); } catch(_) {}
        window.resumeGame();
      }
    };

    // --------- Share close bridge (имя сохранил) ----------
    window.closeShareWin = () => {
      if (window.state && window.state.gameMain && window.state.gameMain.shareMenu) {
        window.state.gameMain.shareMenu.hide();
      }
    };

    // --------- Server data (сохранил имена sdkInfo.* и общий флоу) ----------
    window.sdkInfo.askForPlayerData = (cbAfter, cbError) => {
      window.sdkInfo.playerSdkObjAsked = true;
      console.log("Ask GamePush player...");

      if (!window.gp) {
        console.warn("GamePush SDK not ready yet");
        if (cbError) cbError();
        return;
      }

      const { player } = window.gp;
      if (!player) {
        console.warn("GamePush player API not available");
        if (cbError) cbError();
        return;
      }

      // player.ready уже в onGPInit, но тут на всякий случай
      Promise.resolve(player.ready).then(() => {
        window.sdkInfo.playerSdkObj = player;
        if (window.state) window.state.serverLoadInit();
        if (cbAfter) cbAfter();
      }).catch(err => {
        console.warn("error with player init", err);
        window.sdkInfo.playerSdkObj = null;
        window.sdkInfo.playerSdkObjAsked = true;
        if (window.state) window.state.serverLoadInit();
        if (cbError) cbError();
      });
    };

   window.sdkInfo.getExternalSaves = (successCb, errorCb) => {
    if (!window.gp || !window.sdkInfo.playerSdkObj) {
      if (!window.sdkInfo.playerSdkObjAsked) {
        window.sdkInfo.askForPlayerData(() => window.sdkInfo.getExternalSaves(successCb, errorCb), errorCb);
      }
      return;
    }

    try {
      window.sdkInfo.serverSaveAsked = true;
      const key = (window.state?.gameData?.settings?.gpSaveKey) || 'gpSaveJSON';
      Promise.resolve(window.gp.player.ready)
        .then(() => window.gp.player.get(key))
        .then((value) => {
          // если поле типа json — value уже объект; если string — попробуем распарсить
          const obj = (value && typeof value === 'string') ? JSON.parse(value) : (value || {});
          console.log('GP data is loaded', obj);
          window.sdkInfo.serverSaveData = obj;
          successCb?.();
        })
        .catch(err => {
          console.log('server data error', err);
          errorCb?.();
        });
    } catch (e) {
      console.log('getExternalSaves error', e);
      errorCb?.();
    }
  };

    window.onGPInit = async (gp) => {
      window.gp = gp;
      const { player, ads } = gp;

      try {
        // Ждём игрока
        await player.ready;

        if (window.state) {
          window.state.initSdk();
        } else {
          console.log("Try init with window.state", window.state);
        }

        if (!window.sdkInfo.playerSdkObjAsked) {
          window.sdkInfo.askForPlayerData();
        }

        console.log("ask for ads.showPreloader", ads.showPreloader)
        if (ads && ads.showPreloader) {
          await ads.showPreloader();
        }

        if (window.state) {
            window.state.paymentsSdkObj = gp.payments;
        }

        if (ads && ads.showSticky) {
          ads.showSticky();
        }
      } catch (e) {
        console.warn("onGPInit flow error", e);
      }
    };
</script>
