              <title>Puzzle Blocks</title>
              <meta http-equiv="content-type" content="text/html; charset=UTF-8">
              <meta id="gameViewport" name="viewport" content="width=device-width initial-scale=1">

              <script async="" src="https://gamepush.com/sdk/gamepush.js?projectId=26547&amp;publicToken=9i8Syj7KNh6fJPFlNKYGloL7PxTqAPn7&amp;callback=onGPInit"></script>

              <script>
                     //var player = null;
                     var autorized = false;
                     var leaderboards;
                     var gamePush;

                     var preloaderShowed = false;

                     var ysdk = null;

                     let myPurchases = [];

                     console.log('gamePush init start');

                     window.onGPInit = function (gp) 
                     {
                            gamePush = gp;

                            console.log('gamePush init complete');

                            // Все возможности GamePush доступны здесь

                            if (gameCreated && !startGamePushInit)
                            {
                                   InitYandex();
                            }
                     }

                     var gameCreated = false;
                     //var gameLoaded = false;
                     var startGamePushInit = false;

                     /*window.addEventListener('load', function () 
                     {
                            gameLoaded = true;

                            if (gameCreated)
                                   InitYandex();

                     });*/

                     function InitYandex()
                     {
                            gameCreated = true;

                            console.log('game created');

                            //if (gameLoaded && !startGamePushInit)
                            {
                                   //startGamePushInit = true;
                                   
                                   

                                   //window.onGPInit = async (gp) =>
                                   if (gamePush != null)
                                   {
                                          //gamePush = gp;

                                          startGamePushInit = true;

                                          var lang = gamePush.language;

                                          console.log(lang);

                                          document.SetLanguage(lang);

                                          gamePush.changeLanguage(lang);

                                          if (gamePush.platform.type === 'YANDEX')
                                          {
                                                 ysdk = gamePush.platform.getNativeSDK();
                                                 
                                                 document.setYandexServer();
                                          }

                                          gwtDocument = document;

                                          initPlayer().then(()=>
                                          {
                                                 initCallbacks();
                                                 
                                                 if (gamePush.sounds.isMuted)
                                                        document.muteAll();

                                                 if (gamePush.sounds.isSFXMuted)
                                                        document.muteSounds();
                                                 
                                                 if (gamePush.sounds.isMusicMuted)
                                                        document.muteMusic();
                                                 
                                                 document.setUseDefaultDarkScheme();
                                                 document.setTimeToInterstitial('60');
                                                 document.setAlternativeShowAds('no');
                                                 document.setPauseAfterReward('no');
                                                 document.setHomeAds('yes');

                                                 console.log('type - ' + gamePush.platform.type);
                                          });
                                   }
                            }
                     }

                     function sendMuteMusic()
                     {
                            gamePush.sounds.muteMusic();
                     }

                     function sendMuteSound()
                     {
                            gamePush.sounds.muteSFX();
                     }

                     function sendUnmuteMusic()
                     {
                            gamePush.sounds.unmuteMusic();
                     }

                     function sendUnmuteSound()
                     {
                            gamePush.sounds.unmuteSFX();
                     }

                     function initCallbacks()
                     {
                            initSoundCallbacks();
                            initAdsCallbacks();
                     }

                     function initAdsCallbacks()
                     {
                            gamePush.ads.on('rewarded:start', () => 
                            {
                                   console.log('OnStartAd');
                                   document.OnStartAd();
                            });
                            // Закончился показ
                            gamePush.ads.on('rewarded:close', (success) => 
                            {
                                   console.log('onCloseAd');

                                   console.log('success - ' + success);

                                   if (success)
                                          document.rewardOk();
                                   
                                   document.onCloseAd();
                            });
                            // Получена награда
                            gamePush.ads.on('rewarded:reward', () => 
                            {
                                   console.log('rewardOk');
                                   //document.rewardOk()
                            });

                            gamePush.ads.on('fullscreen:start', () => 
                            {
                                   console.log('OnStartAd');
                                   document.OnStartAd();
                            });
                            // Закончился показ
                            gamePush.ads.on('fullscreen:close', (success) => 
                            {
                                   console.log('onCloseAd');
                                   document.onCloseAd();
                            });
                     }

                     function initSoundCallbacks()
                     {
                            // Выключили звук
                            gamePush.sounds.on('mute', () => {
                                   document.muteAll();
                            });
                            // Выключили звуковые эффекты
                            gamePush.sounds.on('mute:sfx', () => {
                                   document.muteSounds();
                            });
                            // Выключили музыку
                            gamePush.sounds.on('mute:music', () => {
                                   document.muteMusic();
                            });

                            // Включили звук
                            gamePush.sounds.on('unmute', () => {
                                   document.unmuteAll();
                            });
                            // Включили звуковые эффекты
                            gamePush.sounds.on('unmute:sfx', () => {
                                   document.unmuteSounds();
                            });
                            // Включили музыку звуковые эффекты
                            gamePush.sounds.on('unmute:music', () => {
                                    document.unmuteMusic();
                            });
                     }



                     function setLanguage(lang)
                     {
                            console.log('changeLanguage - ' + lang);

                            gamePush.changeLanguage(lang);
                     }

                     function GameReady()
                     {
                            gamePush.gameStart();

                            console.log('GameReady');
                     }

                     function gameplayStart()
                     {
                            gamePush.gameplayStart();

                            console.log('gameplayStart');
                     }

                     function gameplayStop()
                     {
                            gamePush.gameplayStop();

                            console.log('gameplayStop');
                     }
                         

                     async function initPlayer() 
                     {
                            console.log('initPlayer start');

                            await gamePush.player.ready;

                            var loginIn = gamePush.player.isLoggedIn;

                            if (!loginIn)
                            {
                                   console.log('not autorize');

                                   document.CanLogin();

                                   if (ysdk == null && gamePush.platform.isSecretCodeAuthAvailable)
                                   {
                                          document.setSecretCode(gamePush.player.get('secretCode'));
                                   }

                                   if (!preloaderShowed)
                                   {
                                          gamePush.player.on('login', (success) => 
                                          {
                                                 initPlayer();
                                          });
                                          
                                          startAdsForPlayer();
                                   }
                            }
                            else
                            {
                                   OnPlayerAutorized();
                            }
                     }

                     function TryAutorize()
                     {
                            gamePush.player.login();
                     }

                     function OnPlayerAutorized()
                     {
                             autorized = true;

                            if (ysdk != null)
                            {
                                   ysdk.getLeaderboards().then(_lb => leaderboards = _lb);
                                   //leaderboards = ysdk.leaderboards;

                                   ysdk.getPlayer({ scopes: true }).then(_player => 
                                   {
                                          player = _player;
                                          ReadPayments().then(()=>
                                          {
                                                 document.AutorizeOk();

                                                 ReadPlayerData();

                                                 console.log('autorize ok');
                                                
                                          });
                                   });
                            }
                            else
                            {
                                   ReadPayments().then(()=>
                                   {
                                          document.AutorizeOk();

                                          ReadPlayerData();

                                          console.log('autorize ok');
                                   });
                            }
                     }

                     function GetLeaderboard(name)
                     {
                            console.log('get leaderboard - ' + name);

                            if (ysdk != null)
                            {
                                   leaderboards.getLeaderboardEntries(name, { quantityTop: 10, includeUser: true })
                                   .then(res => {
                                          console.log(res);

                                          const jsonStr = JSON.stringify(res);

                                          console.log(jsonStr);

                                          document.SetLeaderboardData(jsonStr);
                                   });
                            }
                            else
                            {
                                   gamePush.leaderboard.openScoped({
                                          tag: name,
                                          variant: name,
                                   });
                            }
                     }

                     function SetLeaderboardScore(name, myScore)
                     {
                            console.log(name + ': set score - ' + myScore);

                            if (ysdk != null)
                            {
                                   leaderboards.setLeaderboardScore(name, myScore);
                            }
                            else
                            {
                                   gamePush.leaderboard.publishRecord({
                                          tag: name,
                                          variant: name,
                                          record: {
                                                 rating: myScore,
                                          },
                                   });
                            }
                     }

                     function ReadPlayerData()
                     {
                            console.log('read data');

                            const jsonStr = gamePush.player.get('json');

                            console.log(jsonStr);
                            document.ReadData(jsonStr);

                            if (jsonStr.length == 0 && ysdk != null)
                            {
                                   ysdk.getPlayer({ scopes: true }).then(player => 
                                   {
                                          player.getData().then(data => 
                                          {
                                                 console.log(data.json);
                                                 document.ReadData(data.json);
                                          
                                          });
                                   });
                            }
                     }

                     async function SaveData(data)
                     {
                            if (autorized)
                            {
                                   console.log('try save data');

                                   console.log(data);

                                   /*if (ysdk != null && player != null)
                                   {
                                          let dataForSave = 
                                          {
                                                 json: data
                                          }


                                          player.setData(dataForSave).then(() => {
                                                 console.log('yandex save data complete');
                                          });
                                   }
                                   else*/
                                   {
                                          gamePush.player.set('json', data);

                                          await gamePush.player.sync();

                                          console.log('save data complete');
                                   }
                            }
                     }

                            
                     async function ReadPayments()
                     {
                            console.log('read payments');

                            if (gamePush.payments.isAvailable) 
                            {
                                   const result = await gamePush.payments.fetchProducts();

                                   console.log('payments active');

                                   document.SetPaymentsActive();

                                   // Результат ответа
                                   const {
                                   // Список продуктов
                                   products,
                                   // Список покупок игрока
                                   playerPurchases,
                                   } = result;

                                   myPurchases = playerPurchases;

                                   products.forEach(product => {
                                          console.log(`Товар: ${product.name}, Цена: ${product.price} ${product.currency}`);

                                          var price = product.price + ' ' + product.currencySymbol;

                                          console.log(product.tag + " : " + price);

                                          document.setProductPrice(product.tag, price);
                                   });

                                   const hasNoAds = playerPurchases.some(purchase => purchase.tag === 'disableAds');

                                   if (hasNoAds) {
                                          document.DisableAds();
                                          console.log('disable asd');
                                   }
                                   else
                                   {
                                          startAdsForPlayer();
                                   }

                                   gamePush.payments.on('purchase', ({ product, purchase }) => 
                                   {
                                          console.log(product);
                                          console.log(purchase);

                                          if (product.tag === 'disableAds')
                                          {
                                                 document.DisableAds();    
                                                 HideBanner(); 
                                                 console.log('PurchaseOk'); 
                                          }
                                          else
                                          {
                                                 document.PurchaseOk(product.tag, product.id);    
                                                 console.log('PurchaseOk');
                                          }
                                   });
                            }
                            else
                            {
                                   console.log('payments NOT active');
                                   startAdsForPlayer();
                            }
                     }

                     function startAdsForPlayer()
                     {
                            preloaderShowed = true;

                            document.EnableAds();

                            if (gamePush.ads.isFullscreenAvailable)
                            {
                                   gamePush.ads.showPreloader();
                            }

                            if (gamePush.ads.isStickyAvailable)
                            {
                                   gamePush.ads.showSticky();
                            }
                     }

                     function ConsumePurchase(token)
                     {
                            gamePush.payments.consume({ id: token });

                            //payments.consumePurchase(token);
                     }

                     function RestoreMoneyPurchases()
                     {
                            console.log('RestoreMoneyPurchases');

                            myPurchases.forEach(sendMoneyPurchase);

                            console.log('RestoreMoneyPurchases complete');

                            //payments.getPurchases().then(purchases => purchases.forEach(sendMoneyPurchase));
                     }


                     function sendMoneyPurchase(purchase) 
                     {
                            if (purchase.tag !== 'disableAds') 
                            {
                                console.log(purchase.tag + " : " + purchase.payload);

                                document.PurchaseOk(purchase.tag, purchase.productId);
                            }
                     }

                     function Purchase(shopId)
                     {
                            gamePush.payments.purchase({ tag: shopId });
                     }

                     function CheckLang()
                     {
                            
                     }

                     async function ShowReviewDialog()
                     {
                            if (gamePush.app.canRequestReview) 
                            {
                                   if (gamePush.app.isAlreadyReviewed) 
                                   {
                                          const result = await gamePush.app.requestReview();

                                          const { success, rating, error } = result;

                                          if (success) 
                                          {
                                                 console.log(rating);

                                                 // пример работы с рейтингом
                                                 /*switch (rating) {
                                                        case 5:
                                                        showWindow('Мы очень рады, что вам понравилась игра!');
                                                        break;
                                                        case 4:
                                                        case 3:
                                                        // в том числе, если нельзя узнать оценку
                                                        case 0:
                                                        showWindow('Спасибо за отзыв!');
                                                        break;
                                                        case 2:
                                                        case 1:
                                                        showWindow('Будем стараться лучше!');
                                                 }*/
                                          }
                                          
                                   }
                            }
                     }

                     function checkRewardLoading()
                     {
                            if (gamePush.ads.isRewardedAvailable)
                                   document.rewardLoaded();
                     }

                     function checkInterstitialLoading()
                     {
                            if (gamePush.ads.isFullscreenAvailable)
                                   document.interstitialLoaded();
                     }
                     
                     function ShowBanner()
                     {
                            //window.ysdk.adv.showBannerAdv();

                     }    

                     function HideBanner()
                     {
                            gamePush.ads.closeSticky();
                     }    
             
                     function ShowAd() 
                     {
                            gamePush.ads.showFullscreen();
                     }

                     function ShowAdReward() 
                     {
                            gamePush.ads.showRewardedVideo();

                     }

                     function toggleFullscreen() {    
                        var canvas = document.getElementsByTagName("canvas")[0];
                        canvas.requestFullscreen();
                    }

                </script>
