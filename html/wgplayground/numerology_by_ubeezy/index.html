<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NUMEROLOGY</title>
<link rel="stylesheet" href="style.css">
  <!-- WGPlayground official HTML5/JavaScript integration -->
  
<style type="text/css">body{overflow:hidden!important}body:not(.wgIsMidroll) [data-wgplayer]~.wgLoadingAnim{display:none!important}[data-wgplayer]:before{display:none!important}[data-wgplayer]{background:none!important}</style><style>.fadein{animation: 3s linear 0s fadein;}.splash-bg {visibility:hidden;object-fit: contain;position: absolute;left: 0;top: 0;filter: blur(3px) opacity(0.9);transform: scale(2.5) translate(-50%, -50%); top:50%; left:50%; z-index:-1;} .splash-bg.fadein{visibility:visible}canvas, iframe[data-src*="wgplayground.com"] {box-shadow: rgba(0, 0, 0, 0.6) 0px 0px 30px;}@keyframes fadein {from {opacity:0;}to {opacity:1;}}</style><script src="gamepush.js"></script></head>
<body class="wgNoLoader"><img class="splash-bg fadein" src="https://static.wgplayground.com/0d74d8e67fedda497edee7b19a8dc935/wgplayground/4ad96d99523594722bcade2ceecbbc4d.jpg">
<div id="app">
  <div id="bgLayer"></div>
  <div id="vignette"></div>
  <canvas id="fxCanvas" width="1794" height="1234" style="width: 897px; height: 617px; aspect-ratio: 1.45381 / 1;" wg-game-orientation="wg-landscape-game"></canvas>

  <!-- TITLE -->
  <div id="titleScreen" class="screen active">
    <div class="logo-wrap">
      <h1 class="logo">NUMEROLOGY</h1>
      <div class="subtitle">Can you outsmart it?</div>
    </div>
    <div class="ai-stage confident" id="titleAI">
      <div class="ai-core"></div>
      <div class="ai-face">
        <div style="position:relative;width:100%;">
          <div class="brow l"></div><div class="brow r"></div>
        </div>
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
    </div>
    <div class="speech show" id="titleSpeech">"Bet you can't find my number."</div>
    <button class="btn" id="playBtn">Play</button>
  </div>

  <!-- THINKING -->
  <div id="thinkScreen" class="screen" style="justify-content:center; gap:22px;">
    <div class="subtitle" style="letter-spacing:4px;">AI IS THINKING…</div>
    <div id="thinkNumber" style="font-size:clamp(50px,16vw,90px); font-weight:800; color:var(--purple); text-shadow:0 0 30px var(--purple); font-variant-numeric: tabular-nums;">17</div>
    <div class="subtitle" id="lockedLabel" style="opacity:0; transition:opacity .3s ease; color:var(--cyan); letter-spacing:5px;">NUMBER LOCKED</div>
  </div>

  <!-- GAME -->
  <div id="gameScreen" class="screen">
    <div class="hud-top">
      <div class="dots" id="dots"></div>
      <div class="tension-label" id="tensionLabel">TENSION: CALM</div>
    </div>

    <div style="position:relative;">
      <div class="final-tag" id="finalTag">FINAL GUESS</div>
      <div class="ai-stage game confident" id="gameAI">
        <div class="ai-core"></div>
        <div class="ai-face">
          <div style="position:relative;width:100%;"><div class="brow l"></div><div class="brow r"></div></div>
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
      </div>
    </div>
    <div class="speech" id="gameSpeech"></div>

    <div class="range-wrap">
      <div class="range-labels"><span id="rangeLowLabel">1</span><span>possible range</span><span id="rangeHighLabel">100</span></div>
      <div class="range-track"><div class="range-fill" id="rangeFill"></div><div class="range-particles" id="rangeParticles"></div></div>
    </div>

    <div class="history" id="history"></div>

    <div class="input-area">
      <input type="number" id="guessInput" inputmode="numeric" pattern="[0-9]*" min="1" max="100" placeholder="?" autocomplete="off">
      <button class="btn" id="guessBtn" style="width:100%;">Guess</button>
    </div>
  </div>

  <!-- END -->
  <div id="endScreen" class="screen">
    <div class="end-emoji" id="endEmoji">🎯</div>
    <div class="end-title win" id="endTitle">PERFECT!</div>
    <div class="end-rank" id="endRank"></div>
    <div class="end-secret">SECRET NUMBER: <b id="endSecret">73</b></div>
    <div class="end-stats" id="endStats">GUESSES USED: 4</div>
    <button class="btn" id="againBtn" style="margin-top:10px;">Play Again</button>
  </div>
</div>

<script src="script.js"></script>




</body></html>
