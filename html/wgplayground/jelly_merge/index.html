	<script>
		window.startAt = new Date()
		window.progresses = { main: 0 }
		window.isLoad = true

		window.updateProgress = () => {
			const el = document.getElementById('progress-value')
			if (!el) return

			const now = new Date()
			const elapsed = (now - window.startAt) / 1000
			let timePercent = 0

			if (elapsed <= 3) timePercent = elapsed / 3 * 40
			else if (elapsed <= 10) timePercent = 40 + (elapsed - 3) / 7 * 10
			else timePercent = 50

			let totalProgress = 0
			const keys = Object.keys(window.progresses)
			if (keys.length > 0) {
				keys.forEach(k => totalProgress += Math.min(Math.max(window.progresses[k], 0), 100))
				totalProgress = totalProgress / keys.length * 0.5
			}

			const total = Math.min(timePercent + totalProgress, 100)
			const parts = total.toFixed(1).split('.')
			document.getElementById('progress-indicator').style.width = `${Math.max(25, total)}%`
			document.getElementById('progress-value').innerHTML = `${parts[0]}.<span>${parts[1]}%</span>`
		}

		const checkProgress = () => {
			window.updateProgress()
			if (new Date() - window.startAt < 30000 && window.isLoad) {
				requestAnimationFrame(checkProgress)
			}
		}

		requestAnimationFrame(checkProgress)
	</script>
