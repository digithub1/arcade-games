  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
    }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container canvas {
      display: block;
      margin: auto;
    }

    canvas {
      /* PC - maximální velikost pro widescreen */
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
      /* High quality rendering */
      image-rendering: auto;
      image-rendering: high-quality;
    }

    /* PC landscape - plná šířka */
    @media (min-width: 1024px) {
      canvas {
        max-width: 1280px;
        max-height: 720px;
        border-radius: 8px;
        box-shadow: 0 0 60px rgba(0, 245, 255, 0.3),
                    0 0 120px rgba(255, 0, 110, 0.2);
      }
    }

    /* Tablet landscape */
    @media (min-width: 768px) and (max-width: 1023px) {
      canvas {
        max-width: 100%;
        max-height: 100%;
      }
    }

    /* Mobile portrait - přizpůsobení */
    @media (max-width: 767px) and (orientation: portrait) {
      canvas {
        max-width: 100%;
        max-height: 100%;
        width: 100%;
      }
    }

    /* Mobile landscape */
    @media (max-width: 767px) and (orientation: landscape) {
      canvas {
        max-width: 100%;
        max-height: 100%;
        height: 100%;
      }
    }

    /* Loading indicator */
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f5ff;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 24px;
      text-shadow: 0 0 20px #00f5ff;
      z-index: 1000;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #loading.hidden {
      display: none;
    }

    /* Rotate phone overlay */
    #rotate-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #00f5ff;
      font-family: 'Arial Black', Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #rotate-screen .rotate-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: rotate-hint 2s ease-in-out infinite;
    }

    #rotate-screen .rotate-text {
      font-size: 24px;
      text-shadow: 0 0 20px #00f5ff;
      margin-bottom: 10px;
    }

    #rotate-screen .rotate-subtext {
      font-size: 14px;
      color: #8892b0;
      font-family: Arial, sans-serif;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
    }

    /* Zobrazit overlay pouze na mobilech v portrait režimu */
    @media (max-width: 900px) and (orientation: portrait) {
      #rotate-screen {
        display: flex;
      }
      #game-container {
        display: none;
      }
    }
  </style>

  <script>
    // GamePush SDK callback - bude zavolán po načtení SDK
    window.onGPInit = async function(gp) {
      console.log('[GamePush] SDK Loaded');

      // Uložíme referenci globálně pro TypeScript modul
      window.gp = gp;

      // 1. IHNED volat gameStart() - POVINNÉ pro GamePush!
      // Musí být voláno co nejdříve po SDK loaded
      gp.gameStart();
      console.log('[GamePush] gp.gameStart() called IMMEDIATELY');

      // 2. Log jazyk detekovaný SDK
      console.log('[GamePush] Language detected by SDK (gp.language):', gp.language);

      // 3. Čekej na synchronizaci hráče
      await gp.player.ready;
      console.log('[GamePush] Player ready');

      // 4. Dispatch custom event pro TypeScript modul PŘED reklamami
      // Aby hra mohla inicializovat i18n z gp.language
      window.dispatchEvent(new CustomEvent('gamepush-ready', { detail: gp }));

      // 5. Zobraz preloader reklamu při startu (až PO gameStart)
      if (gp.ads.isPreloaderAvailable) {
        await gp.ads.showPreloader();
      }

      // 6. Zobraz sticky banner
      if (gp.ads.isStickyAvailable) {
        gp.ads.showSticky();
      }
    };
  </script>
