<!-- SUCKA DIGG cover art replaced with the supplied cover; powerup pickup FX/SFX enhanced. -->



  <link rel="stylesheet" href="style.css">
<style type="text/css">body{overflow:hidden!important}body:not(.wgIsMidroll) [data-wgplayer]~.wgLoadingAnim{display:none!important}[data-wgplayer]:before{display:none!important}[data-wgplayer]{background:none!important}</style><style type="text/css">body{overflow:hidden!important}body:not(.wgIsMidroll) [data-wgplayer]~.wgLoadingAnim{display:none!important}[data-wgplayer]:before{display:none!important}[data-wgplayer]{background:none!important}</style><style>.fadein{animation: 3s linear 0s fadein;}.splash-bg {visibility:hidden;object-fit: contain;position: absolute;left: 0;top: 0;filter: blur(3px) opacity(0.9);transform: scale(2.5) translate(-50%, -50%); top:50%; left:50%; z-index:-1;} .splash-bg.fadein{visibility:visible}canvas, iframe[data-src*="wgplayground.com"] {box-shadow: rgba(0, 0, 0, 0.6) 0px 0px 30px;}@keyframes fadein {from {opacity:0;}to {opacity:1;}}</style><script src="gamepush.js"></script></head>
<body class="wgNoLoader"><img class="splash-bg fadein" src="https://static.wgplayground.com/3ff6df91b677188661448c093c6748b4/wgplayground/002f1eed2658014e4758a40a9756c960.jpg">
<div id="stage">
  <div id="frame">
    <canvas id="game" width="450" height="750" wg-game-orientation="wg-portrait-game" style="aspect-ratio: 1.45381 / 1;"></canvas>
    <div class="hud">
      <div id="powerBadge" class="power-badge"></div>
      <div class="hud-top">
        <div class="score-box">
          <span class="label">SCORE</span>
          <span class="val" id="scoreVal">000</span>
        </div>
        <div>
          <div class="score-box" style="text-align:right;">
            <span class="label">BEST</span>
            <span class="val" id="bestVal">000</span>
          </div>
          <div class="hearts" id="hearts"></div>
          <div class="charge" id="chargeLabel"></div>
        </div>
      </div>
      <div class="form-badge" id="formBadge">🩸 BLOOD MOSQUITO</div>
      <div class="center-msg" id="comboMsg">NICE!</div>
      <button id="pauseBtn" aria-label="Pause game">⏸</button>
      
    </div>

    <div class="overlay" id="introScreen">
      <img class="cover-art" src="" alt="Sucka Digg cover">
      <div class="cover-vignette" aria-hidden="true"></div>
      <div class="intro-enter">
        <button class="btn" id="introBtn">TAP TO ENTER</button>
        <div class="hint">The blood-sucking chaos begins.</div>
      </div>
    </div>

    <div class="overlay hidden" id="startScreen">
      <img class="cover-art" src="" alt="SUCKA DIGG game cover">
      <div class="cover-vignette" aria-hidden="true"></div>
      <div class="cover-menu">
        <button class="btn" id="startBtn">TAP TO FLY</button>
        <div class="hint">Tap / click / Space to flap. Dodge the fan, hand, spray &amp; lamp. Grab 🩸, powerups and survive the room. Three hearts — don't get sucked.</div>
      </div>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
      <div class="bug" id="deathEmoji">💀</div>
      <h1 class="title" id="gameOverTitle">SUCKA DIGG</h1>
      <div class="stat-row">
        <div class="stat"><span class="n" id="finalScore">0</span><span class="l">SCORE</span></div>
        <div class="stat"><span class="n" id="finalBlood">0</span><span class="l">BLOOD</span></div>
        <div class="stat"><span class="n" id="finalBest">0</span><span class="l">BEST</span></div>
      </div>
      <button class="btn gold" id="retryBtn">FLY AGAIN</button>
    </div>

    <div class="overlay hidden" id="pauseScreen">
      <h1 class="title" style="font-size:30px;">PAUSED</h1>
      <button class="btn gold" id="resumeBtn">RESUME</button>
    </div>
  </div>
</div>


  <script src="game.js"></script>




</body></html>
