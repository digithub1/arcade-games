            <meta property="wgp:description" content="This game is one of the oldest in the world. The origins of the game lie in the depths of centuries and it is impossible to say when and by whom it was invented. The earliest traces of this game were found in Troy (3000-2500 BC), Pakistan (2600-1800 BC). Archaeologists have also found hundreds of ancient boards for this game in Egypt, Armenia, Greece, Italy, Iceland, China and other parts of the Old World. No other game in the history of mankind has been so popular.The game has a huge number of variations and names. This application presents the classic European version of the game.The game can be played with artificial intelligence, with another person on one device, or with an opponent online in multiplayer mode.">
            <meta property="wgp:instructions" content="Each player takes turns placing their chip on one of the empty circles. As soon as a player has managed to line up three of his pieces in a straight line, he removes any of his opponent's pieces from the board. This row of three pieces of the same color is called a mill.After a player has placed all of his pieces on the board, he can start moving: moving his pieces. Players move their pieces one by one to an adjacent free circle along the line, creating a mill. They cannot jump or move their pieces diagonally.As soon as one of the players has three pieces left, he gains an advantage. On his next move, he can move his pieces to any free circle, regardless of the squares.The game is considered over in two cases:- When one of the players has two pieces left. He is considered the loser, since he can no longer build a mill.- The game is considered won by a player if the opponent cannot make a move, since all the adjacent squares are occupied.">
