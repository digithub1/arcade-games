    <style>
        :root { --bg-fallback: #000; }

        html, body {
            padding: 0;
            margin: 0;
            height: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: var(--bg-fallback);
        }

        .viewport {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
        }

        #unity-canvas { background: transparent !important; outline: none; }
        canvas:focus { outline: none; }

        @media (min-width: 769px) {
            #unity-container.unity-desktop {
                width: 56.25vh;
                height: 100vh;
                max-width: 100vw;
                max-height: 177.78vw;
            }
            #unity-container.unity-desktop #unity-canvas {
                width: 100% !important;
                height: 100% !important;
            }
        }

        @media (max-width: 768px) {
            #unity-container.unity-mobile #unity-canvas {
                width: 100vw !important;
                height: 100vh !important;
            }
        }

        #loading-cover {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 9999;
            background: rgba(0,0,0,0);
        }

        /* Центрируем загрузку */
        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: min(80vw, 600px); /* фикс ширины до 600px */
        }

        #unity-logo img {
            width: 160px;
            height: auto;
            display: block;
        }

        #unity-progress-bar-empty {
            display: block !important;
            width: 100%;         /* растянутая ширина */
            height: 30px;        /* фиксированная высота */
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: #4aa3ff;
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255,255,255,0.25);
            border-top-color: rgba(255,255,255,0.9);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

<body class="dark wgNoLoader" style="background: url(&quot;background.jpg&quot;) center center / cover no-repeat rgb(0, 0, 0);"><img class="splash-bg fadein" src="https://static.wgplayground.com/fb4098af8649cc35a0f3d78643db3dd7/wgplayground/883d6d10015ba77831e85ff25120193a.jpg">

        <div id="unity-container" class="unity-desktop" style="width: 313.875px; height: 558px;">
            <canvas id="unity-canvas" wg-game-orientation="wg-portrait-game" style="aspect-ratio: 0.896057 / 1;"></canvas>
        </div>
    </div>

    <div id="loading-cover" style="display: block;">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="logo.png" alt="logo"></div>
            <div id="unity-progress-bar-empty" style="display: block;">
                <div id="unity-progress-bar-full" style="width: 0%;"></div>
            </div>
            <div class="spinner" style="display: none;"></div>
        </div>
    </div>

    <script>
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/MiniChallanges.loader.js";
        const config = {
            dataUrl: buildUrl + "/MiniChallanges.data.unityweb",
            workerUrl: buildUrl + "/MiniChallanges.data.unityweb",
            frameworkUrl: buildUrl + "/MiniChallanges.framework.js.unityweb",
            codeUrl: buildUrl + "/MiniChallanges.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Welwise Studio",
            productName: "ProjectTemplate MirraSDK",
            productVersion: "1.0",
        };

        const container        = document.querySelector("#unity-container");
        const canvas           = document.querySelector("#unity-canvas");
        const loadingCover     = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull  = document.querySelector("#unity-progress-bar-full");
        const spinner          = document.querySelector(".spinner");

        const bgFile = (backgroundFileName && backgroundFileName.trim() !== "") ? backgroundFileName : "background.jpg";
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        container.className = isMobile ? "unity-mobile" : "unity-desktop";

        if (!isMobile) {
            document.body.style.background = "url('" + bgFile + "') center / cover no-repeat #000";
        } else {
            document.body.style.background = "#000";
        }

        loadingCover.style.display = "block";
        progressBarEmpty.style.display = "block";

        const unityLoader = document.createElement("script");
        unityLoader.src = loaderUrl;
        unityLoader.onload = async () => {
            createUnityInstance(canvas, config, (progress) => {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "block";
                progressBarFull.style.width = `${Math.floor(100 * progress)}%`;
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                loadingCover.style.display = "none";
            }).catch((message) => {
                console.log(message);
            });
        };
        document.body.appendChild(unityLoader);

        function fitAspect916() {
            if (isMobile) return;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const target = 9 / 16;
            let w, h;
            if (vh * target > vw) { w = vw; h = w / target; }
            else { h = vh; w = h * target; }
            container.style.width = w + "px";
            container.style.height = h + "px";
        }
        if (!isMobile) {
            fitAspect916();
            window.addEventListener("resize", fitAspect916);
        }
    </script><script src="Build/MiniChallanges.loader.js"></script>
