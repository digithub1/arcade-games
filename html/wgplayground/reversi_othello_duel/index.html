            <meta property="wgp:instructions" content="When making a move, a player places his piece on one of the squares of the board in such a way that between this placed piece and one of the pieces of his color already on the board there is a continuous row of the opponent's pieces, horizontal, vertical or diagonal, so that the continuous row of the opponent's pieces is &quot;closed&quot; by the player's pieces on both sides. All the opponent's pieces that are part of the &quot;closed&quot; row on this move are turned over to the other side and go to the player who made the move.If as a result of one move more than one row of the opponent's pieces is &quot;closed&quot; at the same time, then all the pieces that are on those &quot;closed&quot; rows that go from the placed piece are turned over.The game ends when all the pieces are placed on the board or when neither player can make a move. The player with the most pieces on the board wins.">
