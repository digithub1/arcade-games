            <meta property="wgp:description" content="The game is between two players who take turns making their moves.The pieces cannot complete their movement on the field in which the mountain, their other piece, or the opponent's piece is located if it cannot be eaten. The figures, except for the bishop figure, can move through fields occupied by other figures of the same color - their own figures, but they cannot complete their movement on these fields. To capture an opponent's piece, a player follows the same rules as when making a normal move, except that he must move his piece in a straight path (i.e., in only one direction) and must complete his movement on the field occupied by a piece of his opponent's color, which is called the captured piece. In addition, the captured piece must be available for capture - it must not have numbers with the designation of armor. After the capture is completed, the captured piece is removed from the game board.">
            <meta property="wgp:instructions" content="The game can be played with artificial intelligence, together with another person on the same device, or with a rival online in multiplayer mode.Basic conceptsAttack — the relative position of the pieces in a straight line, leading to a decrease in armor units.Armor is a characteristic of a figure that is reduced by an attack, the positive value of which prevents the enemy figure from capturing and eating the figure.Capture is an opportunity to move your piece into the field where the opponent's piece is located, which does not have armor.ArmorEach piece has an armor class and an attack range, which are determined by its type.An opponent's piece is considered to be attacked if there is a direct route to it and the distance to it is equal to or less than the capture range of the attacking piece. Attacking through the field where the mountain is located is not possible.Attacking a piece reduces the value of the piece's armor. Pieces without armor can be taken when an opponent's piece is moved onto them.The armor class of a piece determines how many enemy pieces must attack a piece in order for it to be captured: pieces with heavy armor must be attacked by at least two pieces, pieces with light armor by at least one, and unarmored pieces can be captured without attacking at all.A capture can also be made by a piece that does not attack if the captured piece has no armor left.Mountains and waterNo figure can stop in the fields where the mountains are located. Only a dragon can pass through the fields where the mountain is located. The catapult can make a shot through the mountains.Fields of water stop the movement of figures passing through these fields. A piece that enters a field of water can continue moving - it can only leave the water on the player's next turn.Completing the gameThe player loses if:- All the kings of this player have been captured;- all the pieces of this player are at the tower;Types of shapesThe ten types of shapes are listed below. The type of a figure determines its armor class, movement, and attack range. There are also special rules related to each type.Militia — Armor: 1, Move: 1, Attack: 1.Spearman — Armor: 1, Movement: 1, Attack: 1. The attack is carried out only two fields ahead. The opponent's pieces cannot pass through any field in front of the spearman in one turn. Only a dragon can fly over these fields in one turn.Rider — Armor: 1, Movement: 3, Attack: 1.Knight — Armor: 2, move: 2, Attack: 1.Elephant armor: 2, Move: 1, Attack: 2. Cannot move through fields containing its own shapes.Crossbowman — Armor: 0, Movement: 2, Attack: 3. Cannot capture enemy pieces.Trebuchet armor: 0, Move: 1, Capture/Attack: 4, minimum 2.Dragon Armor: 2, Move: 4, Attack: 2. Can move through fields with mountains.Armor tower: 2, does not move, friendly figures in neighboring fields become invulnerable.King — Armor: 1, Move: 1, Attack: 1.">
