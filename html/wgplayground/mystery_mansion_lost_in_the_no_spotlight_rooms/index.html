	.fog-layer-1 {

		background-repeat: repeat;
		opacity: 0.16;
		mix-blend-mode: screen;
		animation: driftLayer1 45s linear infinite;

	/* Детальный слой тумана (меньше, чуть быстрее, для параллакса) */

<script async="" src="https://gamepush.com/sdk/game-score.js?projectId=28587&amp;publicToken=BxKPUH1txQvNnM0EbirOLPDrljR74HyO&amp;callback=onGPInit"></script>

<script>
   // Global variable to hold cloud progress data for Construct 2
   window.cloudSaveData = "";

   // Callback triggered when GamePush SDK is successfully loaded
   window.onGPInit = async (gp) => {
      window.gp = gp;
      console.log('GamePush SDK ready');
      
      // Listen to SDK mute state changes to trigger sound control in Construct 2
      gp.sounds.on('mute', () => {
         safeCallC2("GP_MuteAudio");
      });
      gp.sounds.on('unmute', () => {
         safeCallC2("GP_UnmuteAudio");
      });

      // Mute audio during any ad display manually to prevent audio overlapping
      gp.ads.on('start', () => {
         safeCallC2("GP_MuteAudio");
      });
      gp.ads.on('close', () => {
         if (!gp.sounds.isMuted) {
            safeCallC2("GP_UnmuteAudio");
         }
      });
      
      try {
         // Wait for the player sync with server database
         await gp.player.ready;
         console.log('[GamePush CloudLoad] Player ready and database synchronized.');
         
         // Retrieve 'progress' field from GamePush Cloud on startup
         const progress = gp.player.get('progress');
         if (progress) {
            window.cloudSaveData = progress;
            console.log('[GamePush CloudLoad] SUCCESS: Found cloud save. Size:', progress.length, 'bytes.');
         } else {
            console.log('[GamePush CloudLoad] NOTICE: No cloud save found on GamePush servers (new player).');
         }

         if (!window.c2GameStarted) {
            await gp.ads.showPreloader();
         } else {
            console.log('Construct 2 runtime already started by timeout fallback. Skipping preloader ad.');
         }
         
         gp.ads.showSticky();
      } catch (e) {
         console.warn('Warn: Error or block encountered during SDK start actions:', e);
      } finally {
         startC2Game();
      }
   };

   // Helper function to safely trigger Construct 2 callbacks
   function safeCallC2(funcName, args) {
      if (typeof c2_callFunction !== "undefined") {
         c2_callFunction(funcName, args);
      } else {
         console.warn(`Construct 2 runtime not initialized yet. Call skipped: ${funcName}`, args);
      }
   }

   // Manual sound controllers (Called from Construct 2 via Browser -> Execute Javascript)
   function MuteAudio() {
      if (window.gp && window.gp.sounds) {
         window.gp.sounds.mute();
      } else {
         safeCallC2("GP_MuteAudio");
      }
   }

   function UnmuteAudio() {
      if (window.gp && window.gp.sounds) {
         window.gp.sounds.unmute();
      } else {
         safeCallC2("GP_UnmuteAudio");
      }
   }

   function ToggleMute() {
      if (window.gp && window.gp.sounds) {
         if (window.gp.sounds.isMuted) {
            UnmuteAudio();
         } else {
            MuteAudio();
         }
      } else {
         safeCallC2("GP_MuteAudio");
      }
   }

   // Detect active language with English fallback
   function KnowLang() {
      let currentLang = 'en';
      
      const urlParams = new URLSearchParams(window.location.search);
      const gpLang = urlParams.get('_gp_lang');
      
      if (gpLang) {
         currentLang = gpLang.toLowerCase();
      } else if (window.gp && window.gp.language) {
         currentLang = window.gp.language.toLowerCase();
      }
      
      const gameSupportedLanguages = ['it', 'fr', 'zh', 'pt', 'es', 'ru', 'en', 'de'];
      
      if (gameSupportedLanguages.includes(currentLang)) {
         console.log('KnowLang() called. Returning language to Construct 2: ' + currentLang);
         return currentLang;
      }
      
      console.log('KnowLang() called. Unsupported language detected, returning default: en');
      return 'en';
   }	

   // Show video ad to grant rewards
   function ShowRewAd() {
      if (!window.gp) {
         console.warn('GamePush SDK is not ready yet');
         safeCallC2("Log", ["Error"]);
         safeCallC2("GiveReward", ["false"]);
         return;
      }

      console.log('Video ad open.');
      safeCallC2("Log", ['Video ad open']);

      window.gp.ads.showRewardedVideo()
         .then((success) => {
            if (success) {
               console.log('Rewarded!');
               safeCallC2("Log", ['Rewarded']);
               safeCallC2("GiveReward", ["true"]);
            } else {
               console.log('Video ad closed without reward.');
               safeCallC2("Log", ['Video ad closed']);
               safeCallC2("GiveReward", ["false"]);
            }
         })
         .catch((e) => {
            console.error('Error while displaying video ad: ', e);
            safeCallC2("Log", ["Error"]);
            safeCallC2("GiveReward", ["false"]);
         });
   }

   function MoreGames() {}

   // Prompt the user to review/rate the game
   function RateGame() {
      if (window.gp && window.gp.app && window.gp.app.canRequestReview) {
         window.gp.app.requestReview()
            .then((result) => {
               console.log('Review prompt response:', result);
            })
            .catch((e) => {
               console.warn('Could not launch review popup: ', e);
            });
      } else {
         console.log('Review option is not supported or already submitted');
      }
   }

   // Gameplay start tracking
   function GameplayStart() {
      if (window.gp) {
         window.gp.gameplayStart();
      }
   }

   // Gameplay stop tracking
   function GameplayStop() {
      if (window.gp) {
         window.gp.gameplayStop();
      }
   }

   // Cloud saving handler
   function CloudSave(encodedJSON) {
      if (!window.gp) {
         console.warn("[GamePush CloudSave] SDK is not ready yet. Save aborted.");
         return;
      }
      
      try {
         const jsonString = decodeURIComponent(encodedJSON);
         window.cloudSaveData = jsonString; 
         console.log("[GamePush CloudSave] Save received from Construct 2. Size:", jsonString.length, "bytes.");
         
         window.gp.player.set('progress', jsonString);
         console.log("[GamePush CloudSave] Syncing progress with GamePush Cloud...");
         
         window.gp.player.sync()
            .then(() => {
               console.log("[GamePush CloudSave] SUCCESS: Progress synced with GamePush Cloud server.");
            })
            .catch((e) => {
               console.error("[GamePush CloudSave] ERROR: Sync with GamePush Cloud server failed:", e);
            });
      } catch (err) {
         console.error("[GamePush CloudSave] ERROR: Decoding save string failed:", err);
      }
   }

   // Helper to fetch cloud save
   function GetCloudSaveData() {
      if (window.cloudSaveData && window.cloudSaveData !== "") {
         console.log("[Construct 2 -> JS] SUCCESS: Loading game from CLOUD save.");
         return window.cloudSaveData;
      }
      console.log("[Construct 2 -> JS] NOTICE: Loading game from LOCAL slot.");
      return "";
   }

   function SavePlayerField(key, value) {
      if (window.gp && window.gp.player) {
         window.gp.player.set(key, value);
         window.gp.player.sync();
      }
   }

   function GetPlayerField(key) {
      if (window.gp && window.gp.player) {
         return window.gp.player.get(key);
      }
      return null;
   }

   function notifyGameLoaded() {
      if (window.gameStartTriggered) {
         return;
      }
      
      if (window.gp) {
         window.gameStartTriggered = true;
         window.gp.gameStart();
         console.log('GameStart (GameReady) manually triggered from Construct 2 menu');
      } else {
         console.warn('GamePush SDK is not ready yet when notifyGameLoaded was called');
      }
   }
</script>

			y &= (PERIOD - 1);
			return randomTable[y * PERIOD + x];
		}

		function fade(t){
			return t * t * (3 - 2 * t);
		}

		function valueNoise(x, y){
			let xi = Math.floor(x);
			let yi = Math.floor(y);

			let tx = x - xi;
			let ty = y - yi;

			let sx = fade(tx);
			let sy = fade(ty);

			let a = lattice(xi, yi);
			let b = lattice(xi + 1, yi);
			let c = lattice(xi, yi + 1);
			let d = lattice(xi + 1, yi + 1);

			let ab = a + (b - a) * sx;
			let cd = c + (d - c) * sx;

			return ab + (cd - ab) * sy;
		}

		function fbm(x, y){
			let value = 0;
			let amplitude = 0.5;
			let frequency = 1;

			for(let octave = 0; octave < 3; octave++){
				value += amplitude * valueNoise(x * frequency, y * frequency);
				amplitude *= 0.5;
				frequency *= 2;
			}
			return value;
		}

		const image = ctx.createImageData(WIDTH, HEIGHT);
		const pixels = image.data;

		for(let y = 0; y < HEIGHT; y++){
			for(let x = 0; x < WIDTH; x++){
				let nx = (x / WIDTH) * PERIOD;
				let ny = (y / HEIGHT) * PERIOD;

				let n = fbm(nx, ny);
				let c = Math.floor(n * 255);
				let idx = (y * WIDTH + x) * 4;

				pixels[idx]     = Math.floor(c * 0.82); // R
				pixels[idx + 1] = Math.floor(c * 0.88); // G
				pixels[idx + 2] = c;                    // B
				pixels[idx + 3] = 255;                  // A
			}
		}

		ctx.putImageData(image, 0, 0);

		const dataUrl = canvas.toDataURL("image/png");
		document.documentElement.style.setProperty('--fog-texture', 'url(' + dataUrl + ')');
	})();
	</script>
