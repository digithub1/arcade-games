    <script type="text/javascript">
        window.RESUME_GAME_CALLBACK = function () {
            if (window.unmuteGameAudio) window.unmuteGameAudio();
            if (window.resumeGame) window.resumeGame();
        };

        window.showWgMidroll = function () {
            if (window.preroll && window.preroll.config && window[window.preroll.config.loaderObjectName]) {
                window[window.preroll.config.loaderObjectName].refetchAd(window.RESUME_GAME_CALLBACK);
            }
        };

        window.registerWgRewardCallbacks = function (onReady, onSuccess, onFail) {
            if (window.preroll && window.preroll.config && window[window.preroll.config.loaderObjectName]) {
                window[window.preroll.config.loaderObjectName].registerRewardCallbacks({
                    onReady: onReady,
                    onSuccess: onSuccess,
                    onFail: onFail
                });
            }
        };

        window.showWgRewardAd = function () {
            if (window.preroll && window.preroll.config && window[window.preroll.config.loaderObjectName]) {
                window[window.preroll.config.loaderObjectName].showRewardAd();
            }
        };

        window.addEventListener("DOMContentLoaded", function () {
            var played = false;

            function triggerPlayAd(event) {
                if (played) return;
                played = true;

                if (event && typeof event.preventDefault === "function") {
                    event.preventDefault();
                }
                if (event && typeof event.stopImmediatePropagation === "function") {
                    event.stopImmediatePropagation();
                }

                setTimeout(function () {
                    window.showWgMidroll();
                }, 100);
            }

            document.addEventListener("touchstart", triggerPlayAd, true);
            document.addEventListener("mousedown", triggerPlayAd, true);
        });
    </script>
