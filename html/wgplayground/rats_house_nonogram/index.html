	/* Disable user selection to avoid strange bug in Chrome on Windows:
	* Selecting a text outside the canvas, then clicking+draging would
	* drag the selected text but block mouse down/up events to the engine.
	*/
	body {
	
		position: fixed; /* Prevent overscroll */
	
		margin:0;
		padding:0;
	}

	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}

	.canvas-app-container:-webkit-full-screen {
		/* Auto width and height in Safari/Chrome fullscreen. */
		width: auto;
		height: auto;
	}

	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		vertical-align: bottom;
	}

	#canvas-container {
		position: relative;
	}

	canvas:focus, canvas:active {
		outline: none;
		border: 0;
		ie-dummy: expression(this.hideFocus=true);
		-moz-outline-style: none;
	}

	body, div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-khtml-user-select: none;
		-moz-user-select: none;
		-ms-user-select: none;
		user-select: none;
	}

	/* =========================================================================
   НАСТРОЙКИ (ВСЁ ТУТ)
   ========================================================================= */
:root {
	/* --- ЛОГОТИП --- */
	/* Жесткий размер логотипа в пикселях (он будет растянут или сжат под эти числа) */
	--logo-width: 192px;  
	--logo-height: 192px; /* Если лого не квадратное, поменяй высоту */
	
	/* Тень логотипа: сдвиг-X сдвиг-Y размытие ЦВЕТ(r, g, b, прозрачность) */
	/* 0.4 - это 40% непрозрачности тени. Уменьши, чтобы сделать слабее. */
	--logo-shadow: 0 10px 15px rgba(0, 0, 0, 0.4);

	/* --- ПОЛОСА ЗАГРУЗКИ --- */
	--bar-color: #6a2161; 
	--track-bg: rgba(0, 0, 0, 0.5);

	/* --- ФОН ЭКРАНА --- */
	--bg-center: #ebca62;
	--bg-edge: #e8ad62;
}

/* =========================================================================
   АНИМАЦИЯ (ДЫХАНИЕ ЛОГОТИПА)
   ========================================================================= */
@keyframes logo-breathe {
	0% { 
		/* Исходный размер */
		background-size: var(--logo-width) var(--logo-height);
	}
	50% { 
		/* Увеличение на 10% (умножаем на 1.1) */
		background-size: calc(var(--logo-width) * 1.1) calc(var(--logo-height) * 1.1);
	}
	100% { 
		/* Возврат */
		background-size: var(--logo-width) var(--logo-height);
	}
}

/* =========================================================================
   СТИЛИ ПОЛОСЫ ЗАГРУЗКИ
   ========================================================================= */
.canvas-app-progress {
	position: absolute;
	height: 16px;              
	width: 40%;                
	left: 30%;                 
	bottom: 20%;               
	background-color: var(--track-bg);
	border-radius: 10px;       
	overflow: hidden;          
	box-shadow: 0 0 10px rgba(0,0,0,0.5); 
	-webkit-mask-image: -webkit-radial-gradient(white, black);
	z-index: 100;
}

.canvas-app-progress-bar {
	font-size: 12px;
	height: 100%;
	width: 100%;
	background-color: var(--bar-color);
	transition: transform 0.1s linear;
	transform-origin: left;
	transform: scaleX(0);
}

/* =========================================================================
   СТАНДАРТНЫЙ КОД DEFOLD + НАСТРОЙКИ КАНВАСА
   ========================================================================= */



.link, .button {
	font-family: sans-serif;
	font-size: 14px;
	font-weight: normal;
	font-style: normal;
	font-stretch: normal;
	line-height: normal;
	padding-top: 12px;
}

.buttons-background {
	background-color: #000000;
	width: 100%;
	height: 42px;
}

body {
	background-color: var(--bg-edge);
}

.canvas-app-container {
	background: var(--bg-edge);
	background: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-edge) 100%);
}

.canvas-app-canvas {
	background-position: center center;
	background-repeat: no-repeat;
	
	/* --- ПРИМЕНЕНИЕ НАСТРОЕК ЛОГОТИПА --- */
	
	/* 1. Устанавливаем размер из переменных */
	background-size: var(--logo-width) var(--logo-height);
	
	/* 2. Анимация теперь меняет background-size, а не transform */
	animation: logo-breathe 3s infinite ease-in-out;
	
	/* 3. Тень берется из переменной */
	filter: drop-shadow(var(--logo-shadow)); 

	background-image: url("logo.png");
}
