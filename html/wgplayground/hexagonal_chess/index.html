            <meta property="wgp:description" content="The game is played on boards consisting of hexagonal cells. Since each hexagonal square that is not on the edge of the board has six adjacent squares, this increases the mobility of the pieces (which cannot move diagonally) compared to a standard orthogonal chessboard.The game can be played with artificial intelligence, together with another person on the same device, or with a rival online in multiplayer mode. You can also watch other players' games, act as a spectator, and offer your own version of the player's next move by making it on the board.There are six types of hexagonal chess implemented in the game: Glinsky, Saffron, De Vasa, Bruski, McCooey, Star.">
            <meta property="wgp:instructions" content="1. Glinsky's ChessThe game is played on a vertically oriented regular hexagonal board with sides of 6 squares, which has 91 hexagonal squares of three colors, with a middle square. The usual set of chess pieces increases by one bishop and one pawn.2. Saffron ChessThe board has the shape of an irregular hexagon.All pieces, except pawns and kings, move and take exactly the same way as in Glinsky chess. The pawn moves diagonally like a bishop. A pawn can be taken on the pass. Castling is allowed.3. De Vasa's ChessPlayers can cast both short and long.The pawns start the game on the third horizontal. The pawn strikes diagonally forward.4. Chess BarsCastling and pawn capture are allowed on the pass.5. McCooey ChessA pawn capture corresponds to a bishop move. 6. Star ChessAt the beginning of the game, the players take turns placing their pieces on the squares behind their pawns. There is no pick-up on the passageway.">
