  <div id="loading">Loading...</div>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const container = document.querySelector('#unity-container');

    function fitGameToViewport() {
      const width = Math.max(1, document.documentElement.clientWidth, window.innerWidth || 0);
      const height = Math.max(1, document.documentElement.clientHeight, window.innerHeight || 0);
      container.style.setProperty('width', width + 'px', 'important');
      container.style.setProperty('height', height + 'px', 'important');
      canvas.style.setProperty('width', width + 'px', 'important');
      canvas.style.setProperty('height', height + 'px', 'important');
    }

    fitGameToViewport();
    window.addEventListener('resize', fitGameToViewport);
    window.addEventListener('orientationchange', fitGameToViewport);
    new ResizeObserver(fitGameToViewport).observe(document.documentElement);
    const buildUrl = 'Build';
    const config = {
      dataUrl: buildUrl + '/wg1.data',
      frameworkUrl: buildUrl + '/wg1.framework.js',
      codeUrl: buildUrl + '/wg1.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'DefaultCompany',
      productName: 'Project_Clicker',
      productVersion: '0.0.0.1'
    };
    const loader = document.createElement('script');
    loader.src = buildUrl + '/wg1.loader.js';
    loader.onload = () => createUnityInstance(canvas, config).then(instance => {
      window.unityInstance = instance;
      document.querySelector('#loading').remove();
      fitGameToViewport();
      canvas.focus();
    }).catch(error => { console.error(error); document.querySelector('#loading').textContent = error; });
    document.body.appendChild(loader);
    document.addEventListener('contextmenu', event => event.preventDefault());
    window.addEventListener('keydown', event => {
      if (['ArrowUp','ArrowDown',' '].includes(event.key)) event.preventDefault();
    });
  </script><script src="Build/wg1.loader.js"></script>
