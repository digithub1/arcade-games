<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Clicker - Dark Mode</title>
<style>
  /* === Reset & body === */
  body {
    margin: 0;
    background: #121212;
    color: #a5ffa5;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
    overflow-x: hidden;
  }
  /* Loading Screen */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: #121212;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.7s ease;
  }
  #loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loading-logo {
    width: 180px;
    margin-bottom: 15px;
  }
  #loading-text {
    font-size: 24px;
    font-weight: bold;
    color: #90ee90;
    text-shadow: 0 0 10px #90ee90;
  }

  /* Cash display top-right */
  #cash-display {
    position: fixed;
    top: 10px;
    right: 20px;
    font-size: 24px;
    font-weight: bold;
    color: #90ee90;
    text-shadow: 0 0 5px #90ee90;
    z-index: 100;
  }
  /* Clickable image button in center */
  #click-button {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 200px; /* Increased size */
    height: auto; /* Maintain aspect ratio */
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease;
    z-index: 10;
  }
  
  /* Shrink effect when clicked - UPDATED to work with centered position */
  #click-button:active {
    transform: translate(-50%, -50%) scale(0.9);

  }
  /* Upgrades container fixed bottom center with horizontal scroll */
  #upgrade-container {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 900px;
    display: flex;
    gap: 15px;
    overflow-x: auto;
    padding-bottom: 10px;
    z-index: 50;
  }
  /* Each upgrade button style */
  .upgrade-button {
    background: #1a1a1a;
    border: 2px solid #3f9e3f;
    border-radius: 10px;
    color: #90ee90;
    padding: 12px 10px;
    flex: 0 0 150px;
    box-shadow: 0 0 8px #3f9e3f;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.2s;
    user-select: none;
  }
  .upgrade-button:hover {
    background: #2a2a2a;
  }
  .upgrade-name {
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 16px;
    text-align: center;
  }
  .upgrade-cost {
    font-size: 14px;
    margin-bottom: 6px;
    color: #b5f5b5;
  }
  .upgrade-count {
    font-size: 12px;
    color: #6f6f6f;
  }
  /* Floating cash popup - bigger & bold */
  .cash-popup {
    position: fixed;
    color: #00ff00;
    font-weight: 900;
    font-size: 28px;
    pointer-events: none;
    user-select: none;
    animation: floatUp 1s ease forwards;
    text-shadow: 0 0 12px #00ff00;
    z-index: 1000;
  }
  @keyframes floatUp {
    0% {
      opacity: 1;
      transform: translateY(0);
    }
    100% {
      opacity: 0;
      transform: translateY(-60px);
    }
  }
  /* Double cash timer (hidden initially) */
  #double-cash-timer {
    position: fixed;
    top: 60px;
    left: 20px;
    background: #004400;
    padding: 8px 14px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
    color: #90ee90;
    text-shadow: 0 0 8px #90ee90;
    display: none;
    z-index: 100;
  }
  /* Watch ad button with icon */
  #watch-ad-button {
    position: fixed;
    top: 10px;
    left: 20px;
    background: #228822;
    color: #b5ffb5;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 12px 8px 38px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 8px #228822;
    user-select: none;
    animation: rock 2s infinite ease-in-out;
    z-index: 100;
    background-image: url('https://i.ibb.co/vvL00HfR/image-removebg-preview-5-1.png');
    background-repeat: no-repeat;
    background-position: 10px center;
    background-size: 18px 18px;
  }
  @keyframes rock {
    0%, 100% { transform: rotate(2deg); }
    50% { transform: rotate(-2deg); }
  }
</style>

<body class="wgNoLoader">

<!-- Loading Screen -->
<div id="loading-screen">
  <img id="loading-logo" src="https://tcawgames.github.io/images/logo.png" alt="Tcaw Games Logo">
  <div id="loading-text">Tcaw Games</div>
</div>

<div id="watch-ad-button" title="Get 2x cash for 15 minutes!">2X Cash | Watch AD</div>
<div id="double-cash-timer" style="display: none;"></div>
<div id="cash-display">Cash: $0</div>
<img id="click-button" src="https://i.ibb.co/V0CNZZPZ/image.png" alt="Click Button">

<div id="upgrade-container"></div>

<script>
(() => {
  let cash = 0;
  let upgrades = {};
  let doubleCashTimeLeft = 0; // milliseconds
  const doubleCashDuration = 15 * 60 * 1000; // 15 minutes in ms

  const cashDisplay = document.getElementById('cash-display');
  const clickButton = document.getElementById('click-button');
  const upgradeContainer = document.getElementById('upgrade-container');
  const doubleCashTimer = document.getElementById('double-cash-timer');
  const watchAdButton = document.getElementById('watch-ad-button');
  const loadingScreen = document.getElementById('loading-screen');

  // Upgrade definitions
  const upgradeList = [
    { id: 'autoClicker', name: 'Auto Clicker', baseCost: 100, costMult: 1.25, cps: 1, clickBonus: 0 },
    { id: 'banker', name: 'Banker', baseCost: 1000, costMult: 1.3, cps: 10, clickBonus: 0 },
    { id: 'premiumBanker', name: 'Premium Banker', baseCost: 10000, costMult: 1.35, cps: 100, clickBonus: 0 },
    { id: 'walletUpgrade', name: 'Wallet Upgrade', baseCost: 50, costMult: 1.2, cps: 0, clickBonus: 1 },
    { id: 'premiumWallet', name: 'Premium Wallet', baseCost: 500, costMult: 1.3, cps: 0, clickBonus: 5 },
    { id: 'creditCard', name: 'Credit Card', baseCost: 2500, costMult: 1.3, cps: 25, clickBonus: 0 },
    { id: 'investmentFund', name: 'Investment Fund', baseCost: 20000, costMult: 1.4, cps: 200, clickBonus: 0 },
  ];

  // Calculate cost for the upgrade based on owned count
  function getUpgradeCost(upgradeId) {
    const u = upgradeList.find(u => u.id === upgradeId);
    const count = upgrades[upgradeId] || 0;
    return Math.floor(u.baseCost * Math.pow(u.costMult, count));
  }

  // Create the upgrade buttons
  function createUpgradeButtons() {
    upgradeContainer.innerHTML = '';
    for (const u of upgradeList) {
      const btn = document.createElement('div');
      btn.className = 'upgrade-button';
      btn.id = 'upgrade-' + u.id;

      btn.innerHTML = `
        <div class="upgrade-name">${u.name}</div>
        <div class="upgrade-cost">Cost: $${getUpgradeCost(u.id).toLocaleString()}</div>
        <div class="upgrade-count">Owned: ${upgrades[u.id] || 0}</div>
      `;

      btn.addEventListener('click', () => {
        const cost = getUpgradeCost(u.id);
        if (cash >= cost) {
          cash -= cost;
          upgrades[u.id] = (upgrades[u.id] || 0) + 1;
          saveData();
          updateCashDisplay();
          updateUpgradeUI();
        }
      });

      upgradeContainer.appendChild(btn);
    }
  }

  // Update upgrade UI to reflect new costs and counts
  function updateUpgradeUI() {
    for (const u of upgradeList) {
      const btn = document.getElementById('upgrade-' + u.id);
      if (!btn) continue;
      const cost = getUpgradeCost(u.id);
      btn.querySelector('.upgrade-cost').textContent = `Cost: $${cost.toLocaleString()}`;
      btn.querySelector('.upgrade-count').textContent = `Owned: ${upgrades[u.id] || 0}`;
    }
  }

  // Get total CPS (cash per second) from all upgrades
  function getCPS() {
    let cps = 0;
    for (const u of upgradeList) {
      const count = upgrades[u.id] || 0;
      cps += (u.cps || 0) * count;
    }
    if (isDoubleCashActive()) cps *= 2;
    return cps;
  }

  // Get click value including upgrades
  function getClickValue() {
    let val = 1; // base 1 dollar per click
    for (const u of upgradeList) {
      const count = upgrades[u.id] || 0;
      val += (u.clickBonus || 0) * count;
    }
    if (isDoubleCashActive()) val *= 2;
    return val;
  }

  // Check if double cash bonus is active
  function isDoubleCashActive() {
    return doubleCashTimeLeft > Date.now();
  }

  // Update cash display
  function updateCashDisplay() {
    cashDisplay.textContent = `Cash: $${Math.floor(cash).toLocaleString()}`;
  }

  // Show floating cash popup
  function showCashPopup(amount, x, y) {
    const popup = document.createElement('div');
    popup.className = 'cash-popup';
    popup.textContent = `+$${amount.toLocaleString()}`;
    popup.style.left = `${x}px`;
    popup.style.top = `${y}px`;
    document.body.appendChild(popup);
    setTimeout(() => {
      popup.remove();
    }, 1000);
  }

  // Handle clicking on the cash image
  clickButton.addEventListener('click', (e) => {
    const val = getClickValue();
    cash += val;
    updateCashDisplay();
    saveData();

    // Show popup near cursor
    const rect = clickButton.getBoundingClientRect();
    showCashPopup(val, rect.left + rect.width / 2, rect.top - 30);
  });

  // CPS tick - adds cash every second based on upgrades
  setInterval(() => {
    const cps = getCPS();
    if (cps > 0) {
      cash += cps;
      updateCashDisplay();
      saveData();

      // Show smaller popup near cash display
      const rect = cashDisplay.getBoundingClientRect();
      showCashPopup(cps, rect.left + rect.width / 2, rect.top + 20);
    }
  }, 1000);

  // Update double cash timer UI and countdown
  function updateDoubleCashTimer() {
    if (isDoubleCashActive()) {
      const msLeft = doubleCashTimeLeft - Date.now();
      const min = Math.floor(msLeft / 60000);
      const sec = Math.floor((msLeft % 60000) / 1000);
      doubleCashTimer.textContent = `2x Cash Bonus: ${min}:${sec.toString().padStart(2, '0')}`;
      doubleCashTimer.style.display = 'block';
    } else {
      doubleCashTimer.style.display = 'none';
      doubleCashTimeLeft = 0;
      saveData();
    }
  }
  setInterval(updateDoubleCashTimer, 1000);

  // Watch Ad button logic (immediate reward, no real ad)
  watchAdButton.addEventListener('click', () => {
    // Activate double cash bonus immediately for 15 minutes
    doubleCashTimeLeft = Date.now() + doubleCashDuration;
    updateDoubleCashTimer();
    saveData();

    // Temporary feedback on button
    watchAdButton.textContent = 'AD ACTIVE! +2x CASH';
    watchAdButton.style.pointerEvents = 'none';

    setTimeout(() => {
      watchAdButton.textContent = 'WATCH AD';
      watchAdButton.style.pointerEvents = 'auto';
    }, 3000);
  });

  // Save game data to localStorage
  function saveData() {
    const data = {
      cash,
      upgrades,
      doubleCashTimeLeft
    };
    localStorage.setItem('cashClickerSave', JSON.stringify(data));
  }

  // Load game data from localStorage
  function loadData() {
    const saved = localStorage.getItem('cashClickerSave');
    if (saved) {
      try {
        const obj = JSON.parse(saved);
        if (typeof obj.cash === 'number') cash = obj.cash;
        if (typeof obj.upgrades === 'object') upgrades = obj.upgrades;
        if (typeof obj.doubleCashTimeLeft === 'number') doubleCashTimeLeft = obj.doubleCashTimeLeft;
      } catch {
        // corrupt data fallback
      }
    }
  }

  // Initialize game
  function init() {
    loadData();
    updateCashDisplay();
    createUpgradeButtons();
    updateUpgradeUI();
    updateDoubleCashTimer();

    // Hide loading screen with fade
    setTimeout(() => {
      loadingScreen.classList.add('hidden');
      setTimeout(() => {
        loadingScreen.style.display = 'none';
      }, 700);
    }, 800);
  }

  // Start initialization after DOM loaded
  window.addEventListener('load', init);
})();
</script>
