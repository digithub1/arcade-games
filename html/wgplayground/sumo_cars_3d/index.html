            <meta property="wgp:description" content="# SUMO CARS 3DGet behind the wheel and enter the ultimate car-sumo battle! ????️????Drive, boost, smash, and outmaneuver your opponents in a chaotic 3D arena where the only rule is simple: **stay on the platform and knock everyone else off.**Battle against aggressive AI drivers, use powerful boosts to launch opponents across the arena, survive massive collisions, and pull off insane last-second saves when you're hanging over the edge.### ???? FEATURES* ????️ Fast-paced 3D car battles* ???? Physics-based collisions and knockbacks* ???? Powerful boost system* ???? Multiple AI opponents with different behaviors* ????️ Colorful floating arenas* ???? Chaotic chain-reaction crashes* ???? Last car standing wins* ???? Simple keyboard controls* ⚡ Quick matches designed for replayability* ???? Fun stylized 3D graphics**WASD / Arrow Keys** — Drive**SPACE** — Boost**ESC** — Pause**RAM THEM. PUSH THEM. SURVIVE.**# Be the last car on the arena and become the SUMO CARS champion! ????">
            <meta property="wgp:instructions" content="# HOW TO PLAY### ???? CONTROLS**W / ↑** — Accelerate**S / ↓** — Reverse / Brake**A / ←** — Steer Left**D / →** — Steer Right**SPACE** — Activate Boost**ESC** — Pause Game### ????️ OBJECTIVEYour goal is simple:**Knock every opponent off the arena and be the last car standing.**### ???? HOW TO WIN1. Drive toward your opponents.2. Build up speed.3. Ram them from the side or behind.4. Use **BOOST** for powerful attacks.5. Avoid getting too close to the edge.6. Push every opponent off the platform.7. Survive until you're the only car left.### ???? WATCH THE EDGEFalling off the arena means **instant elimination**.Be careful when attacking near the edge—you can easily push yourself off too!### ???? BOOST TIPSSave your boost for important moments.Use it to:* Launch an opponent off the arena.* Escape a dangerous collision.* Recover from an attack.* Catch a fleeing opponent.### ???? WIN CONDITION**Last car standing = WINNER.**Good luck, driver.**SMASH HARD. STAY ON. BE THE LAST ONE.**">

<style id="wg-mobile-controls-v2" style="display: none !important;">
/* Mobile driving layout: raise the controls and consolidate them on the right. */
@media (max-width: 1023px), (pointer: coarse) {
  #touch-steer-left, #touch-steer-right, #touch-drive-btn, #touch-reverse-btn {
    display: none !important;
  }

  #wg-mobile-drive-cluster {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(88px, calc(env(safe-area-inset-bottom) + 72px));
    z-index: 99999;
    display: flex;
    align-items: flex-end;
    gap: 12px;
    pointer-events: auto;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #wg-joystick {
    width: 118px;
    height: 118px;
    border-radius: 50%;
    position: relative;
    background: rgba(15,23,42,.82);
    border: 3px solid rgba(96,165,250,.75);
    box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 0 7px rgba(30,41,59,.8);
    touch-action: none;
  }
  #wg-joystick::after {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px dashed rgba(148,163,184,.35);
    border-radius: 50%;
  }
  #wg-stick {
    width: 54px;
    height: 54px;
    position: absolute;
    left: 32px;
    top: 32px;
    border-radius: 50%;
    background: linear-gradient(145deg,#60a5fa,#2563eb);
    border: 3px solid rgba(191,219,254,.9);
    box-shadow: 0 6px 18px rgba(0,0,0,.5);
    z-index: 2;
    transform: translate3d(0,0,0);
  }
  #wg-throttle {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .wg-pedal {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    color: white;
    font: 900 25px/1 system-ui,sans-serif;
    border: 2px solid rgba(255,255,255,.28);
    box-shadow: 0 8px 22px rgba(0,0,0,.42);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wg-gas { background: rgba(16,185,129,.92); border-color: #6ee7b7; }
  #wg-brake { background: rgba(220,38,38,.90); border-color: #fca5a5; }
  .wg-pedal:active { transform: scale(.94); }
  #wg-mobile-label {
    position: absolute;
    right: 0;
    bottom: 100%;
    margin-bottom: 8px;
    color: rgba(226,232,240,.72);
    font: 800 10px/1 system-ui,sans-serif;
    letter-spacing: .12em;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
  }
}
@media (min-width: 1024px) and (pointer: fine) {
  #wg-mobile-drive-cluster { display:none !important; }
}
