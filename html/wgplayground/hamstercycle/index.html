	<script type="text/javascript">
		function resize() // ratio 2.2:1 to 1:2.2
		{
			var gameWidth = window.innerWidth;
			var gameHeight = window.innerHeight;
			var maxW = gameHeight * 2.2;
			var maxH = gameWidth * 2.2;
			var openfl = document.getElementById('openfl-content').style;
			openfl.maxWidth = gameWidth + "px";
			openfl.maxHeight = gameHeight + "px";
			openfl.width = (gameWidth > maxW) ? maxW + "px" : "100%";
			openfl.height = (gameHeight > maxH) ? maxH + "px" : "100%";
			openfl.margin = ((gameHeight > maxH) ? (gameHeight - maxH) * 0.5 : 0) + "px " + ((gameWidth > maxW) ? (gameWidth - maxW) * 0.5 : 0) + "px";
		}
		window.addEventListener("resize", resize);
		resize();

		let gp = null;

		function gameReady()
		{
			gp.ads.showSticky();
			gp.gameStart();
		}

		function levelStart()
		{
			gp.gameplayStart();
		}

		function levelComplete()
		{
			gp.gameplayStop();
		}

		function getPlayerData(onReady)
		{
			try {
    			onReady(JSON.parse(gp.player.get('progress')));
			} catch (err) {
				onReady({});
    		};
		}

		function setPlayerData(data)
		{
			gp.player.set('progress', JSON.stringify(data));
			gp.player.sync();
		}

		function showAd()
		{
			gp.ads.showFullscreen();
		}

		window.onGPInit = function(_gp)
		{
			gp = _gp;

			var params = {
				"language": gp.language == "ru" ? "ru" : "en",
				"mobile": gp.isMobile
			};
			lime.embed("hamster", "openfl-content", 0, 0, { parameters: params });

			gp.on("pause", () => { if (typeof pauseGame === "function") { pauseGame(); } });
			gp.on("resume", () => { if (typeof resumeGame === "function") { resumeGame(); } });

			gp.ads.showPreloader();
    	}
	</script>
