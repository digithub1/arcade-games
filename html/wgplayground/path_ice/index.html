            <meta property="wgp:description" content="Drinking warm sodas is not good, it is better to cool it down by adding some ice, for example. That is your task. Lead the way, so that the ice got into the glass and the drink cooled.But the path is not so easy to build, everywhere obstacles that block, destroy or simply melt the ice.The game combines several genres, draw a path and increase the amount, where you need to choose the right zone, which will increase the amount of ice. After all, at the beginning of the ice is very little, but at the end of the level it will be a whole mountain.The game has a lot of different levels.For each level you get collected ice, for it you can buy a new kind of glass or shape of ice. Draw the path as you want, only you decide how to pass the level.Multiplication mechanics, draw the path so that you get as much ice as possible.">
