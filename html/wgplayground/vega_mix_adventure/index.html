<script type="text/javascript">
	window.NetworkPlatformApi = NetworkPlatformApi;

	var pageOpenTime = Math.round(Date.now()/1000);

	window.isMobile = false;

	var container = document.querySelector("#gamefield");
	var loadscreen = document.querySelector("#loading-screen");
	var progressBarFull = document.querySelector("#loading-screen .progressbar .fill");
	var progressBarMaxWidth = 420;

	var c = document.createElement('canvas'),
		gl2 = c.getContext('webgl2'),
		gl = c.getContext('webgl'),
		astcCompression = (gl && gl.getExtension('WEBGL_compressed_texture_astc')) || (gl2 && gl2.getExtension('WEBGL_compressed_texture_astc'));

	document.addEventListener("visibilitychange", () => {
  		window.parent.click();
		window.parent.click();
	});

	function unityShowBanner(message){
		console.log(message);
	}

	function PostbackToDevToDev(){
		let D2D_POSTBACK_API_KEY = ""; // Adventure Yandex

		var theUrl = "https://api.devtodev.com/track/install/v1/custom/?apikey="+D2D_POSTBACK_API_KEY; // &field=value&field2=value
		theUrl += "&event_name=install";

		if("logged_user_id" in window.AppSettings.userParams) { theUrl += "&user_id=" + window.AppSettings.userParams["logged_user_id"]+"&os_id=" + window.AppSettings.userParams["logged_user_id"]; }

		var T = window.AppSettings.urlParams;

		if("utm_source" in T) {
			theUrl += "&publisher_name=" + T["utm_source"];
		}else{
			theUrl += "&publisher_name=organic";
		}

		if("utm_campaign" in T) {
			theUrl += "&s_placement_name=" + T["utm_campaign"];
		}else{
			if("refplace" in T) {
				theUrl += "&s_placement_name=" + T["refplace"];
			}
		}

		var keyPairs = [
			["utm_medium","s_ad"],
			["utm_content","campaign_id"],
			["utm_term","s_adgroup_name"],
			["utm_level","s_ad_name"],
			["utm_search_phrase","s_keyword_name"],
			];

		for(var idx in keyPairs){
			if(keyPairs[idx][0] in T) {
				theUrl += "&" + keyPairs[idx][1] + "=" + T[keyPairs[idx][0]];
			}
		}

		var xmlHttp = new XMLHttpRequest();
		xmlHttp.open( "GET", theUrl, true );
		xmlHttp.send( null );
	}

	var canvas = AppPage.createUnityCanvas();
	container.appendChild(canvas);

    window.onload = async (event) => {
      const cfg = await AppPage.loadConfigAsync(
      'https://vegamix2-pb-i1.broccoligames.ru/public/config.json'
      );

      var versionNum = cfg.version;
      var gameServerPath = cfg.gameServerPath;

      window.AppSettings = {
        GameServerPath: gameServerPath,
        WebPlatformType: "PB"
      };

      window.AppSettings.urlParams = AppPage.getUrlParams();
      window.AppSettings.userParams = {};

      var YandexInstalltimeKey = "Vegamix2_installtime";

      if ("version" in window.AppSettings.urlParams) {
        versionNum = window.AppSettings.urlParams["version"];
      }

      var buildType;
      var ext = {data: ".data.dgz", framework: ".framework.js.jgz", code: ".wasm.wgz"};

      if ("debug" in window.AppSettings.urlParams) {
        buildType = window.AppSettings.urlParams["debug"];
        ext = {data: ".data.gz", framework: ".framework.js.gz", code: ".wasm.gz"};
      } else {
        buildType = astcCompression ? "mobileRelease" : "desktopRelease";
        if ("release" in window.AppSettings.urlParams) {
          buildType = window.AppSettings.urlParams["release"];
        }
      }

      const resourcesPath = gameServerPath + "/public";

      const buildUrl = `${resourcesPath}/app/${versionNum}/build/${buildType}`;
      const dataUrl = buildUrl + `/${versionNum}${ext.data}`;
      const frameworkUrl = buildUrl + `/${versionNum}${ext.framework}`;
      const codeUrl = buildUrl + `/${versionNum}${ext.code}`;

      var streamingAssetsFolder = astcCompression ? "StreamingAssetsMobile" : "StreamingAssets";
      var streamingAssetsUrl = `${resourcesPath}/app/${versionNum}/${streamingAssetsFolder}`;

      window.AppSettings.ExtendedAssetsUrl = `${resourcesPath}/app/${versionNum}/extended_assets/${streamingAssetsFolder}`;  // ext

      var unityConfig = {
        dataUrl: dataUrl,
        frameworkUrl: frameworkUrl,
        codeUrl: codeUrl,
        streamingAssetsUrl: streamingAssetsUrl,
        companyName: "BroccoliGames",
        productName: "Adventure",
        productVersion: `0.${versionNum}`,
        showBanner: unityShowBanner,
      };


      // ----- [Launch] -----
      (async () => {
        const settings = await NetworkPlatformApi.getPlatformSettings();
        window.AppSettings.PlatformSettings = settings

        createUnityInstance(canvas, unityConfig, (progress) => {
          progressBarFull.style.width = Math.round(progressBarMaxWidth * progress) + "px";
        }).then((unityInstance) => {
          AppPage.unityInstance = unityInstance;
          loadscreen.classList.add("hidden");
        }).catch((message) => {
          unityShowBanner(message, "error");
        });

      })();
    };

</script>
