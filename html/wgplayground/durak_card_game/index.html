            <meta property="wgp:instructions" content="During the game, the entering player puts any of the cards he has on the table, and the fighting player must either beat it or take it. To beat a card, you need to put on it from the cards in your hand the highest card of the same suit, or a trump card, if the beaten card is not a trump card. If the beaten card is a trump card, then it can only be beaten with the highest trump card.If a participant hits the cards, the next move belongs to him. If he fails, he skips his turn, takes all the cards that his opponent threw out to him that turn, and the opponent continues the next turn.The player who made the move is the first to replenish the supplies from the deck, and then the one who fought back.The first player to run out of cards when the deck runs out wins. The participant with cards in his hands loses. If during the last “attack” one player got rid of his cards, and the second successfully covered them, then a draw is declared.">
