            <meta property="wgp:description" content="The game exists in many variations under different names: &quot;Czech fool&quot;, &quot;English fool&quot;, &quot;Pharaoh&quot;, &quot;Pentagon&quot;, differing in minor details. Such famous games as &quot;Crazy eights&quot;, Uno, &quot;What?&quot;, &quot;Svintus&quot;, Taki originated from this game.You can play the game with artificial intelligence or with an opponent online in multiplayer mode.The goal of the game is to discard your cards faster than your opponent. The player who discards his cards first will be considered the winner of the round. The game is played with a deck of 36 cards. In the settings of the game with the computer, you can also choose decks of 24, 32, 52 cards.Players are dealt four cards. The remaining cards are placed in the center of the table. In the first round, the player who will go first is determined randomly. In the next round, the winner starts the turn.">
            <meta property="wgp:instructions" content="The strategy of the game is to beat the previous player's card. Players take turns making moves. Participants put a card of the same suit or similar in value (dignity) on top. For example, if they put down the eight of spades, the next player has the right to discard one of the cards of the suit of spades or an eight of any suit.If a player does not have a card that meets the conditions, he draws a card from the common pile/deck. With this card, he can beat the card of the previous player, if it fits. Then the turn passes to the opponent.Special cards.6 - the opponent takes one card from the common deck instead of his turn.7 - the opponent takes two cards from the common deck instead of his turn.9 - the player who put it down must cover it with another card.Ace - the opponent skips a turn.King of spades - the opponent must take four cards from the deck and skip a turn.The queen can be placed on any card and any suit can be ordered.">
