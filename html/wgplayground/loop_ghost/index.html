            <meta property="wgp:description" content="Your past is your greatest ally.A mistake isn't failure — it's a setup for your next move.Every time a cycle ends, your actions are recorded — and a ghost of your past self stays on the level, replaying every step. Every cycle. Until you escape.Press two buttons at once?Block a laser with a mirror while walking through a door?Plan it several cycles ahead.What awaits you:- 70+ levels with increasing difficulty — from simple one-cycle puzzles to complex multi-cycle combinations- Two difficulty modes (timed cycles and unlimited time)- Level editor — create your own puzzles- Buttons, doors, portals, conveyors, lasers, mirrors — each mechanic changes the rules- Hunt for the perfect solution in the fewest cyclesThink in cycles. Act precisely. Escape.">
            <meta property="wgp:instructions" content="Goal: Reach the exit tile on each level.Time Loops:When a cycle ends, a ghost clone appears that replays your exact moves from that cycle. Use your clones to cooperate with yourself: one clone holds a button while you walk through the door it opens.Game Objects:- Buttons &amp; Doors — step on a button to open a linked door. The door stays open only while the button is held.- Push Blocks — push blocks onto buttons to hold them. Blocks stay in place between cycles.- Lasers — red beams that reset your current cycle on contact. Use blocks or mirrors for cover.- Mirrors &amp; Levers — mirrors reflect lasers. Step on a lever to rotate its linked mirror.- Portals — paired tiles that teleport you (and lasers!) to the other side.- Conveyors — moving tiles that push you in a set direction.- Enemies — moving hazards that patrol the level. Push blocks into them to redirect their path.Star Rating:Each level awards 1-3 stars based on how few cycles you use. Collect stars to unlock new level packs.">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #050508;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -webkit-text-size-adjust: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; -webkit-user-drag: none; }

    /* ── Editor UI (positioned over canvas via JS) ── */
    #editor-ui {
      display: none;
      position: fixed;
      pointer-events: none;
      font-family: monospace;
      color: #ccc;
      z-index: 10;
      --ed-topbar-h: 7%;
      --ed-statusbar-h: 4.5%;
      --ed-sidebar-w: 18%;
      --ed-sidebar-h: calc(100% - var(--ed-topbar-h) - var(--ed-statusbar-h));
    }
    #editor-ui > * { pointer-events: auto; }

    /* Top bar — 7% of canvas height */
    #editor-topbar {
      position: absolute; top: 0; left: 0; right: 0;
      height: var(--ed-topbar-h);
      background: color-mix(in srgb, var(--ed-bg, #050508) 95%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--ed-wall, #252540) 60%, transparent);
      display: flex; align-items: center; gap: 6px;
      padding: 0 8px;
      overflow: hidden;
    }
    #editor-topbar label { color: var(--ed-text-body, #888); font-size: 12px; white-space: nowrap; }
    #editor-topbar input, #editor-topbar select {
      background: color-mix(in srgb, var(--ed-wall, #1a1a2e) 50%, transparent);
      border: 1px solid color-mix(in srgb, var(--ed-wall, #252540) 60%, transparent);
      color: var(--ed-text-body, #ccc);
      padding: 3px 5px; font-family: monospace; font-size: 12px;
      width: 48px; border-radius: 3px;
    }
    #editor-topbar input.name-input { width: 100px; }
    #editor-topbar button {
      background: color-mix(in srgb, var(--ed-wall, #1a1a2e) 50%, transparent);
      border: 1px solid color-mix(in srgb, var(--ed-wall, #252540) 60%, transparent);
      color: var(--ed-exit, #ffd740);
      padding: 5px 10px; cursor: pointer; font-family: monospace; font-size: 12px;
      border-radius: 3px; white-space: nowrap;
      touch-action: manipulation; -ms-touch-action: manipulation;
      -webkit-touch-callout: none; user-select: none;
    }
    #editor-topbar button:hover { background: var(--ed-wall, #252540); color: var(--ed-text-button, #fff); }
    #editor-topbar button .btn-icon { margin-right: 2px; font-size: 10px; }
    #editor-topbar .back-btn {
      background: none; border: none; color: var(--ed-text-body, #8888aa); font-size: 13px;
      cursor: pointer; padding: 4px 8px; font-family: monospace;
    }
    #editor-topbar .back-btn:hover { color: var(--ed-text-button, #ccc); }
    #editor-topbar .topbar-sep {
      width: 1px; height: 60%; background: color-mix(in srgb, var(--ed-wall, #252540) 60%, transparent); margin: 0 4px;
    }

    /* Sidebar — 18% of canvas width, between topbar and statusbar */
    #editor-sidebar {
      position: absolute; top: var(--ed-topbar-h); left: 0;
      width: var(--ed-sidebar-w);
      bottom: var(--ed-statusbar-h);
      background: color-mix(in srgb, var(--ed-bg, #050508) 95%, transparent);
      border-right: 1px solid color-mix(in srgb, var(--ed-wall, #252540) 60%, transparent);
      padding: 6px;
      overflow-y: auto;
    }
    #editor-sidebar .tool-btn {
      display: block; width: 100%; text-align: left;
      background: none; border: 1px solid transparent; color: var(--ed-text-body, #aaa);
      padding: 8px 10px; cursor: pointer; font-family: monospace; font-size: 14px;
