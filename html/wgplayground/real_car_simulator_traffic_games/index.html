  <body class="dark wgNoLoader">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" style="background: url(&quot;Build/GmG_Rea_Car_Simulator_Traffic_Gamesl.jpg&quot;) center center / cover;"></canvas>
    </div>
    <div id="loading-cover" style="">
      <div id="unity-loading-bar">
        
	
        <div id="unity-logo">	
          <img src="logo.png">	
          <br>	
        </div>


        <div id="unity-progress-bar-empty" style="">
          <div id="unity-progress-bar-full" style="width: 0%;"></div>
        </div>
        <div class="spinner" style="display: none;"></div>
      </div>
    </div>
    <div id="unity-fullscreen-button" style="display: none;"></div>
    <script>
      const hideFullScreenButton = "";
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/GmG_Rea_Car_Simulator_Traffic_Gamesl.loader.js";
      const config = {
        dataUrl: buildUrl + "/GmG_Rea_Car_Simulator_Traffic_Gamesl.data",
        frameworkUrl: buildUrl + "/GmG_Rea_Car_Simulator_Traffic_Gamesl.framework.js",
        codeUrl: buildUrl + "/GmG_Rea_Car_Simulator_Traffic_Gamesl.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GmG",
        productName: "Rea Car Simulator Traffic Gamesl",
        productVersion: "1.7",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());


      canvas.style.background = "url('" + buildUrl + "/GmG_Rea_Car_Simulator_Traffic_Gamesl.jpg') center / cover";
      loadingCover.style.display = "";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          loadingCover.style.display = "none";
          if (canFullscreen) {
            if (!hideFullScreenButton) {
              fullscreenButton.style.display = "";
            }
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          console.log(message);
        });
      };
      document.body.appendChild(script);



      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1.5;
      }


    </script><script src="Build/GmG_Rea_Car_Simulator_Traffic_Gamesl.loader.js"></script>
