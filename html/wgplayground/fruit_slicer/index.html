            <meta property="wgp:description" content="Get ready to unleash your slicing skills in the ultimate fruity frenzy! Fruit Slice Frenzy is a captivating and addictive slicing game that will test your reflexes, precision, and strategic thinking. With its vibrant visuals, satisfying slicing mechanics, and multiple game modes, it's a juicy adventure you won't want to miss! Fruit Slice is a Fantastic Addicted game where players swipe their fingers across the screen to slice fruit that is thrown into the air. The goal of the game is to slice as much fruit as possible without slicing any bombs. If a bomb is sliced, the game is over.">
            <meta property="wgp:instructions" content="How to Play?Step into the world of Fruit Slice Frenzy, where a variety of delicious fruits are airborne, waiting for your expert slicing touch. Swipe your finger across the screen to slice through fruits with precision and watch as they burst into a splash of juicy goodness. The more accurate your slice, the more points you earn. But be cautious – mixed among the fruits are dangerous bombs that you must avoid at all costs. Slice a bomb, and you'll lose valuable points.There are three game modes in Fruit Slice: Arcade, Classic and Relax.Arcade:Arcade mode is more challenging than Classic mode. Players have only three lives and the goal is to achieve the highest score possible. Bombs appear more frequently in Arcade mode and the score is calculated differently than in Classic mode.Classic:Classic mode is the simplest mode. Players have unlimited lives and the goal is to slice as much fruit as possible in 60 seconds. The score is calculated based on the number of fruits sliced, the combos achieved, and the bonus fruits collected.Relax:Relax mode is a more zen-like experience. Players have unlimited lives and the goal is to simply slice fruit and relax. There are no bombs in Relax mode and the score is not tracked.">

      <canvas id="unity-canvas" style="width: 100vw; height: 100vh;" wg-game-orientation="wg-landscape-game"></canvas>
      <div id="unity-loading-bar" style="display: block;">

      <div id="unity-warning"> </div>

      </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/FruitSlicer.loader.js";
      var config = {
        dataUrl: buildUrl + "/FruitSlicer.data.unityweb",
        frameworkUrl: buildUrl + "/FruitSlicer.framework.js.unityweb",
        codeUrl: buildUrl + "/FruitSlicer.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Argon",
        productName: "Fruit Slicer",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';

        
      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "100vw";
        canvas.style.height = "100vh";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          console.log(message);
        });
      };
      document.body.appendChild(script);
    </script><script src="Build/FruitSlicer.loader.js"></script>
