    <script>
      // Sticky-banner reserve — platformBridge calls this with the GamePush sticky
      // height on render/refresh and 0 on close. We set body padding-bottom (border-box,
      // see CSS) so the #game box shrinks and Phaser Scale.FIT refits the canvas ABOVE
      // the banner. px=0 → padding 0 → layout identical to no-banner.
      window.cmStickyReserve = function (px) {
        var h = Number(px);
        if (!isFinite(h) || h < 0) h = 0;
        document.body.style.paddingBottom = h + "px";
      };

      // Splash bridge — PreloadScene drives progress/ready; PLAY is the first user
      // gesture that unlocks WebAudio (onStart) and reveals the page background.
      window.CoinMergeSplash = {
        onStart: null,
        _lang: "en",
        _t: { en: { loading: "LOADING...", play: "PLAY" }, ru: { loading: "ЗАГРУЗКА...", play: "ИГРАТЬ" } },
        _apply() {
          const t = this._t[this._lang];
          const s = document.getElementById("cm-status");
          if (s) s.textContent = t.loading;
          const b = document.getElementById("cm-play");
          if (b) b.textContent = t.play;
        },
        setLanguage(lang) {
          this._lang = lang && String(lang).toLowerCase().startsWith("ru") ? "ru" : "en";
          document.documentElement.lang = this._lang;
          this._apply();
        },
        setProgress(pct) {
          const bar = document.getElementById("cm-bar");
          if (bar) bar.style.width = Math.max(0, Math.min(100, pct)) + "%";
        },
        ready() {
          document.getElementById("cm-interaction")?.classList.add("ready");
        },
        start() {
          document.body.classList.add("game-visible");
          if (this.onStart) this.onStart();
          const sp = document.getElementById("splash");
          if (sp) {
            sp.style.opacity = "0";
            setTimeout(() => (sp.style.display = "none"), 800);
          }
        },
      };
      document.getElementById("cm-play").addEventListener("click", () => window.CoinMergeSplash.start());
      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
