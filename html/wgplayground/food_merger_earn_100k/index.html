  <style>
    /* Убираем выделение по нажатию клавиш */
    canvas:focus { outline: none; }

    html, body {
      padding: 0;
      margin: 0;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;

    /* Контейнер Unity: позиционирование через JS */
    #unity-container {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      background: transparent;
    }
    #unity-canvas {
      /* Размеры задаются из JS */
      display: block; /* убрать встроенные отступы */

    /* Стили loading screen */
    #loading-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      justify-content: center;

      background-color: rgba(0, 0, 0, 0.75);

    }
    #unity-loading-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #unity-logo img {
      max-width: 200px;
      margin-bottom: 16px;
    }
    #unity-progress-bar-empty {
      width: 300px;
      height: 20px;
      border: 2px solid #ffffff;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      background-color: #333333;
      display: none;
    }
    #unity-progress-bar-full {
      width: 0;
      height: 100%;
      background-color: #00ff00;
      transition: width 0.2s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #ffffff;
      border-radius: 50%;

    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

  <script>
    // Параметры Unity WebGL
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/testGame.loader.js";
    const config = {
      dataUrl: buildUrl + "/testGame.data",
      frameworkUrl: buildUrl + "/testGame.framework.js",
      codeUrl: buildUrl + "/testGame.wasm",
      // #if MEMORY_FILENAME
      // memoryUrl: buildUrl + "/",
      // #endif
      // #if SYMBOLS_FILENAME
      // symbolsUrl: buildUrl + "/",
      // #endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "VorMaks",
      productName: "FoodMergerGamePush",
      productVersion: "1.0",
    };

    // Элементы DOM
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    // Настройки внешнего вида canvas/loading
    if (overlayBackgroundColor && overlayBackgroundColor.trim() !== "") {
      canvas.style.background = overlayBackgroundColor;
    }
    if (backgroundFileName && backgroundFileName.trim() !== "") {
      canvas.style.background = "url('" + backgroundFileName + "') center / cover";
    }
    if (progressBarFillColor && progressBarFillColor.trim() !== "") {
      progressBarFull.style.background = progressBarFillColor;
    }
    if (progressBarBackgroundColor && progressBarBackgroundColor.trim() !== "") {
      progressBarEmpty.style.background = progressBarBackgroundColor;
    }
    if (progressBarBorderColor && progressBarBorderColor.trim() !== "") {
      progressBarEmpty.style.borderColor = progressBarBorderColor;
    }

    // Отключаем правый клик и обеспечиваем фокус
    document.addEventListener('contextmenu', e => e.preventDefault());
    function FocusGame() {
      window.focus();
      canvas.focus();
    }
    window.addEventListener('pointerdown', FocusGame);
    window.addEventListener('touchstart', FocusGame);

    // Функция, которая рассчитывает размеры и центрирует canvas в соотношении 16:9
    function resizeGame() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const targetRatio = 16 / 9;

      // Сначала подгоняем по ширине
      let newWidth = w;
      let newHeight = newWidth / targetRatio;

      // Если по ширине высота выходит за пределы окна, подгоняем по высоте
      if (newHeight > h) {
        newHeight = h;
        newWidth = newHeight * targetRatio;
      }

      // Устанавливаем размеры контейнера и canvas
      container.style.width  = `${newWidth}px`;
      container.style.height = `${newHeight}px`;
      canvas.style.width     = `${newWidth}px`;
      canvas.style.height    = `${newHeight}px`;

      // Центрируем контейнер
      container.style.left = `${(w - newWidth) / 2}px`;
      container.style.top  = `${(h - newHeight) / 2}px`;
    }

    // Подписываемся на изменение размера окна
    window.addEventListener('resize', resizeGame);
    // Вызываем один раз при загрузке
    resizeGame();

    // Инициализация Unity
    function initUnity() {
      loadingCover.style.display = "flex";
      const unityLoader = document.createElement("script");
      unityLoader.src = loaderUrl;
      unityLoader.onerror = () => console.error("Failed to load resource: " + loaderUrl);
      unityLoader.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadingCover.style.display = "none";
        }).catch((message) => {
          console.error(message);
          console.log(message);
        });
      };
      document.body.appendChild(unityLoader);
    }

    initUnity();
  </script><script src="Build/testGame.loader.js"></script>
