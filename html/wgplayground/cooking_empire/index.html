  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/d3c44f28e018141c40383d66bff5836b.loader.js";
    const config = {
      dataUrl: buildUrl + "/2df7d2067e2427b94535c4f6da836165.data.unityweb",
      workerUrl: buildUrl + "/2df7d2067e2427b94535c4f6da836165.data.unityweb",
      frameworkUrl: buildUrl + "/d49581e79f8a8538250acf22e3fb52f4.framework.js.unityweb",
      codeUrl: buildUrl + "/67740c7e212fdade950a50332b24fc2c.wasm.unityweb",
      // #if MEMORY_FILENAME
      //   memoryUrl: buildUrl + "/",
      // #endif
      // #if SYMBOLS_FILENAME
      //   symbolsUrl: buildUrl + "/",
      // #endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Boar Band",
      productName: "Cooking Empire",
      productVersion: "1.1",
    };

    const container = document.querySelector("#unity-container");
    const gameFrame = document.querySelector("#unity-game-frame");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');
    let lastProgress = 0;

    function hideLoadingCoverSafe() {
      if (loadingCover) {
        loadingCover.style.display = "none";
      }
    }

    function isKnownIframeNoise(message) {
      if (!message) return false;
      const msg = String(message).toLowerCase();
      return (
        msg.includes("blocked a frame with origin") ||
        msg.includes("cross-origin frame") ||
        msg.includes("failed to read a named property 'setattribute'") ||
        msg.includes("failed to read the 'localstorage' property from 'window'")
      );
    }
    
    function applyViewportSize() {
      const vv = window.visualViewport;
      const w = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
      const h = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
      container.style.width = `${w}px`;
      container.style.height = `${h}px`;
      /* Игра строго в 16:9; размер канваса = пиксели рамки (важно для WebGL/Unity) */
      const syncCanvasToFrame = () => {
        const r = gameFrame.getBoundingClientRect();
        const cw = Math.max(1, Math.round(r.width));
        const ch = Math.max(1, Math.round(r.height));
        canvas.style.width = `${cw}px`;
        canvas.style.height = `${ch}px`;
      };
      syncCanvasToFrame();
      requestAnimationFrame(syncCanvasToFrame);
    }

    applyViewportSize();
    window.addEventListener("resize", applyViewportSize);
    window.addEventListener("orientationchange", applyViewportSize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", applyViewportSize);
      window.visualViewport.addEventListener("scroll", applyViewportSize);
    }

    /* Не заливаем канвас сплошным чёрным: фон страницы виден при загрузке; картинка — из шаблона */
    if (overlayBackgroundColor !== " " && overlayBackgroundColor !== ""){
      canvas.style.background = overlayBackgroundColor;
    } else {
      canvas.style.background = "transparent";
    }

    if (progressBarFillColor !== " " && progressBarFillColor !== ""){
      progressBarFull.style.background = progressBarFillColor;
    }

    if (progressBarBackgroundColor !== " " && progressBarBackgroundColor !== ""){
      progressBarEmpty.style.background = progressBarBackgroundColor;
    }

    if (progressBarBorderColor !== " " && progressBarBorderColor !== ""){
      progressBarEmpty.style.borderColor = progressBarBorderColor;
    }

    if (backgroundFileName !== " " && backgroundFileName !== ""){
      canvas.style.background = "url('" + backgroundFileName + "') center / cover no-repeat";
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    // #if BACKGROUND_FILENAME
    // canvas.style.background = "url('" + buildUrl + "/05bef62a1d264d2010a2e5b3e60526ce.jpg') center / cover";
    // #endif

    loadingCover.style.display = "";
    // WG Playground/iframe safety: если прогресс дошел до 100%, но промис инициализации "залип",
    // не блокируем игру вечным оверлеем.
    window.setTimeout(() => {
      if (lastProgress >= 0.999) {
        hideLoadingCoverSafe();
      }
    }, 45000);

        // Выключаем появление меню при правом клике мыши
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Возвращаем фокус, если кликнули по экрану
        function FocusGame() {
            window.focus();
            canvas.focus();
        }

        window.addEventListener('pointerdown', () => {
            FocusGame();
        });
        window.addEventListener('touchstart', () => {
            FocusGame();
        });

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onerror = () => {
      console.error("[WebGL] Failed to load Unity loader script:", loaderUrl);
      hideLoadingCoverSafe();
    };
    unityLoader.onload = async () => {
      createUnityInstance(canvas, config, (progress) => {
        lastProgress = Math.max(lastProgress, progress || 0);
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        hideLoadingCoverSafe();
        applyViewportSize();
        setTimeout(applyViewportSize, 0);
        setTimeout(applyViewportSize, 250);
        setTimeout(applyViewportSize, 1000);
        /* VK/OK iframe: после загрузки пересчитать размер под контейнер */
        try {
          if (unityInstance && unityInstance.Module && typeof unityInstance.Module.SetFullscreen === "function") {
            window.dispatchEvent(new Event("resize"));
          }
        } catch (e) {}
      }).catch((message) => {
        console.error("[WebGL] createUnityInstance failed:", message);
        hideLoadingCoverSafe();
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

    // GamePush payment: when user cancels/denies payment, SDK rejects a Promise.
    // Unity build (or hosting page) may treat it as an unhandled rejection and show a modal.
    // We suppress only this specific rejection type.
    window.addEventListener(
      "unhandledrejection",
      (e) => {
        try {
          const reason = e && e.reason;
          const msg =
            typeof reason === "string"
              ? reason
              : (reason && typeof reason.message === "string" ? reason.message : "");
          if (msg && (msg.toLowerCase().includes("payment_rejected") || isKnownIframeNoise(msg))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        } catch (err) {
          // Do not break the page on unexpected shapes.
        }
      },
      true
    );

    // Some host dashboards inject scripts that probe parent/iframe windows and throw cross-origin errors.
    // Suppress only known harmless noise to avoid false moderation rejects.
    window.addEventListener(
      "error",
      (e) => {
        try {
          const msg = (e && e.message) || "";
          if (isKnownIframeNoise(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        } catch (err) {}
      },
      true
    );
