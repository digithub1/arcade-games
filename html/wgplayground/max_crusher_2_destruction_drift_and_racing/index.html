  <script>
    const overlayBackgroundColor = "rgb(222,184,135,1)";
    const progressBarFillColor = "rgb(100%,55%,0%,1)";
    const progressBarBackgroundColor = "rgb(82%,71%,55%,1)";
    const progressBarBorderColor = "rgb(63%,32%,18%,1)";
    const backgroundFileName = "background.jpg";
  </script>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" style="background: url(&quot;background.jpg&quot;) center center / cover; aspect-ratio: 0.896057 / 1;" wg-game-orientation="wg-portrait-game"></canvas>
  </div>
  <div id="loading-cover" style="">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="logo.png"></div>
      <div id="unity-progress-bar-empty" style="background: rgb(209, 181, 140);">
        <div id="unity-progress-bar-full" style="background: rgb(255, 140, 0); width: 0%;"></div>
      </div>
      <div class="spinner" style="display: none;"></div>
    </div>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Max_Crasher_2_GP.loader.js";
    const config = {
      dataUrl: buildUrl + "/Max_Crasher_2_GP.data.unityweb",
      workerUrl: buildUrl + "/Max_Crasher_2_GP.data.unityweb",
      frameworkUrl: buildUrl + "/Max_Crasher_2_GP.framework.js.unityweb",
      codeUrl: buildUrl + "/Max_Crasher_2_GP.wasm.unityweb",
      // #if MEMORY_FILENAME
      //   memoryUrl: buildUrl + "/",
      // #endif
      // #if SYMBOLS_FILENAME
      //   symbolsUrl: buildUrl + "/",
      // #endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "AlekseyGame",
      productName: "Max Crusher 2 - Краш-тесты, Дрифт и Гонки авто!",
      productVersion: "4.3.3.4",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (overlayBackgroundColor !== " " && overlayBackgroundColor !== ""){
      canvas.style.background = overlayBackgroundColor;
    }

    if (progressBarFillColor !== " " && progressBarFillColor !== ""){
      progressBarFull.style.background = progressBarFillColor;
    }

    if (progressBarBackgroundColor !== " " && progressBarBackgroundColor !== ""){
      progressBarEmpty.style.background = progressBarBackgroundColor;
    }

    if (progressBarBorderColor !== " " && progressBarBorderColor !== ""){
      progressBarEmpty.style.border.color = progressBarBorderColor;
    }

    if (backgroundFileName !== " " && backgroundFileName !== ""){
      canvas.style.background = "url('" + backgroundFileName + "') center / cover";
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    // #if BACKGROUND_FILENAME
    // canvas.style.background = "url('" + buildUrl + "/') center / cover";
    // #endif

    loadingCover.style.display = "";

        // Выключаем появление меню при правом клике мыши
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Возвращаем фокус, если кликнули по экрану
        function FocusGame() {
            window.focus();
            canvas.focus();
        }

        window.addEventListener('pointerdown', () => {
            FocusGame();
        });
        window.addEventListener('touchstart', () => {
            FocusGame();
        });

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = async () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        console.log(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script><script src="Build/Max_Crasher_2_GP.loader.js"></script>
