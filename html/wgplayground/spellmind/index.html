<body class="dark wgNoLoader"><img class="splash-bg fadein" src="https://static.wgplayground.com/d3b887bcf8de96191eb1f3efec6aa2e6/wgplayground/429d8cbbec5b0903e111f4c75ba3bc21.jpg">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" wg-game-orientation="wg-landscape-game"></canvas>
  </div>
  <div id="loading-cover" style="">
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty" style="">
        <div id="unity-progress-bar-full" style="width: 0%;"></div>
      </div>
      <div class="spinner" style="display: none;"></div>
    </div>
  </div>

  <script>
    dataFile = "/WebGL_dxt.data.gz";  
	compression = "dxt";
	var c = document.createElement("canvas");                                
	var gl = c.getContext("webgl");                                      
	var gl2 = c.getContext("webgl2");
	if ((gl && gl.getExtension('WEBGL_compressed_texture_astc')) ||
		(gl2 && gl2.getExtension('WEBGL_compressed_texture_astc')))
	{   
		compression = "astc"; 
		dataFile = "/WebGL_astc.data.gz"; 			
	}
	else if ((gl && gl.getExtension('WEBGL_compressed_texture_etc')) ||
		(gl2 && gl2.getExtension('WEBGL_compressed_texture_etc')))
	{   
		compression = "etc2";      
		dataFile = "/WebGL_etc2.data.gz"; 		                             
	}
  
	const hideFullScreenButton = "";
	const buildUrl = "Build";
	const loaderUrl = buildUrl + "/WebGL.loader.js";
	const config = {
		dataUrl: buildUrl + dataFile,
		frameworkUrl: buildUrl + "/WebGL.framework.js.gz",
		codeUrl: buildUrl + "/WebGL.wasm.gz",
	streamingAssetsUrl: "StreamingAssets" + "_" + compression,
		companyName: "Dekovir",
		productName: "Spellmind",
		productVersion: "2.8.0",
		autoSyncPersistentDataPath: true
	};

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    loadingCover.style.display = "";

	document.addEventListener('contextmenu', event => event.preventDefault());

	function FocusGame() {
		window.focus();
		canvas.focus();
	}

	window.addEventListener('pointerdown', () => {
		FocusGame();
	});
	window.addEventListener('touchstart', () => {
		FocusGame();
	});

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = async () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
		
		window.addEventListener('resize',  () => {
		  try {
			resizeCanvas();
		  }
		  catch(e) {
			console.log(e);
		  }
		});
		
		function resizeCanvas() {
			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))
				return;
				
			var baseWidth = window.innerWidth;
			var baseHeight = window.innerHeight;
            
            if (baseWidth <= 1 || baseHeight <= 1)
              return;
			
			var aspect = baseWidth / baseHeight;
			
			const maxAspect = 2.5;
			const minAspect = 1.3;
			if (aspect > maxAspect) {
				aspect = maxAspect;
				baseWidth = baseHeight * aspect;
			}
			else if (aspect < minAspect) {
				aspect = minAspect;
				baseHeight = baseWidth / aspect;
			}					
			
			var widthLimitedScale = Math.floor( window.innerWidth ) / baseWidth;
			var heightLimitedScale = Math.floor( window.innerHeight - 4.0 ) / baseHeight;
			
			var scale = widthLimitedScale;
			if (heightLimitedScale < scale)
				scale = heightLimitedScale;
			
			canvas.style.width = Math.floor(baseWidth * scale) + 'px';
			canvas.style.height = Math.floor(baseHeight * scale) + 'px';
			canvas.style.margin = "auto";
		}
		
		resizeCanvas();
					
      }).catch((message) => {
        console.log(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script><script src="Build/WebGL.loader.js"></script>
