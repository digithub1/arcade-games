                        fetch(url, { method: 'HEAD' })
                            .then(function(res) {
                                if (res.status === 403) {
                                    reloadWithCacheBust(url);
                                }
                            })
                            .catch(function() {
                                fetch(url)
                                    .then(function(res) {
                                        if (res.status === 403) {
                                            reloadWithCacheBust(url);
                                        }
                                    });
                            });

            function reloadWithCacheBust(failedUrl) {
                try {
                    if (typeof ym === 'function') {
                        ym(93916599, 'reachGoal', 'main_bundle_loading_failed', { url: failedUrl });
                    }
                    var img = new Image();
                    img.src = 'https://mc.yandex.ru/watch/93916599?goal=main_bundle_loading_failed&page-url=' + 
                        encodeURIComponent(window.location.href) + '&browser-info=failedUrl:' + encodeURIComponent(failedUrl);
                } catch (err) {}

                var urlParams = new URLSearchParams(window.location.search);
                if (!urlParams.has('cb')) {
                    urlParams.set('cb', Date.now().toString());
                    var newUrl = window.location.origin + window.location.pathname + '?' + urlParams.toString() + window.location.hash;
                    setTimeout(function() {
                        window.location.replace(newUrl);
                    }, 300);
                }
            }
        })();
