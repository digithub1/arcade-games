ty&nbsp;to&nbsp;run,&nbsp;but&nbsp;it&nbsp;is&nbsp;limited&nbsp;by&nbsp;the&nbsp;fatigue&nbsp;bar.&nbsp;The&nbsp;more&nbsp;you&nbsp;run,&nbsp;the&nbsp;faster&nbsp;it&nbsp;disappears.&nbsp;Rest&nbsp;will&nbsp;allow&nbsp;you&nbsp;to&nbsp;recover.Inventory:&nbsp;The&nbsp;player&nbsp;has&nbsp;two&nbsp;inventory&nbsp;slots&nbsp;to&nbsp;store&nbsp;a&nbsp;torch&nbsp;and&nbsp;a&nbsp;burger&nbsp;radar.&nbsp;You&nbsp;can&nbsp;quickly&nbsp;switch&nbsp;between&nbsp;these&nbsp;items&nbsp;during&nbsp;the&nbsp;game.Burger&nbsp;Hunter&nbsp;is&nbsp;a&nbsp;game&nbsp;full&nbsp;of&nbsp;exciting&nbsp;adventures,&nbsp;stunts&nbsp;and&nbsp;challenges.&nbsp;You&nbsp;have&nbsp;every&nbsp;chance&nbsp;of&nbsp;becoming&nbsp;the&nbsp;best&nbsp;burger&nbsp;hunter&nbsp;if&nbsp;you&nbsp;use&nbsp;your&nbsp;tools&nbsp;well,&nbsp;explore&nbsp;the&nbsp;maze&nbsp;carefully,&nbsp;and&nbsp;come&nbsp;up&nbsp;with&nbsp;strategies&nbsp;to&nbsp;bypass&nbsp;Mr.&nbsp;noob.Graphics&nbsp;and&nbsp;soundThe&nbsp;graphics&nbsp;of&nbsp;the&nbsp;game&nbsp;are&nbsp;made&nbsp;in&nbsp;a&nbsp;bright&nbsp;and&nbsp;eye-pleasing&nbsp;style,&nbsp;the&nbsp;animation&nbsp;of&nbsp;the&nbsp;characters&nbsp;looks&nbsp;lively&nbsp;and&nbsp;dynamic.&nbsp;Lighting&nbsp;effects&nbsp;deserve&nbsp;special&nbsp;attention,&nbsp;which&nbsp;make&nbsp;the&nbsp;labyrinth&nbsp;even&nbsp;more&nbsp;mysterious&nbsp;and&nbsp;tense.&nbsp;The&nbsp;soundtrack&nbsp;and&nbsp;sound&nbsp;effects&nbsp;enhance&nbsp;the&nbsp;atmosphere&nbsp;of&nbsp;the&nbsp;game,&nbsp;adding&nbsp;elements&nbsp;of&nbsp;mysticism&nbsp;and&nbsp;adventure&nbsp;to&nbsp;it.Conclusion&quot;Burger&nbsp;Hunter&quot;&nbsp;is&nbsp;an&nbsp;exciting&nbsp;journey&nbsp;where&nbsp;every&nbsp;move&nbsp;can&nbsp;lead&nbsp;to&nbsp;success&nbsp;or&nbsp;failure.&nbsp;Learn&nbsp;to&nbsp;use&nbsp;all&nbsp;your&nbsp;resources,&nbsp;make&nbsp;quick&nbsp;decisions&nbsp;and&nbsp;always&nbsp;be&nbsp;one&nbsp;step&nbsp;ahead&nbsp;of&nbsp;your&nbsp;opponent.&nbsp;And&nbsp;remember:&nbsp;only&nbsp;the&n     <div id="unity-loading-bar">
      <div id="unity-logo"><img src="logo.png"></div>
      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/NoobWeb.loader.js";
    const config = {
      dataUrl: buildUrl + "/NoobWeb.data.unityweb",
      frameworkUrl: buildUrl + "/NoobWeb.framework.js.unityweb",
      codeUrl: buildUrl + "/NoobWeb.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DarkPlay",
      productName: "Mr. NOOB Eat Burger",
      productVersion: "1.0",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    loadingCover.style.display = "";

    const script = document.createElement("script");
    var unityI = null;
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        _unityAwaiter.done(unityInstance);
        unityI = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        _unityAwaiter.abort(message);
        console.log(message);
      });
    };
    document.body.appendChild(script);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script><script src="Build/NoobWeb.loader.js"></script>
