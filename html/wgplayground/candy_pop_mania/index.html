<script>
    const hideFullScreenButton = "";
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Candy 158 GP nozip.loader.js";
    const config = {
        dataUrl: buildUrl + "/Candy 158 GP nozip.data.gz",
        frameworkUrl: buildUrl + "/Candy 158 GP nozip.framework.js.gz",
        codeUrl: buildUrl + "/Candy 158 GP nozip.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FullHp",
        productName: "Candy Pop Mania",
        productVersion: "1.5.0",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    const canFullscreen = (function () {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
        ]) {
            if (key in document) {
                return true;
            }
        }
        return false;
    }());

    let backgroundUnity = "url('" + buildUrl + "/') center / cover";
    canvas.style.background = "url('background.png') center / cover";

    loadingCover.style.display = "";

    canvas.addEventListener("touchstart", () => {
        window.focus()
    });
    canvas.addEventListener("pointerdown", () => {
        window.focus()
    });

    const script = document.createElement("script");
    let unityInstance;
    script.src = loaderUrl;
    script.onload = () => {
        createUnityInstance(canvas, config, _progress => {
            spinner.style.display = "none";
            progressBarEmpty.style.display = "";
            progressBarFull.style.width = `${_progress * 100}%`;
        }).then(_unityInstance => {
            loadingCover.style.display = "none";
            console.log('Scripts loaded');
            unityInstance = _unityInstance;
        }).catch(_message => {
            alert(_message);
        });
    };

    document.body.appendChild(script);
