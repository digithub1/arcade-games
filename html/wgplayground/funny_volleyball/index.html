<script>
(function () {
  const fixedAspectRatio = 0.5625;
  const fixedContainer = document.querySelector('#unity-container');
  const fixedCanvas = document.querySelector('#unity-canvas');

  function applyFixedAspectRatio() {
    if (!fixedContainer || !fixedCanvas || fixedContainer.classList.contains('unity-mobile')) return;

    const viewportWidth = Math.max(1, document.documentElement.clientWidth, window.innerWidth || 0);
    const viewportHeight = Math.max(1, document.documentElement.clientHeight, window.innerHeight || 0);
    let width = viewportWidth;
    let height = width / fixedAspectRatio;

    if (height > viewportHeight) {
      height = viewportHeight;
      width = height * fixedAspectRatio;
    }

    fixedContainer.style.setProperty('position', 'fixed', 'important');
    fixedContainer.style.setProperty('inset', 'auto', 'important');
    fixedContainer.style.setProperty('top', '50%', 'important');
    fixedContainer.style.setProperty('left', '50%', 'important');
    fixedContainer.style.setProperty('width', width + 'px', 'important');
    fixedContainer.style.setProperty('height', height + 'px', 'important');
    fixedContainer.style.setProperty('transform', 'translate(-50%, -50%)', 'important');
    fixedCanvas.style.setProperty('width', '100%', 'important');
    fixedCanvas.style.setProperty('height', '100%', 'important');
  }

  applyFixedAspectRatio();
  window.addEventListener('load', applyFixedAspectRatio);
  window.addEventListener('resize', applyFixedAspectRatio);
  window.addEventListener('orientationchange', applyFixedAspectRatio);
})();
</script>
