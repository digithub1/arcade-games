<body class="wgNoLoader"><img class="splash-bg fadein" src="https://static.wgplayground.com/0435d18f3e7251aacdb560fb6305ef4d/wgplayground/1450c4a82d359d58779e416dbe8d2da0.jpg">
	<div id="GameDiv">
		<div id="Cocos3dGameContainer">
			<canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0" width="500" height="558" wg-game-orientation="wg-portrait-game" style="aspect-ratio: 0.896057 / 1;"></canvas>
		</div>
	</div>
	<script src="src/system.bundle.js"></script>
	<script src="src/import-map.json" type="systemjs-importmap"></script>

	<script>
		let cc = null;
		let __GameLanguage = "en";

		const FIRST_SYNC_DELAY_MS = 1000;
		const SYNC_INTERVAL_MS = 4000;
		const FIRST_INTERSTITIAL_GAMEPLAY_MS = 60000;
		const INTERSTITIAL_COOLDOWN_MS = 60000;

		let syncReadyAt = 0;
		let lastSyncAt = 0;
		let syncTimer = null;
		let syncInProgress = false;
		let storageDirty = false;
		let gameplayElapsedMs = 0;
		let gameplayStartedAt = 0;
		let lastInterstitialAt = 0;
		let gameLoadedSent = false;

		const getGameplayElapsedMs = () =>
			gameplayElapsedMs + (gameplayStartedAt ? Date.now() - gameplayStartedAt : 0);

		const cleanupStorage = (storage) => {
			let removed = 0;

			for (const key of Object.keys(storage)) {
				if (storage[key] === "") {
					delete storage[key];
					removed++;
					continue;
				}

				const match = key.match(/^zdx:gameSave_(\d+)_(\d+)$/);
				if (!match) continue;

				const chapter = Number(match[1]);
				const level = Number(match[2]);
				const currentLevel = Number(storage[`zdx:chapter${chapter}_curLevel`] || 0);

				if (currentLevel > 0 && level < currentLevel) {
					delete storage[key];
					removed++;
				}
			}

			return removed;
		};

		const writeStorageSnapshot = () => {
			window.gp.player.set("game", JSON.stringify(window.gpStorage || {}));
		};

		const runStorageSync = async () => {
			syncTimer = null;
			if (!storageDirty || syncInProgress || !window.gp) return;

			storageDirty = false;
			syncInProgress = true;
			lastSyncAt = Date.now();

			try {
				await window.gp.player.sync();
				console.log("GamePush storage synced");
			} catch (error) {
				storageDirty = true;
				console.warn("GamePush sync error:", error);
			} finally {
				syncInProgress = false;
				if (storageDirty) scheduleStorageSync();
			}
		};

		const scheduleStorageSync = () => {
			storageDirty = true;
			if (!window.gp || syncTimer || syncInProgress) return;

			const now = Date.now();
			const nextAllowedAt = lastSyncAt
				? lastSyncAt + SYNC_INTERVAL_MS
				: syncReadyAt + FIRST_SYNC_DELAY_MS;

			syncTimer = setTimeout(runStorageSync, Math.max(0, nextAllowedAt - now));
		};

		const saveStorage = () => {
			writeStorageSnapshot();
			scheduleStorageSync();
		};


		const H5Manager = {
			isOnline: () => false,
			isStoreAvailable: false,
			init: () => {},

			gameLoaded: () => {
				if (gameLoadedSent) return;
				gameLoadedSent = true;
				console.log("Игра загружена");
				window.gp.gameStart();
			},

			gameplayStart: () => {
				if (gameplayStartedAt) return;
				gameplayStartedAt = Date.now();
				console.log("Игра начата");
				window.gp.gameplayStart();
			},

			gameplayStop: () => {
				if (!gameplayStartedAt) return;
				gameplayElapsedMs += Date.now() - gameplayStartedAt;
				gameplayStartedAt = 0;
				console.log("Игра остановлена");
				window.gp.gameplayStop();
			},

			setItem: (key, value) => {
				if (!window.gpStorage) window.gpStorage = {};
				window.gpStorage[key] = String(value);
				saveStorage();
			},

			getItem: (key) => {
				if (!window.gpStorage || !(key in window.gpStorage)) return null;
				return window.gpStorage[key];
			},

			removeItem: (key) => {
				if (!window.gpStorage || !(key in window.gpStorage)) return;
				delete window.gpStorage[key];
				saveStorage();
			},

			clearStorage: () => {
				window.gpStorage = {};
				saveStorage();
			},

			showRewarded: async (callback) => {
				console.log("Реворд реклама");
				try {
					const success = await window.gp.ads.showRewardedVideo();
					if (success) callback?.suCallback?.();
					else callback?.failCallback?.();
				} catch (error) {
					console.error("Ошибка rewarded рекламы:", error);
					callback?.errCallback?.(error);
				} finally {
					callback?.closeCallback?.();
				}
			},

			showInterstitial: async (onClose) => {
				const onboardingDone =
					window.gpStorage?.["zdx:enterGuide:1"] === "true" ||
					window.gpStorage?.["zdx:enterGuide:1"] === true;

				if (!onboardingDone) {
					console.log("Interstitial пропущен: onboarding ещё не завершён");
					onClose?.();
					return false;
				}

				const gameplayMs = getGameplayElapsedMs();
				if (gameplayMs < FIRST_INTERSTITIAL_GAMEPLAY_MS) {
					console.log("Interstitial пропущен: игрового времени", Math.floor(gameplayMs / 1000), "сек.");
					onClose?.();
					return false;
				}

				const now = Date.now();
				if (lastInterstitialAt && now - lastInterstitialAt < INTERSTITIAL_COOLDOWN_MS) {
					console.log("Interstitial пропущен: cooldown");
					onClose?.();
					return false;
				}

				lastInterstitialAt = now;
				console.log("Межстраничная реклама");

				try {
					return await window.gp.ads.showFullscreen();
				} catch (error) {
					console.error("Ошибка межстраничной рекламы:", error);
					return false;
				} finally {
					onClose?.();
				}
			},

			processUnconsumedPurchases: () => {}
		};

		window.H5Manager = H5Manager;

		window.onGPInit = async (gpInstance) => {
			const canvas = document.getElementById("GameCanvas");

			try {
				window.gp = gpInstance;

				const supportedLanguages = ["en", "ru"];
				const sdkLang = String(gpInstance.language || "en").split("-")[0];
				if (supportedLanguages.includes(sdkLang)) __GameLanguage = sdkLang;

				gpInstance.ads.showSticky()
					.catch((error) => console.warn("GamePush sticky error:", error));

				gpInstance.ads.showPreloader()
					.catch((error) => console.warn("GamePush preloader error:", error))
					.finally(() => { canvas.style.visibility = "visible"; });

				await gpInstance.player.ready;
				syncReadyAt = Date.now();

				const rawData = gpInstance.player.get("game");
				let parsed = {};
				if (rawData) {
					try {
						parsed = JSON.parse(rawData);
					} catch (error) {
						console.error("КРИТИЧЕСКАЯ ОШИБКА: gpStorage повреждён", error);
						throw error;
					}
				}

				if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
					throw new Error("Некорректный формат gpStorage");
				}

				window.gpStorage = parsed;
				const removed = cleanupStorage(window.gpStorage);
				if (removed > 0) {
					console.log(`GamePush cleanup: удалено ${removed} устаревших записей`);
					saveStorage();
				}
				console.log("gpStorage", window.gpStorage);

				cc = await System.import("./cocos-js/cc.js");
				await cc.game.init({
					debugMode: cc.DebugMode.NONE,
					settingsPath: "src/settings.json",
					effectSettingsPath: "",
					overrideSettings: { profiling: { showFPS: false } },
				});

				cc.game.run();
			} catch (error) {
				console.error("GamePush init failed:", error);
				canvas.style.visibility = "visible";
			}
		};

		const gameCanvas = document.getElementById("GameCanvas");
		const parentElement = gameCanvas.parentElement;
		const { width, height } = parentElement.getBoundingClientRect();
		gameCanvas.width = width;
		gameCanvas.height = height;

		window.Analytics = {};
	</script>
	<script async="" src="https://gamepush.com/sdk/gamepush.js?projectId=23750&amp;publicToken=d3roqy0n9wQT24FL5bFsP6whVtrUOFcd&amp;callback=onGPInit"></script>
