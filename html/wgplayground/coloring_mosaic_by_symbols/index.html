<script>
    (function () {
        ['contextmenu', 'dragstart'].forEach(event => document.addEventListener(event, e => e.preventDefault()));

        //iOS Safari ignores overscroll-behavior for native pull-to-refresh.
        //Block downward swipe when page is at top.
        let touchStartY = 0;
        let touchStartX = 0;
        let touchStartScrollTop = 0;
        let activeTouchScrollable = null;
        const pullToRefreshThreshold = 6;

        function getScrollableAncestor(element) {
            let node = element;
            while (node && node !== document.body) {
                if (node instanceof HTMLElement) {
                    const style = window.getComputedStyle(node);
                    const overflowY = style.overflowY;
                    const isScrollableY = (overflowY === 'auto' || overflowY === 'scroll') && node.scrollHeight > node.clientHeight;
                    if (isScrollableY) {
                        return node;
                    }
                }
                node = node.parentElement;
            }
            return null;
        }

        document.addEventListener('touchstart', (event) => {
            if (!event.touches || event.touches.length !== 1) {
                return;
            }

            touchStartY = event.touches[0].clientY;
            touchStartX = event.touches[0].clientX;
            const target = event.target instanceof Element ? event.target : null;
            activeTouchScrollable = target ? getScrollableAncestor(target) : null;
            touchStartScrollTop = activeTouchScrollable ? activeTouchScrollable.scrollTop : 0;
        }, { passive: true });

        document.addEventListener('touchmove', (event) => {
            if (!event.touches || event.touches.length !== 1) {
                return;
            }

            const touchY = event.touches[0].clientY;
            const touchX = event.touches[0].clientX;
            const deltaY = touchY - touchStartY;
            const deltaX = Math.abs(touchX - touchStartX);
            const isPullDownGesture = deltaY > pullToRefreshThreshold && deltaY > deltaX;
            const isPushUpGesture = deltaY < -pullToRefreshThreshold && Math.abs(deltaY) > deltaX;

            if (activeTouchScrollable) {
                const currentScrollTop = activeTouchScrollable.scrollTop;
                const maxScrollTop = activeTouchScrollable.scrollHeight - activeTouchScrollable.clientHeight;
                const canScrollUp = currentScrollTop > 0 || touchStartScrollTop > 0;
                const canScrollDown = currentScrollTop < maxScrollTop || touchStartScrollTop < maxScrollTop;

                // Stop overscroll chain to page when inner container reached bounds.
                if ((isPullDownGesture && !canScrollUp) || (isPushUpGesture && !canScrollDown)) {
                    event.preventDefault();
                }
                return;
            }

            const isAtTop = window.scrollY <= 0;
            if (isAtTop && isPullDownGesture) {
                event.preventDefault();
            }
        }, { passive: false });
        //ios pull-to-refresh fix end

        window.debugBox = false;
        const messages = [];
        const maxMessages = 10;

        window.showMessage = function (text) {
            if (!window.debugBox) { return; }
            const messageBox = document.getElementById('messageBox');
            const message = document.createElement('div');
            message.className = 'message';

            // Получаем текущее время с миллисекундами вручную
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const milliseconds = now.getMilliseconds().toString().padStart(3, '0');

            message.textContent = `[${hours}:${minutes}:${seconds}.${milliseconds}] ${text}`;

            messages.push(message);
            if (messages.length > maxMessages) {
                const oldMessage = messages.shift();
                messageBox.removeChild(oldMessage);
            }

            messageBox.appendChild(message);
        };

        //Пример использования:
        // setInterval(() => {
        //   showMessage("Новое сообщение: " + new Date().toLocaleTimeString());
        // }, 1000);

        function setBaseValues () {
            //console.log('r: setBaseValues');

            // Пока ширина меньше или равна высоте, то она используется как основная единица для расчета размеров интерфейса
            // Если ширина больше высоты, то используется высота.
            //let side = window.innerHeight >= window.innerWidth ? window.innerWidth : window.innerHeight;

            //let unit = (side * 0.01).toFixed(4);
            const windowHeight = window.innerHeight;
            if (windowHeight < 100) {//Баг яндекс-браузера, иногда высота равна 0
               document.body.style.setProperty('--vhg', `1vh`);
            } else {
                let vh = (window.innerHeight * 0.01).toFixed(4);
                //document.body.style.setProperty('--vhg', `${vh}px`);
                document.body.style.setProperty('--vhg', `${vh}px`);
            }
            //document.documentElement.style.fontSize = `${unit}px`;
            //console.log(`setBaseValues:  ${window.innerWidth} * ${window.innerHeight}`);
            //window.showMessage(`setBaseValues:  ${window.innerWidth} * ${window.innerHeight}`);
        }

        // Используется в других местах, для добавления доп. обработчиков при resize
        // window.resizeCallbacks = [setBaseValues];
        window.resizeCallbacks = [setBaseValues];

        //const start = performance.now();
        document.addEventListener('DOMContentLoaded', function () {
            document.body.dataset.debug = debugBox ? 'on' : 'off';
            //const end = performance.now();
            //window.showMessage(`DOMContentLoaded: ${(end - start).toFixed(3)} мс`);
            //window.showMessage(`width * height:  ${window.innerWidth} * ${window.innerHeight}`);
            setBaseValues();

            // try {
            //   window.showMessage("userAgent: " + navigator.userAgent);
            // } catch (e) {}

            let resizeTimer;

            window.addEventListener('resize', () => {
                //console.log('r: resize');

                clearTimeout(resizeTimer); // Удаляем предыдущий таймер
                resizeTimer = setTimeout(() => {
                    requestAnimationFrame(() => {
                        //window.showMessage(`[resize] width * height:  ${window.innerWidth} * ${window.innerHeight}`);
                        window.resizeCallbacks.forEach(cb => {
                            try {
                                cb();
                            } catch (e) {
                                throw new Error(`[resizeCallbacks] ${e.message}\n${e.stack}`);
                            }
                        });
                    });
                }, 300); // Ждём 0.3 секунды после последнего события

                // Тест скорости перерисовки: было 0.1-0.2мс
                // const start = performance.now();
                // requestAnimationFrame(() => {
                //   const end = performance.now();
                //   console.log(`resize: ${(end - start).toFixed(3)} мс`);
                // });

            });
        });


    })();
</script>
