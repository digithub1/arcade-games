            <meta property="wgp:description" content="A board game in which a chain of dominoes (&quot;bones&quot;, &quot;stones&quot;) is built, touching halves with the same number of dots indicating the number of points.You can play the game with artificial intelligence or with an opponent online in multiplayer mode.A classic set has 28 dominoes, they are also called stones or bones. These rectangles are divided into 2 parts, each with dots from 0 to 6.Two players play the game. At the beginning of the game, 7 bones are dealt to each player.The remaining ones are kept aside in reserve, with the clean side up (on the market).">
            <meta property="wgp:instructions" content="The player who has a double 6-6 starts, he puts up a bone. The next players place 6-1, 6-2, etc., respectively.After the first move, the players take turns placing suitable chips with the same value as the last one placed on the table. If there are no suitable ones, then additional ones are taken from the reserve (at the market). The more bones a player takes from the reserve, the further he is from winning, since it is not advantageous to have many tiles in dominoes.The game ends when one of the players places his last stone. The winner is credited with the sum of the points of all the stones remaining in the loser's hand. The game can end when there are stones in hand, but nothing to report - &quot;fish&quot;. In this situation, the winner belongs to the one with the fewest points. The difference in points is recorded as his win.In a new round, the winner of the previous round makes the first move.The game continues until a pre-agreed sum is reached: 50, 100, 150, 200, 250, 300 points.">
