            <meta property="wgp:description" content="Gomoku: five stones in a row is a board logic game for two players. On a square board measuring 19x19 (in the traditional version) or 15x15 (in the modern sports version) points, players alternately place stones of two colors. The winner is the one who is the first to build a continuous row of five stones of his color vertically, horizontally or diagonally. It has many options, differing in individual details of the rules. The game is believed to have been invented in China more than two thousand years ago. Currently, the game is known all over the world; sporting competitions are held based on it.The game can be played with artificial intelligence, together with another person on the same device, or with an opponent online in multiplayer mode.">
            <meta property="wgp:instructions" content="The game is played on a square field (board), lined with vertical and horizontal lines. The intersections of lines are called points. The board size can be selected from: 9x9, 11x11, 13x13, 15x15, 17x17, 19x19.There are two sides playing - black and white. Each side uses chips (stones) of its own color.Each move, a player places a stone of his color in one of the free points on the board. Black makes the first move. Then the moves are made one by one.The goal of the game is to be the first to build a continuous row of five stones in a horizontal, vertical or diagonal direction using stones of your color.If the board is full and no player has made a row of five stones, a draw may be declared.">
