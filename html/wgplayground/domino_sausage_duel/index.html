            <meta property="wgp:description" content="A game in which players actively try to get rid of their dominoes by redirecting them to another player through a &quot;cut&quot; part of the chain, which makes the game more dynamic and intense.The game can be played with artificial intelligence or with an online opponent in multiplayer mode.All dominoes are divided equally, with 14 open dominoes each. It is the open version of the game that is implemented, and not the closed one, where the dominoes are in a closed state for the players and where only one domino opens from the edge during the player's turn. The option with all the open dominoes is more dynamic and interesting.">
            <meta property="wgp:instructions" content="The one with the one-on-one dominoes goes first. He can walk with any of his dominoes. The game is played in two parallel lines from the first domino. The players take turns laying out dominoes that match the numbers to the end of the already laid out chain. A domino is placed so that one of its sides touches a domino in a chain with the same number.The player can cut the sausage to his opponent. To do this, if the player takes out dominoes, for example 3 and 4, and there are 3 and 4 laid out in parallel on the table, then you can cut them off. The opponent takes the cut sausage.The game ends when one of the players lays out all his dominoes or when the chain is blocked (no one can make a move). In case of blocking, the players count the points on their remaining dominoes and the player with the least points wins.">
