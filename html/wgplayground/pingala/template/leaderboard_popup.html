<!-- Popup лидеров -->
<div id="leaderboard_popup" class="leaderboard_popup hidden">
    <div class="popup_overlay"></div>
    <div class="popup_container">
        <div class="popup_header">
            <h2 class="popup_title" id="leaderboard_title"></h2>
        </div>
        <div class="popup_content">
            <div class="leaderboard_entries" id="leaderboard_entries">
                <!-- Записи лидеров будут добавлены динамически -->
            </div>
            <div class="leaderboard_loading hidden" id="leaderboard_loading">
                <span class="loading-spinner">🌀</span>
            </div>
            <div class="leaderboard_error hidden" id="leaderboard_error">
                <span class="error-text">Не удалось загрузить таблицу лидеров</span>
            </div>
        </div>
        <div class="popup_footer">
            <button class="popup_button" id="leaderboard_close_button"><span id="leaderboard_close_button_text"></span></button>
        </div>
    </div>
</div>
