<!-- UI для отображения статистики игры (комбо и очки) -->
<div id="game_stats_ui">
    <div class="stats_container">
        <div class="stat_item combo">
            <span class="stat_label" id="combo_label"></span>
            <span class="stat_value" id="combo_value">0</span>
        </div>
        <div class="stat_item score">
            <span class="stat_label" id="score_label"></span>
            <span class="stat_value" id="score_value">0</span>
        </div>
    </div>
</div>
