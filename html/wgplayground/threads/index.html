<script>
    (function () {
      var DEBUG_ERROR_ALERTS = false;
      var nativeAlert = window.alert;

      function blockAlertAndLog(message) {
        if (DEBUG_ERROR_ALERTS && typeof nativeAlert === "function") {
          nativeAlert.call(window, message);
          return;
        }
        console.warn("[WebGL][alert blocked]:", message);
      }

      window.alert = blockAlertAndLog;

      window.addEventListener(
        "error",
        function (e) {
          console.error("[WebGL][window.error]:", {
            message: e.message,
            filename: e.filename,
            lineno: e.lineno,
            colno: e.colno,
            error: e.error
          });
          e.preventDefault();
          e.stopImmediatePropagation();
        },
        true
      );

      window.addEventListener(
        "unhandledrejection",
        function (e) {
          console.error("[WebGL][unhandledrejection]:", e.reason);
          e.preventDefault();
          e.stopImmediatePropagation();
        },
        true
      );
    })();
  </script>




 <script>

        (function () {

            function benignReason(reason) {

                if (reason === undefined || reason === null) return false;
                var msg =
                    typeof reason === 'object' && reason !== null && reason.message != null
                        ? String(reason.message)
                        : String(reason);
                return msg === 'cancel' || msg === 'user_not_logged_in';
            }
            window.addEventListener(
                'unhandledrejection',
                function (e) {

                    if (!benignReason(e.reason)) return;
                    e.preventDefault();
                    e.stopImmediatePropagation();
                },
                true
            );
        })();
    </script>
