<body class="wgNoLoader"><img class="splash-bg fadein" src="https://static.wgplayground.com/3afd5fe5317bf1694bb7e8ac43f06b3b/wgplayground/3a2a48062c37752a5ddb7745cab8c4f0.jpg">
  <div id="stage"><canvas width="1000" height="1116" style="touch-action: none; width: 500px; height: 558px;" wg-game-orientation="wg-portrait-game"></canvas></div>

  <div id="bar">
    <div class="brand">
      <div class="mark"></div>
      <h1>Chroma Echo<span>music playground</span></h1>
    </div>

    <div class="group">
      <button id="play" title="Play / Pause"><svg class="icon" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z"></path></svg></button>
      <div class="badge"><span id="layers">0 / 7</span><small>FRIENDS</small></div>
    </div>

    <div class="group">
      <span class="glabel">Tempo</span>
      <input id="bpm" type="range" min="72" max="140" step="1" value="100">
      <span id="bpmVal">100</span>
    </div>

    <div class="group">
      <span class="glabel">Key</span>
      <div id="keys"><button class="key on" data-k="C">C</button><button class="key" data-k="D">D</button><button class="key" data-k="E">E</button><button class="key" data-k="F">F</button><button class="key" data-k="G">G</button><button class="key" data-k="A">A</button></div>
    </div>

    <div class="actions">
    <button class="btn" id="surprise" title="Auto-build a mix"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l3 3M20 4l-3 3M12 3v2M5 12H3M21 12h-2"></path><circle cx="12" cy="14" r="6"></circle></svg><span class="lbl">Surprise</span></button>
    <button class="btn" id="mute" title="Mute all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M16 9c1.5 1.5 1.5 4.5 0 6"></path><path d="M19.5 6.5c3 3 3 8 0 11"></path></svg><span class="lbl">Sound</span></button>
    <button class="btn" id="share" title="Save &amp; share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg><span class="lbl">Save</span></button>
    <button class="btn" id="clear" title="Clear stage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg><span class="lbl">Clear</span></button>
    </div>
  </div>

  <!-- intro -->
  <div id="intro">
    <div class="card">
      <div class="logo"><div class="smile"></div></div>
      <h2>Chroma Echo</h2>
      <p>A tiny pastel music playground. Drag the little friends onto the stage — each one sings its own loop, and together they build a song. 🎵</p>
      <button id="startBtn">Let's play!</button>
    </div>
  </div>

  <!-- share modal -->
  <div id="shareModal">
    <div class="modal-card">
      <button class="close" id="shareClose">✕</button>
      <h3>Save &amp; share 🎈</h3>
      <p>Copy your mix code to save it, or paste one to load a friend's song.</p>
      <label>Your mix code</label>
      <textarea id="shareCode" readonly=""></textarea>
      <div class="row"><button class="btn primary" id="copyCode">Copy</button></div>
      <label style="display:block;margin-top:14px;">Load a code</label>
      <input id="pasteCode" placeholder="paste a mix code here…">
      <div class="row"><button class="btn primary" id="loadCode">Load it</button></div>
      <div id="loadMsg"></div>
    </div>
  </div>

  
  <script src="game/costumes.js"></script>
  <script src="game/audio.js"></script>
  <script src="game/visuals.js"></script>
  <script src="game/main.js"></script>
  <script src="game/ui.js"></script>
  <script>
    (async function () {
      try { await document.fonts.ready; } catch (e) {}
      const game = new CE.Game(document.getElementById('stage'));
      CE.ui.init(game);
      game.restore();
      const intro = document.getElementById('intro');
      document.getElementById('startBtn').addEventListener('click', () => {
        game.engine.init(); game.engine.resume();
        intro.classList.add('fade-out');
        setTimeout(() => intro.style.display = 'none', 460);
        if (game.activeCount() > 0) { game.play(); }
        else { game.assign(2, 'kick'); game.assign(4, 'pad'); } // gentle starter bed (auto-plays)
      });
      window.__game = game;
    })();
  </script>
