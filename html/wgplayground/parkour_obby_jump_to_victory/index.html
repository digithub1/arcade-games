<style>
  html, body {
      padding: 0;
      margin: 0;
      overflow: hidden;
      user-select: none;
      height: 100%;
      background: #000; /* Черный фон */
  }

  /* CANVAS */
  canvas:focus {
      outline: none;
  }

  /* LOGO — закругление + белая обводка */
  #unity-logo img {
      border-radius: 12px;
      border: 2px solid #fff;
      display: block;
      max-width: 100%;
  }

  /* ОБЩИЙ Контейнер загрузки */
  #unity-loading-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
  }

  /* ПУСТАЯ ОБЛАСТЬ БАРА (фон) */
  #unity-progress-bar-empty {
      width: 280px;
      height: 18px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid white;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
  }

  /* ЗАПОЛНЯЮЩАЯ ПОЛОСА (прогресс) */
  #unity-progress-bar-full {
      height: 100%;
      background: white;
      border-radius: 12px;
      width: 0%;
      transition: width 0.3s ease;
  }
</style>


<style>.fadein{animation: 3s linear 0s fadein;}.splash-bg {visibility:hidden;object-fit: contain;position: absolute;left: 0;top: 0;filter: blur(3px) opacity(0.9);transform: scale(2.5) translate(-50%, -50%); top:50%; left:50%; z-index:-1;} .splash-bg.fadein{visibility:visible}canvas, iframe[data-src*="wgplayground.com"] {box-shadow: rgba(0, 0, 0, 0.6) 0px 0px 30px;}@keyframes fadein {from {opacity:0;}to {opacity:1;}}</style><script src="gamepush.js"></script></head>

      </div>
      <div class="spinner" style="display: none;"></div>
    </div>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Build.loader.js";
    const config = {
      dataUrl: buildUrl + "/df60192fa440c483a96ab248c362d1dd.data.unityweb",
      workerUrl: buildUrl + "/df60192fa440c483a96ab248c362d1dd.data.unityweb",
      frameworkUrl: buildUrl + "/f660bac8d6648054accba315f23b41a7.js.unityweb",
      codeUrl: buildUrl + "/6cccbf74b364773e73d4e93a79ca36d3.wasm.unityweb",
      // #if MEMORY_FILENAME
      //   memoryUrl: buildUrl + "/",
      // #endif
      // #if SYMBOLS_FILENAME
      //   symbolsUrl: buildUrl + "/",
      // #endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ElezthemGames",
      productName: "Parkour Obby Jump to Victory",
      productVersion: "1.0.0",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (overlayBackgroundColor !== " " && overlayBackgroundColor !== ""){
      canvas.style.background = overlayBackgroundColor;
    }

    if (progressBarFillColor !== " " && progressBarFillColor !== ""){
      progressBarFull.style.background = progressBarFillColor;
    }

    if (progressBarBackgroundColor !== " " && progressBarBackgroundColor !== ""){
      progressBarEmpty.style.background = progressBarBackgroundColor;
    }

    if (progressBarBorderColor !== " " && progressBarBorderColor !== ""){
      progressBarEmpty.style.border.color = progressBarBorderColor;
    }

    if (backgroundFileName !== " " && backgroundFileName !== ""){
      canvas.style.background = "url('" + backgroundFileName + "') center / cover";
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    // #if BACKGROUND_FILENAME
    // canvas.style.background = "url('" + buildUrl + "/') center / cover";
    // #endif

    loadingCover.style.display = "";

        // Выключаем появление меню при правом клике мыши
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Возвращаем фокус, если кликнули по экрану
        function FocusGame() {
            window.focus();
            canvas.focus();
        }

        window.addEventListener('pointerdown', () => {
            FocusGame();
        });
        window.addEventListener('touchstart', () => {
            FocusGame();
        });

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = async () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        console.log(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script><script src="Build/Build.loader.js"></script>
